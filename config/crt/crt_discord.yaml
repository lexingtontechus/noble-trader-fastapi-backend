# config/crt/crt_discord.yaml — the SELF-CONTAINED #crt Discord signal config.
#
# The CRT lab + engine signals land in the operator's Discord channel #crt.
# The sender is fail-open: any failure (timeout, 4xx/5xx, 429) is logged to
# stderr and skipped — a Discord outage never fails a run. --no-discord
# disables per run; enabled: false disables globally.
#
# WEBHOOK URL (operator instruction, 2026-11-15): set the environment
# variable DISCORD_WEBHOOK_CRT — it takes precedence over any value here,
# so the secret lives in the environment, not the repo:
#   export DISCORD_WEBHOOK_CRT="https://discord.com/api/webhooks/<id>/<token>"
# The webhook_url below is a documented fallback for deployments that prefer
# file config (empty by default). If the webhook is ever exposed, rotate it
# (Discord channel -> Integrations -> Webhooks) and update the env var —
# zero code changes.

enabled: true
channel_label: "#crt"
username: "CRT-0 Lab"
webhook_url: ""                       # prefer DISCORD_WEBHOOK_CRT (see header)

timeout_seconds: 10.0
max_attempts: 2                                # 1 retry on 429/5xx (bounded)

rate_limit:                                    # Discord's documented budget
  messages_per_window: 5
  window_seconds: 2.0
  max_sleep: 3.0                               # cap on any single throttle/retry-after sleep

max_content_chars: 1900                        # < Discord's 2000 cap

events:                                       # which lab events reach #crt
  handshake: true                              # run start: runid, symbols, span
  baseline: true                               # A0 verdict: edge after costs at v3 settings?
  walkforward: true                             # OOS verdict: options enabled, EV/t, gated sums
  mint: true                                   # artifact minted: path, rows, enabled, train_end
  error: true                                  # pipeline failure (the run still exits cleanly)
