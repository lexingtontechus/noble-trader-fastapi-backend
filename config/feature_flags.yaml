# STATUS 2026-09-20 — MAINTAINED BUT A NON-FACTOR on light qualification:
#   Live value 1.5. Typical heavy-picked brick geometries already have
#   RR = tp_bricks/sl_bricks ≈ 1.67 (5/3) to 2.0+ (6/3), so `rr >= 1.5`
#   almost never binds. Studio reject logs (same period) show light
#   qualification failing on kelly_min_ok / regime_conf_ok / p_win_ok —
#   ev_allowed/RR is not the volume bottleneck. RR is a geometry
#   parameter, not a per-signal strength rank; a 1.5–2.0 "tier" will not
#   separate strong vs weak signals.
#
# Do NOT raise this light-path value to 2.0 as a quality lever — that
# rejects default 5/3 geometry (RR 1.67) en masse (geometry choke), which
# is what the 2026-08-30→09-04 regression accidentally did. Keep the key
# at 1.5; keep light + heavy reading this same key; treat RR as
# diagnostic/payload (passed_gates['rr']) and as a heavy-grid geometry
# filter only. dynamic_min_rr (1.5→2.0 step / matrix) is superseded —
# do not flip live. Code path unchanged (2026-09-20 user decision).
#
# History: shared single-source after 2026-08-13 heavy/light MIN_RR split
# incident; 2026-09-04 restored 1.5 after silent yaml ship at 2.0.
min_rr: 1.5

# Heavy-sweep grid quality filter, alongside min_rr above (2026-08-30,
