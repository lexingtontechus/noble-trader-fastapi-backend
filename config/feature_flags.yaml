# Feature Flags — git-tracked config for deliberately-set mode flags and
# thresholds (read by regime_platform/core/feature_flags.py).
#
# What belongs here vs. elsewhere (2026-08-26 config-centralization
# correction, worklog/20260825_PIPELINE_OVERVIEW_EV_FEEDBACK_LOOP.md):
#   - Real secrets (API keys, credentials, tokens) -> Lightning AI Studio
#     Secrets. Not this file.
#   - Runtime state the app writes automatically (the Tier D auto-tuner)
#     -> config/tuning_registry.yaml (gitignored on purpose — a tracked
#     file that something else keeps rewriting just goes stale, see
#     .gitignore's own note on config/brick_params.yaml). Not this file.
#   - Config a person deliberately sets (mode flags, thresholds) -> HERE.
#     Committed, reviewable in a diff, no platform UI required to know
#     what's actually running.
#
# IMPORTANT: regime_platform/core/feature_flags.py does NOT consult any
# environment variable for these keys. A leftover Studio Secret with a
# matching name (e.g. MARKOV_SOURCE_MODE) has ZERO effect — this file is
# the sole source of truth. Edits take effect on the next read (the
# loader checks the file's mtime on every call) — no restart required.

# Qualification gate thresholds (light-sweep + heavy-sweep qualification —
# orchestrator.py::_process_symbol / heavy_sweep.py::_evaluate_heavy_
# qualification). 2026-09-08 config-centralization fix: these 5 were still
# being read straight from os.getenv(...) with a code-level fallback
# default, each one an ACTIVE Studio-Secret/`.env.local` entry with no
# feature_flags.yaml counterpart — the exact same undetectable-divergence
# shape that caused the MIN_RR incident (worklog/20260904_MIN_RR_REGRESSION.md),
# just not yet triggered. Found via a same-day audit, not assumed. Values
# below are what `.env.local`/Studio actually held at migration time (read
# directly, not the code's bare fallback) — verify these still match
# intended live behavior; if Studio's real values differ from these, THAT
# divergence is exactly what this migration exists to surface and end.
# Also declared in regime_platform/core/tuning_registry.py's PARAM_BOUNDS
# (Tier C, "gate thresholds") as future Layer-1-autonomous-tuner
# candidates — that tuner isn't built yet, so this file is the actual read
# path today, same relationship MIN_RR (below) already has with that
# registry.
qualification_gates:
  min_regime_conf: 0.60        # Gate 2: HMM confidence
  min_kelly: 0.02              # Gate 3: Kelly minimum
  min_timesfm_confidence: 0.05 # Gate 5: TimesFM certainty
  min_ev: 0.0                  # Gate 6a: EV minimum
  min_p_win: 0.55              # Gate 6b: blended p_win minimum

# timesfm_gate_mode: hard|soft|off — controls how TimesFM confidence
# affects signal qualification (see orchestrator.py's own inline comment
# at TIMESFM_GATE_MODE's usage for the full hard/soft/off semantics). Same
# config-centralization fix as qualification_gates above.
timesfm_gate_mode: soft

# TimesFM price→probability mapping (Batch F, 2026-09-16). Sole source of
# truth — orchestrator no longer reads TIMESFM_SIGMOID_K / CLAMP_* env.
# Production intent: k=10, clamp [0.05, 0.95] (k=20 was chronically
# overconfident; see orchestrator comment history).
timesfm:
  sigmoid_k: 10.0
  clamp_min: 0.05
  clamp_max: 0.95

# timesfm_map_mode (2026-09-17): sigmoid | zmap_shadow | zmap_live.
# Probes showed TimesFM rel_change ~0.01-0.1% → k-sigmoid p≈0.5 always.
# z-map: p = Φ(rel_change / max(σ_symbol, floor)) with rolling local σ.
# FLIPPED zmap_live 2026-09-18: shadow probes showed real p_zmap spread
# (0.17-0.89). EV now uses z-map; TimesFM reinforces trade direction
# (P(up) inverted for shorts — see ev_engine.compute_ev).
timesfm_map_mode: "zmap_live"

# sweep_after_hours: when true, sweep ALL symbols regardless of market
# hours (crypto is always 24/7 and forex Sun-Fri regardless of this flag —
# it only affects stocks/commodities). NOTE: `.env.local`'s actual value
# was `1` (true) at migration time, which is the OPPOSITE of the code's
# own documented "recommended"/fallback default (false, skip stocks/
# commodities when market is closed) — flagging this explicitly since it's
# a real, surprising divergence between the code comment's stated
# expectation and the value actually configured; worth confirming this is
# intentional rather than assuming either way.
sweep_after_hours: False

# Price staleness detection (2026-10-04) — replaces legacy market-hours gating.
# If the latest price bar is older than max_staleness_hours, skip the symbol.
# This prevents signals from being generated on a frozen feed (weekend/holiday
# close, or a TDVA outage returning the last known bar).
# Light-sweep candles are 1h, so the newest bar is naturally 0-60 min old on a
# live feed; 1.0h is the bar interval + slack. Set to 0 to disable.
price_staleness_max_hours: 1.0

# signal_cooldown_minutes: suppress (not fail) repeat publishes for the same
# (symbol, direction) within this many minutes of the last publish. Pure
# wall-clock anti-spam — never gated on trade open/resolve. 2026-09-27 D1:
# 15 min = one publish per light-sweep slot (was 60, a 5-min-era leftover).
signal_cooldown_minutes: 15

# expiry_rate_alert (2026-09-08, worklog
# 20260908_PRICING_SCORING_ROOT_CAUSE_AND_SCOPE.md, priority #3): a signal
# that neither hits TP nor SL within the 48h deadline is deliberately
# excluded from win/loss/PnL (a timeout is neither) -- but a persistently
# high expiry rate is itself a real signal-quality problem and needs its
# own visibility instead of silently vanishing from the win/loss stats.
# Checked once per day (end of the eod-lookback resolver run, after fresh
# 7-day numbers exist) against v_symbol_signal_scorecard_7d; fires a
# Discord risk alert (#system-status) per symbol over threshold_pct,
# gated by cooldown_hours so a persisting condition doesn't spam daily.
# threshold_pct=50 chosen from today's real spread (AUDUSD 83.8%, EURUSD
# 75.4%, XAUUSD 47.7%, XAGUSD 36.8% at build time) -- roughly the point
# where "more signals time out than resolve" starts, not a settled
# long-term number. min_resolved=15 avoids alerting on small, noisy
# samples (a new symbol with 3 resolved signals and 2 expired shouldn't
# page anyone).
expiry_rate_alert:
  enabled: true
  threshold_pct: 50.0
  min_resolved: 15
  cooldown_hours: 24.0

# calibration_bias_min_episodes (2026-09-08, worklog
# 20260908_PRICING_SCORING_ROOT_CAUSE_AND_SCOPE.md): the calibration-bias
# enforcement mechanism (fetch_calibration_bias/_raw, supabase_client.py)
# now groups nt_calibration_records into independent EPISODES (records
# whose [entered_at, closed_at] windows overlap in time are riding the
# same underlying price move, not separate evidence) before computing
# bias -- replaces the 2026-08-25 distinct-calendar-days discount, which
# USDCHF's incident showed can be evaded (a burst spanning exactly 3
# calendar dates while being one continuous 68h episode sailed straight
# through that guard). Below this many real episodes in the 7-day
# window, fetch_calibration_bias(_raw) returns None (same "insufficient
# data" path as too few raw records) instead of a verdict computed on
# thin/correlated evidence.
#
# 2 is a deliberately conservative starting point, not settled: real
# data at build time showed most symbols sitting at only 1-7 independent
# episodes per week (USDCHF had exactly 1; AAPL, the most active, had 7).
# This number directly controls how often the OVERCONFIDENT/UNDERCONFIDENT
# enforcement can fire at all -- too high and it goes permanently
# dormant, too low and it's back to treating noise as evidence. Needs
# monitoring against real post-deploy data (nt_roadmap).
calibration_bias_min_episodes: 2

# signal_stream_meta_model_mode (2026-09-09, worklog
# 20260909_CALIBRATION_AND_SCORING_METHODOLOGY_REFRAME.md sections 3-5):
# off | shadow | live. A 2-state GaussianHMM (regime_platform/
# sweep_orchestrator/meta_regime_model.py) fit on the signal-generation
# stream itself (regime-label persistence + confidence), not raw price --
# detects whether the signal stream is currently "coherent" or "noisy",
# fit on a long local lookback history (signal_stream_cache.py, SQLite)
# rather than a fixed short block. off: nothing runs. shadow: compute and
# log/persist the state, zero effect on qualification or Kelly sizing.
# live: not a currently-supported value yet -- no consumer reads this
# state for a real decision yet, wiring that in is future work.
#
# Ships at `off` deliberately, same shadow-first discipline as every
# other new mechanism this session (heavy_sweep_atr_anchored_bricks_mode,
# heavy_sweep_deadline_aware_scoring_mode, regime_label_debounce_mode).
#
# v1 (build time) found a real limitation via real-data smoke test: the
# model's binary label-persistence feature dominated the fit over the
# more continuous columns, so it reliably caught regime-label
# flip-flopping but missed a confidence SPIKE with no label change --
# exactly the XAUUSD 2026-09-07 13:01 case that motivated this work
# (regime_conf spiked 0.477->0.896, label never changed).
#
# v2 (same day) fixed it: added regime_conf_volatility (rolling std of
# regime_conf, NOT p_win -- the real spike was in regime_conf) as a 4th
# feature. Re-validated on the same real XAUUSD data: the 13:01 moment
# now reads 97.9% noisy (was 100% coherent), a genuinely resolves case,
# while a genuinely calm moment (11:30) still correctly reads coherent.
# See worklog section 10 for the full detail, including a test-
# construction lesson (a deterministic period-2 value alternation is NOT
# a valid "noisy" test case -- a 2-state Markov chain represents that
# perfectly, it isn't noise) and an investigated-not-just-noted
# convergence warning on the real 1000-tick fit (raising n_iter does not
# fix it -- EM's own monotonicity check stops it at iteration 6
# regardless of budget; not blocking, prediction quality was still
# correct on the validated example).
#
# 2026-09-09: flipped off -> shadow. The blocker to shadow was never "the
# fix needs more validation" -- shadow mode itself IS the validation
# mechanism. The actual blocker was that nothing wired
# signal_stream_cache.append_tick() into the live sweep or persisted a
# comparison anywhere (nt_signal_stream_meta_shadow, migration 147) --
# "weeks of shadow-mode data" was never going to accumulate on its own
# without that plumbing existing. Now every non-neutral signal (qualified
# or not) feeds the local lookback cache, and once >= MIN_TICKS_TO_FIT
# (50) ticks of history exist per symbol, every tick updates
# nt_signal_stream_meta_shadow with the current coherent/noisy read --
# visible and queryable from the first fit onward, not after weeks.
# Still zero effect on qualification or Kelly sizing (shadow, not live).
signal_stream_meta_model_mode: off

# MARKOV_SOURCE_MODE: which source feeds p_markov_hold_n's 3x3 {UP,DOWN,
# FLAT} transition matrix. legacy_hmm (the separate, numerically-unstable
# 5-state HmmModel) | trend_hmm_shadow (compute both, log+persist a
# comparison to nt_markov_source_shadow, legacy still feeds the live
# blend — zero behavior change) | trend_hmm_live (RegimeHMM's own
# transition matrix feeds the blend instead, and the legacy model's
# per-tick refit is skipped entirely). See orchestrator.py's docstring
# near MARKOV_SOURCE_MODE usage for full detail.
#
# 2026-10-01 — SHADOW RETIRED, back to legacy_hmm. The trend_hmm_shadow
# comparison ran 2026-08-25 -> 2026-10-01 and answered its question
# negatively, so it is no longer computed by default:
#   * accuracy (nt_hmm_shadow_accuracy): legacy won 13/14 symbols;
#     weighted 0.5274 vs 0.3191. USDJPY (trend +0.0007) is a tie.
#   * state disagreement (nt_markov_source_shadow): 65.9% over 63,919
#     compares vs a 66.7% 3-class random baseline — the two classifiers
#     were statistically indistinguishable from independent random
#     agreement, with no convergence across 5 weeks.
# The trend_hmm_shadow / trend_hmm_live code paths are deliberately LEFT
# IN PLACE (dormant) so a future re-evaluation needs only a YAML edit.
# Full evidence: worklog/kairos/reports/20261001_rm1_markov_source_eval.md.
markov_source_mode: legacy_hmm

# p_markov_hold_n_mode: off | live — whether p_markov_hold_n participates
# in the EV P_win blend at all.
#
# 2026-10-01 — OFF. The RM-1 evaluation showed NEITHER candidate source
# was informative (legacy 0.527 weighted accuracy is barely above a
# 3-class coin flip; trend_hmm 0.319 is below it), so the source was not
# earning its 0.20 weight. With this off, the sweep passes no
# transition_matrix / current_state / p_markov_override to compute_ev()
# and the engine's existing missing-source renormalisation drops it —
# the blend becomes p_regime 0.5 / p_timesfm 0.5 (P_WIN_WEIGHTS_FULL's
# 5:5 relative weights).
#
# IMPORTANT — this does NOT stop the legacy HmmModel from fitting every
# tick. It still feeds the TA feature buffer and nt_sweep_result's legacy
# markov_p_up / markov_p_dn columns, which are captured for the
# "bolster legacy HMM" research programme (the substrate that programme
# measures against). Flipping to "live" restores the source to the blend;
# it must clear that programme's re-entry bar first.
#
# NOTE: quoted deliberately — unquoted `off` is parsed by YAML 1.1 as the
# BOOLEAN False, not the string "off" (get_p_markov_hold_n_mode() would
# still resolve it correctly via its fail-closed parse, but the file would
# read as a boolean to every other consumer, including a reviewer).
p_markov_hold_n_mode: "off"

# ev_scale_sizing_mode (2026-10-02; worklog/20261002_SIGNAL_QUALITY_PLAN.md §3.2).
# on | off — does ev_scale multiply position size in the sweep path?
#
# "on" (shipped default) keeps effective_kelly = kelly_f × ev_scale, unchanged.
#
# "off" drops the ev_scale factor, so size becomes kelly_f × 1.0. Rationale:
# ev_scale = min(1, ev_per_dollar / 0.50) is a function of p_win, and p_win
# measures at bracket AUC 0.4869 with REL 0.0616 vs RES 0.0008 — below-chance
# discrimination, overconfident (worklog/kairos/reports/20261002_calibration_decomp.md).
# Multiplying position size by a quantity with negative skill is worse than not
# using it.
#
# The change is NOT sizing-neutral. Removing the p_markov source from the blend
# alone moved mean ev_scale 0.5576 → 0.8403 and took 23.05% of signals from
# unsized (ev_scale = 0) to sized (kairos/reports/20261002_leverage_eval.md).
# Flipping this to "off" removes that whole lever in the other direction.
#
# Restore to "on" only when a calibrated probability replaces p_win inside
# ev_scale (20261002_SIGNAL_QUALITY_PLAN.md Phase 3). Quoted deliberately —
# unquoted `on`/`off` are parsed by YAML 1.1 as booleans, not strings.
ev_scale_sizing_mode: "on"

# eod_resolver_basis (2026-10-02; worklog/20261002_SIGNAL_QUALITY_PLAN.md §3.1).
# close_walk | intrabar — the EOD resolver's TP/SL basis.
#
# "close_walk" (shipped default) is unchanged: post-entry CLOSES, first close
# beyond a level wins. Optimistic — a bar whose close sits between SL and TP
# counts as "no touch" even when its wick crossed one.
#
# "intrabar" walks post-entry HIGH/LOW, so a level is touched if price traded
# through it at any point in the bar. Same basis as the mae_*_pct / mfe_*_pct
# columns (migration 170), which is what makes a survivable label internally
# consistent — and what removes the "57.7% is an upper bound" caveat on the
# ghost-edge measurement (quant-audit R1, "close-only ≠ first-touch").
#
# THIS CHANGES OUTCOME SEMANTICS. Flipping it re-labels tp_hit/sl_hit on every
# future resolution, changes nt_calibration_records, and moves the survivor
# base rate (0.1186 on the close-walk label vs 0.2805 bracket). Do NOT flip
# without re-running the §3.1 kill criterion, and expect the old and new
# labels to be non-comparable across the changeover.
#
# Same-bar both-touched resolves sl_first (conservative, matches live) and is
# reported as "ambiguous" by the resolver. Quoted deliberately.
#
# FLIPPED TO "intrabar" 2026-10-02. The §3.1 kill criterion was run FIRST and NOT
# met at any horizon (ghost gap 0.116-0.190 across 4h/24h/48h), so the close-walk
# label was genuinely optimistic. Because the flip re-labels history, this must
# ship WITH a cutover timestamp (see calibration_cutover_mode below) or the
# calibration loop mixes two bases.
eod_resolver_basis: "intrabar"

# calibration_cutover_mode (2026-10-02; migration 192).
# on | off — restrict calibration reads to post-cutover evidence.
#
# "on" (shipped with the basis flip): the bias readers query
# v_calibration_records_current instead of nt_calibration_records, so records
# labelled under the OLD close_walk basis are excluded from bias / Brier /
# enforcement. Calibration restarts fresh and accrues clean evidence forward.
#
# BOTH views are INERT while nt_calibration_cutover is empty — they pass every
# row. So this flag can ship "on" safely; it only starts filtering once an
# operator sets the timestamp:
#
#   INSERT INTO nt_calibration_cutover (id, cutover_at, basis, note)
#   VALUES (1, now(), 'intrabar', 'eod_resolver_basis flip')
#   ON CONFLICT (id) DO UPDATE SET cutover_at = EXCLUDED.cutover_at;
#
# Pre-cutover rows are EXCLUDED, never deleted — they remain the historical
# record of what the close-walk basis produced, which the before/after
# comparison needs.
#
# Fail-safe: anything that is not an explicit "off" resolves to "on", because the
# safe direction here is to exclude stale-basis evidence rather than include it.
calibration_cutover_mode: "on"

# Root-cause classifier (2026-08-28, worklog same as above) — powers
# BOTH RegimeHMM.trend_transition_matrix_3state() (Tier 1, gates
# markov_source_mode) and RegimeHMM.gated_trend_probs() (Tier 2, gates
# trend_probs_gate_mode below). Originally these gated the OLD rank-
# assigned label with a single-feature magnitude check; real-data
# analysis found that wasn't enough — 9 of 14 live symbols had a
# component whose 3 fitted features (1-bar return, 10-bar cumulative,
# 30-bar cumulative) actively contradicted each other, since the old
# label only ever looked at one of the three, and some symbols showed
# near-total single-Viterbi-state collapse (e.g. AAPL at 100% one
# state), where the other components' "means" are fit on ~0 real data
# and are meaningless regardless of magnitude. The classifier now works
# directly from the model's own fitted parameters instead of the label:
# a component only counts as directional if (1) its real Viterbi
# occupancy clears markov_min_occupancy, (2) all 3 of its fitted
# features agree in sign, and (3) the magnitude clears this threshold
# (standard deviations of the trend feature's own fit-time noise scale).
# Otherwise: FLAT. Replaces the old, incomplete single-feature check —
# same two consumers, same threshold name, corrected logic.
markov_flat_gate_threshold_stds: 0.5

# Minimum share of the fit window's bars (Viterbi-assigned) a component
# must actually occupy before its mean is trusted at all — see above.
# 0.10 = a component fit on less than 10% of real observations is
# treated as FLAT regardless of what its mean says.
markov_min_occupancy: 0.10

# Tier 2: off | shadow | live. shadow: compute both raw and gated
# p_regime (via the root-cause classifier above), log + persist the
# comparison to nt_trend_probs_gate_shadow, still feed the RAW value to
# compute_ev — zero live-behavior change. live: feed the gated
# trend_probs to compute_ev instead. NOT live by default — review
# shadow data first, same discipline as markov_source_mode's
# trend_hmm_live.
# 2026-09-22: shadow -> live (user approval). Gated Brier beat raw on 14/14
# symbols (nt_hmm_shadow_accuracy). EV now uses gated p_regime.
trend_probs_gate_mode: live

# Macro filter (2026-08-26/28, worklog 20260825_PIPELINE_OVERVIEW_EV_FEEDBACK_LOOP.md,
# "Macro filter — full build scope" + the w/l+PnL evidence extension).
# Pure price-based multi-month trend read — (last_close - SMA_200d) /
# SMA_200d, EMA-smoothed — deliberately separate from signal-quality/PnL
# work (that's nt_calibration_bias_by_bucket); the two stay separate
# signals, not blended into one number. off | shadow | live: shadow
# computes macro_label/macro_strength and captures them on nt_signal_sim
# (so the w/l+PnL evidence table, nt_macro_edge_by_symbol, can accumulate)
# without touching live Kelly sizing. live additionally multiplies
# effective_kelly by the boost/penalty formula below. Same shadow-first
# discipline as markov_source_mode/trend_probs_gate_mode.
macro_regime_mode: shadow
macro:
  sma_window_days: 200
  ema_half_life_days: 10
  bear_bull_threshold: 0.05      # |macro_score_smoothed| beyond this -> bear/bull, else neutral
  strength_saturation: 0.15      # |macro_score_smoothed| at/beyond this -> macro_strength=1.0
  boost_scale: 0.3               # max +30% kelly at full strength when direction agrees
  penalty_scale: 0.5             # max -50% kelly at full strength when direction opposes
  # Stage 2 (2026-10-05): per-symbol macro enable/disable.
  # AAPL's 200-day SMA is a constant (always "bull"), not a signal.
  # The HMM regime is the correct clock for a 22-40h signal.
  # See worklog/20261005_AAPL_MACRO_REFRAME.md.
  by_symbol:
    AAPL:
      enabled: false

# Medium-term (10-50 day) trend-confirmation filter (2026-09-10, worklog
# 20260910_AAPL_REGIME_STALENESS_AND_SELF_LEARNING_SCOPE.md SS7). Sibling
# to macro_regime_mode above -- separate concern (SMA-10/20/50 crossover +
# RSI momentum, not the 200-day structural level check), same off/shadow/
# live discipline. off = build-time default: no Supabase round-trip, no
# nt_trend_regime writes. shadow = compute + capture trend_label/
# trend_strength on nt_signal_sim, no Kelly impact. live = additionally
# multiply effective_kelly by kelly_trend_multiplier().
# 2026-09-13: off -> shadow (worklog 20260912_..._FOLLOWUPS.md SS12) --
# needed to start nt_signal_sim.trend_label accumulating real
# win/loss-resolved rows for trend_edge.py's P/L-based analysis (checked
# live before this flip: 0/93,785 rows had trend_label populated while
# off). No Kelly impact -- shadow is capture-only.
trend_regime_mode: "shadow"
trend:
  sma_short_days: 10
  sma_mid_days: 20
  sma_long_days: 50
  rsi_period: 14
  rsi_overbought: 70.0
  rsi_oversold: 30.0
  crossover_freshness_days: 3    # days since a SMA-10/50 sign flip still counts as "reversal_*"; older -> "trending_*"
  strength_saturation: 0.10      # |SMA_10 - SMA_50| / SMA_50 at/beyond this -> trend_strength=1.0
  boost_scale: 0.3               # same [0.25, 1.5] hard clamp band as every other Kelly multiplier
  penalty_scale: 0.5

# Context-alignment gate -- Tier 1, corrected (2026-09-11, worklog
# 20260910_LONGITUDINAL_CONTEXT_AND_BRICK_GEOMETRY_REVIEW.md Part 10).
# An independent 8th qualification gate that fails only when BOTH
# macro_regime and trend_regime confidently oppose the trade direction
# -- never touches p_win/ev_result/compute_ev() (per ev_engine_no_rework).
# off = gate always passes, zero behavior change (default). shadow =
# compute + capture context_aligned_ok on nt_signal_sim, does not affect
# qualification. live = included in the qualification decision.
context_alignment_gate_mode: "shadow"

# Dynamic/regime-conditional MIN_RR (2026-09-11, worklog Part 11).
# SUPERSEDED 2026-09-20 (see min_rr status comment below): base min_rr=1.5
# is a maintained non-factor on light qualification; a 1.5→2.0 step or
# continuous matrix will not rank signal strength (RR is brick geometry).
# Flag remains in code/shadow for observability only — do NOT flip live.
# Binding light gates: kelly / regime_conf / p_win; quality work is
# geometry/reachability, not RR.
dynamic_min_rr_mode: "shadow"
dynamic_min_rr_consolidation_value: 2.0   # unused for live qualification; do not promote

# TimesFM k-adaptive dampening (2026-09-11, worklog
# 20260910_LONGITUDINAL_CONTEXT_AND_BRICK_GEOMETRY_REVIEW.md Part 12).
# k_adaptive = TIMESFM_SIGMOID_K * (1 + trend_strength), clamped to
# [timesfm_k_floor, timesfm_k_ceiling] -- stronger trend -> higher k ->
# trust the forecast more (a sharper sigmoid pushes further from 0.5 for
# the same input); no/missing trend context -> k stays at the base
# value (today's unchanged behavior), never an extreme in either
# direction. CORRECTED during implementation: the original scope
# (Part 12.3) had this inverted (dividing by strength, which actually
# FLATTENS the sigmoid toward 0.5 as strength rises) -- verified
# directly (sigmoid(10*0.02)=0.5498 vs sigmoid(40*0.02)=0.6900, higher
# k is more aggressive) before shipping the corrected version. Confirmed
# via code trace the sigmoid mapping runs entirely upstream of
# compute_ev() -- this never touches ev_engine.py. off = byte-identical
# to today (default). shadow = logs the adaptive k and what p_timesfm
# would have been (reusing the already-fetched forecast, no second
# network call), does not affect the real p_timesfm. live = the
# adaptive value is what actually feeds compute_ev().
timesfm_k_adaptive_mode: "shadow"
timesfm_k_floor: 5.0     # defensive lower bound (rarely binds -- k >= base_k always in the current formula)
timesfm_k_ceiling: 60.0  # defensive upper bound -- caps k at 3x the default base_k=20 at full trend strength

# Phase 3a of the calibration reframe (2026-08-28, worklog
# 20260825_CALIBRATION_REFRAME_SCOPE.md "Phase 3 scope"). A live
# simulation found the heavy sweep's Sharpe-only grid pick sometimes
# lands in a distance/ATR bucket with negative realized expectancy
# (nt_calibration_bias_by_bucket), and for some symbols the grid never
# even generates a candidate in a good bucket at all. off | shadow |
# live: shadow computes what a reachability/expectancy-aware re-rank
# would have picked, persists the comparison to
# nt_heavy_sweep_reachability_shadow, changes nothing about the actual
# pick. live substitutes the reachability-aware pick when one survives
# (falls back to the baseline Sharpe-only pick otherwise — a
# provisional choice, not yet informed by real shadow data; see the
# worklog's "live-mode fallback" note). NOT live by default — same
# discipline as every other mode flag in this file. Phase 3b (widening
# the grid itself) is a separate, not-yet-built follow-up gated on this
# shadow data accumulating over real weekly cycles.
# Flipped off -> shadow 2026-08-28 to start that accumulation clock --
# zero live-behavior change (still shadow, not live).
heavy_sweep_reachability_mode: shadow

# dynamic_atr_mode (2026-09-18; reworked 2026-09-26): off | shadow | live.
# The platform's geometry lever (regime_platform/sweep_orchestrator/tiered_atr.py).
# Each heavy sweep picks TP/SL in ATR for the symbol's asset class by
# re-walking the class's last `lookback_days` of signals (48-bar resolver
# rule) under every tp_atr x sl_atr candidate. Kept: TP/SL >= min_rr, expiry
# share <= max_expiry, expectancy net of cost_atr > 0 in both halves of the
# window; highest expectancy wins. No qualifying pick -> heavy pick kept.
# shadow: logs "[dynamic:atr] ... would set"; live: replaces brick/sl/tp.
# Replaced the old band-limited risk pick (TP <= 2 ATR), which could not
# reach the far-TP / close-SL region the replay found profitable
# (worklog/kairos/reports/20260926_geometry_replay.md, scope §14.5).
# dynamic_atr_risk_cap is the geometry-risk cap used by the publish gates
# and geometry_tuning_sweep; it is not part of the selector.
# 2026-09-30 PER-SYMBOL solve (0.05→0.01 ATR). Forex majors share one grid;
# every other symbol has its own walk. Exact price brackets (not bricks).
#   forex    1.71/0.35  EV +0.25   (pooled majors)
#   XAGUSD   7.96/7.76  EV +1.03
#   XAUAUD   6.31/4.91  EV +0.68
#   XAUEUR   4.20/1.82  EV +0.22
#   XAUUSD   0.91/0.71  EV -0.32  (no +EV cell in band)  ← superseded 09-30
#   BTCUSD   0.95/0.15  EV +0.005                        ← superseded 09-30
# 2026-09-30 VOL-REGIME (worklog/kairos/20260930_VOL_REGIME_ATR_BTC_XAU.md):
#   10d walk underpowered for BTC/XAU. 45d free-lattice + vol_ratio terciles:
#     XAUUSD   4.94/1.00  EV +1.23  wr 0.405  (pooled 45d — no gate needed)
#     BTCUSD   8.07/1.77  EV +1.93  wr 0.413  ONLY when vol_ratio ≤ 0.71
#   vol_ratio = std(Δlog close 24h) / std(Δlog close 168h) at entry —
#   VOLATILITY ratio, NOT volume. BTC has no balanced pooled cell; outside
#   the low-vol band the pick is withheld (heavy bricks kept).
#   Crypto note: aggressive post-moves pay only as a far-TP "trend runner"
#   (wr≈0.25, e.g. 20/2.5) — separate product, NOT the balanced engine.
#   Consider the same split for ETHUSD/other crypto before live brackets.
#   AAPL     6.36/3.57  EV +0.66
#   US30USD  12.80/2.41 EV +3.84
#   US500    13.23/8.09 EV +0.55
dynamic_atr_mode: "live"
dynamic_atr_risk_cap: 0.35

# dynamic_atr_consistency_mode (2026-10-08, worklog
# 20261008_GEOMETRY_BASIS_DIVERGENCE.md Stage 5): off | shadow | live.
# The picker re-walks prices to score a candidate bracket; the platform also
# MEASURES every bracket that traded, per (symbol, distance_atr_bucket), in
# nt_bracket_reachability. This gate compares the two: a pick whose walked TP
# rate disagrees with its measured bucket rate by more than
# dynamic_atr_consistency_tol is the optimizer contradicting its own
# measurements. shadow = log only; live = reject the pick (fall back to the
# heavy pick); off = disabled. Fail-open when the bucket is cold (< 30 samples).
# GEOMETRY HARMONY (2026-10-12, worklog 20261012_GEOMETRY_HARMONY.md): the ATR
# pick is the SINGLE SOURCE OF TRUTH for TP/SL; brick is the documented
# fail-open fallback, not a parallel system. The replay proved 40/40 signals
# shipped brick while reopt optimized a different ATR bracket that never
# reached the signal. All three gates go live so the solved geometry ships and
# artifacts (the 12:1 RR on intrabar envelopes) are rejected at the gate.
dynamic_atr_consistency_mode: "live"
dynamic_atr_consistency_tol: 0.20

# dynamic_atr_light_mode (2026-10-09 → live 2026-10-12): the light sweep reads
# the SAME persisted ATR pick the heavy path chose and applies it via exact ATR
# price levels. live applies it; the signal's TP/SL, bucket, reachability, and
# EV all read the SAME geometry. Fail-open: no valid pick → brick fallback.
dynamic_atr_light_mode: "live"

# dynamic_atr_walkforward_mode (2026-10-09 → live 2026-10-12): held-out gate
# rejects an overfit pick (e.g. the RR=12 artifact) so it fails open to brick
# instead of shipping. Thin folds (< min_fold_n decided) fail open.
dynamic_atr_walkforward_mode: "live"
# Min DECIDED signals per fold before the gate trusts the held-out result.
# 20 mirrors the calibration min-episode convention.
dynamic_atr_walkforward_min_fold_n: 20
# Min out-of-sample net expectancy (ATR) to pass. 0.0 = held-out half must be
# non-negative net of cost.
dynamic_atr_walkforward_min_oos: 0.0

# brick_params_source (2026-10-09, worklog
