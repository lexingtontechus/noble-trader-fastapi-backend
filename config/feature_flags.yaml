# Feature Flags — git-tracked config for deliberately-set mode flags and
# thresholds (read by regime_platform/core/feature_flags.py).
#
# What belongs here vs. elsewhere (2026-08-26 config-centralization
# correction, worklog/20260825_PIPELINE_OVERVIEW_EV_FEEDBACK_LOOP.md):
#   - Real secrets (API keys, credentials, tokens) -> Lightning AI Studio
#     Secrets. Not this file.
#   - Runtime state the app writes automatically (the Tier D auto-tuner)
#     -> config/tuning_registry.yaml (gitignored on purpose — a tracked
#     file that something else keeps rewriting just goes stale, see
#     .gitignore's own note on config/brick_params.yaml). Not this file.
#   - Config a person deliberately sets (mode flags, thresholds) -> HERE.
#     Committed, reviewable in a diff, no platform UI required to know
#     what's actually running.
#
# IMPORTANT: regime_platform/core/feature_flags.py does NOT consult any
# environment variable for these keys. A leftover Studio Secret with a
# matching name (e.g. MARKOV_SOURCE_MODE) has ZERO effect — this file is
# the sole source of truth. Edits take effect on the next read (the
# loader checks the file's mtime on every call) — no restart required.

# Qualification gate thresholds (light-sweep + heavy-sweep qualification —
# orchestrator.py::_process_symbol / heavy_sweep.py::_evaluate_heavy_
# qualification). 2026-09-08 config-centralization fix: these 5 were still
# being read straight from os.getenv(...) with a code-level fallback
# default, each one an ACTIVE Studio-Secret/`.env.local` entry with no
# feature_flags.yaml counterpart — the exact same undetectable-divergence
# shape that caused the MIN_RR incident (worklog/20260904_MIN_RR_REGRESSION.md),
# just not yet triggered. Found via a same-day audit, not assumed. Values
# below are what `.env.local`/Studio actually held at migration time (read
# directly, not the code's bare fallback) — verify these still match
# intended live behavior; if Studio's real values differ from these, THAT
# divergence is exactly what this migration exists to surface and end.
# Also declared in regime_platform/core/tuning_registry.py's PARAM_BOUNDS
# (Tier C, "gate thresholds") as future Layer-1-autonomous-tuner
# candidates — that tuner isn't built yet, so this file is the actual read
# path today, same relationship MIN_RR (below) already has with that
# registry.
qualification_gates:
  min_regime_conf: 0.60        # Gate 2: HMM confidence
  min_kelly: 0.02              # Gate 3: Kelly minimum
  min_timesfm_confidence: 0.05 # Gate 5: TimesFM certainty
  min_ev: 0.0                  # Gate 6a: EV minimum
  min_p_win: 0.55              # Gate 6b: blended p_win minimum

# timesfm_gate_mode: hard|soft|off — controls how TimesFM confidence
# affects signal qualification (see orchestrator.py's own inline comment
# at TIMESFM_GATE_MODE's usage for the full hard/soft/off semantics). Same
# config-centralization fix as qualification_gates above.
timesfm_gate_mode: soft

# sweep_after_hours: when true, sweep ALL symbols regardless of market
# hours (crypto is always 24/7 and forex Sun-Fri regardless of this flag —
# it only affects stocks/commodities). NOTE: `.env.local`'s actual value
# was `1` (true) at migration time, which is the OPPOSITE of the code's
# own documented "recommended"/fallback default (false, skip stocks/
# commodities when market is closed) — flagging this explicitly since it's
# a real, surprising divergence between the code comment's stated
# expectation and the value actually configured; worth confirming this is
# intentional rather than assuming either way.
sweep_after_hours: true

# signal_cooldown_minutes: suppress repeat qualified signals for the same
# (symbol, direction) pair within this many minutes of the last one, to
# prevent spam when a regime is stable. Same config-centralization fix.
signal_cooldown_minutes: 60

# MARKOV_SOURCE_MODE: which source feeds p_markov_hold_n's 3x3 {UP,DOWN,
# FLAT} transition matrix. legacy_hmm (the separate, numerically-unstable
# 5-state HmmModel) | trend_hmm_shadow (compute both, log+persist a
# comparison to nt_markov_source_shadow, legacy still feeds the live
# blend — zero behavior change) | trend_hmm_live (RegimeHMM's own
# transition matrix feeds the blend instead, and the legacy model's
# per-tick refit is skipped entirely). See orchestrator.py's docstring
# near MARKOV_SOURCE_MODE usage for full detail.
markov_source_mode: trend_hmm_shadow

# Root-cause classifier (2026-08-28, worklog same as above) — powers
# BOTH RegimeHMM.trend_transition_matrix_3state() (Tier 1, gates
# markov_source_mode) and RegimeHMM.gated_trend_probs() (Tier 2, gates
# trend_probs_gate_mode below). Originally these gated the OLD rank-
# assigned label with a single-feature magnitude check; real-data
# analysis found that wasn't enough — 9 of 14 live symbols had a
# component whose 3 fitted features (1-bar return, 10-bar cumulative,
# 30-bar cumulative) actively contradicted each other, since the old
# label only ever looked at one of the three, and some symbols showed
# near-total single-Viterbi-state collapse (e.g. AAPL at 100% one
# state), where the other components' "means" are fit on ~0 real data
# and are meaningless regardless of magnitude. The classifier now works
# directly from the model's own fitted parameters instead of the label:
# a component only counts as directional if (1) its real Viterbi
# occupancy clears markov_min_occupancy, (2) all 3 of its fitted
# features agree in sign, and (3) the magnitude clears this threshold
# (standard deviations of the trend feature's own fit-time noise scale).
# Otherwise: FLAT. Replaces the old, incomplete single-feature check —
# same two consumers, same threshold name, corrected logic.
markov_flat_gate_threshold_stds: 0.5

# Minimum share of the fit window's bars (Viterbi-assigned) a component
# must actually occupy before its mean is trusted at all — see above.
# 0.10 = a component fit on less than 10% of real observations is
# treated as FLAT regardless of what its mean says.
markov_min_occupancy: 0.10

# Tier 2: off | shadow | live. shadow: compute both raw and gated
# p_regime (via the root-cause classifier above), log + persist the
# comparison to nt_trend_probs_gate_shadow, still feed the RAW value to
# compute_ev — zero live-behavior change. live: feed the gated
# trend_probs to compute_ev instead. NOT live by default — review
# shadow data first, same discipline as markov_source_mode's
# trend_hmm_live.
trend_probs_gate_mode: shadow

# Macro filter (2026-08-26/28, worklog 20260825_PIPELINE_OVERVIEW_EV_FEEDBACK_LOOP.md,
# "Macro filter — full build scope" + the w/l+PnL evidence extension).
# Pure price-based multi-month trend read — (last_close - SMA_200d) /
# SMA_200d, EMA-smoothed — deliberately separate from signal-quality/PnL
# work (that's nt_calibration_bias_by_bucket); the two stay separate
# signals, not blended into one number. off | shadow | live: shadow
# computes macro_label/macro_strength and captures them on nt_signal_sim
# (so the w/l+PnL evidence table, nt_macro_edge_by_symbol, can accumulate)
# without touching live Kelly sizing. live additionally multiplies
# effective_kelly by the boost/penalty formula below. Same shadow-first
# discipline as markov_source_mode/trend_probs_gate_mode.
macro_regime_mode: shadow
macro:
  sma_window_days: 200
  ema_half_life_days: 10
  bear_bull_threshold: 0.05      # |macro_score_smoothed| beyond this -> bear/bull, else neutral
  strength_saturation: 0.15      # |macro_score_smoothed| at/beyond this -> macro_strength=1.0
  boost_scale: 0.3               # max +30% kelly at full strength when direction agrees
  penalty_scale: 0.5             # max -50% kelly at full strength when direction opposes

# Phase 3a of the calibration reframe (2026-08-28, worklog
# 20260825_CALIBRATION_REFRAME_SCOPE.md "Phase 3 scope"). A live
# simulation found the heavy sweep's Sharpe-only grid pick sometimes
# lands in a distance/ATR bucket with negative realized expectancy
# (nt_calibration_bias_by_bucket), and for some symbols the grid never
# even generates a candidate in a good bucket at all. off | shadow |
# live: shadow computes what a reachability/expectancy-aware re-rank
# would have picked, persists the comparison to
# nt_heavy_sweep_reachability_shadow, changes nothing about the actual
# pick. live substitutes the reachability-aware pick when one survives
# (falls back to the baseline Sharpe-only pick otherwise — a
# provisional choice, not yet informed by real shadow data; see the
# worklog's "live-mode fallback" note). NOT live by default — same
# discipline as every other mode flag in this file. Phase 3b (widening
# the grid itself) is a separate, not-yet-built follow-up gated on this
# shadow data accumulating over real weekly cycles.
# Flipped off -> shadow 2026-08-28 to start that accumulation clock --
# zero live-behavior change (still shadow, not live).
heavy_sweep_reachability_mode: shadow

# min_rr: minimum reward:risk ratio. Deliberately SHARED by two
# independent gates: the light-sweep qualification gate (EVEngine.min_rr,
# set from this value in orchestrator.py) and the heavy sweep's grid
# search pre-filter/pick_best_combo (heavy_sweep.py). A divergence
# between the two already broke production once (2026-08-13:
# EURUSD/GBPUSD/USDCAD emergency heavy sweeps failed with
# no_combo_passed_filters because heavy_sweep.py's hardcoded MIN_RR=2.0
# disagreed with orchestrator.py's env-var override MIN_RR=1.5) — moved
# both off separate env vars/Studio Secrets onto this single config
# value (2026-08-30) specifically to make that recurring silently
# impossible, not just less likely.
#
# CORRECTION (2026-09-04, worklog 20260904_MIN_RR_REGRESSION.md): the
# 2026-08-30 move shipped this key at 2.0 — the module's hard-coded
# fallback default, not the Studio's actual long-running value. The
# Studio's real MIN_RR env var (1.5) was still set at the time and got
# silently ignored the moment orchestrator.py switched from
# os.getenv("MIN_RR", ...) to this file (feature_flags.py deliberately
# never reads env vars — see this file's own header) — confirmed live,
# the Studio process still has MIN_RR=1.5 in its environment today,
# doing nothing. That silently tightened the light-sweep qualification
# gate from 1.5 to 2.0 for three-plus weeks, right through the exact
# RR gap orchestrator.py's own comment already flagged ("with default
# brick params... the actual RR is 5/3 = 1.67 — below the 2.0
# minimum"). Restored to the value actually running before that
# regression.
min_rr: 1.5

# Heavy-sweep grid quality filter, alongside min_rr above (2026-08-30,
# same config-centralization move — these were previously
# HEAVY_SWEEP_MAX_SHARPE/HEAVY_SWEEP_MIN_TRADES env vars). Read by
# heavy_sweep.py's pick_best_combo AND passed explicitly into
# heavy_sweep_reachability.py's reachability_aware_pick (Phase 3a) so
# the shadow comparison's "baseline" is always computed from the exact
# same threshold values as the real pick — not a second, independently-
# resolved copy that could quietly drift.
#
# Same 2026-09-04 correction as min_rr above: shipped at the module
# defaults (10.0/10), not the Studio's actual long-running env vars
# (HEAVY_SWEEP_MAX_SHARPE=5.0, HEAVY_SWEEP_MIN_TRADES=5, both still set
# and both silently ignored since 08-30). Restored to match.
heavy_sweep_grid:
  max_sharpe: 5.0    # reject combos with an absurdly high Sharpe (likely overfit)
  min_trades: 5      # minimum backtested trade count for a combo to qualify

# heavy_sweep_atr_anchored_bricks_mode (2026-09-07, Phase A of worklog
# 20260907_REACHABILITY_LIVE_RESOLUTION_AND_SIGNAL_QUALITY_REPORT_SCOPE.md
# — this is the "Phase 3b" grid-widening follow-up flagged above as
# not-yet-built). generate_brick_sizes()'s 5 candidates are derived from
# a coarse price-% volatility tier, never anchored to the symbol's own
# ATR — nt_bracket_reachability shows the grid then has zero candidates
# near the 0.5-1x ATR bucket that resolves reliably for XAUUSD/XAUEUR/
# XAUAUD, so heavy_sweep_reachability_mode's shadow filter finds "nothing
# survives" for those symbols no matter how it re-ranks. This flag adds 3
# extra ATR-multiple candidates (0.15x/0.3x/0.6x) to the grid search
# alongside the existing 5 — a strictly additive widening, not a
# replacement.
#
# CORRECTION (2026-09-07, real-data backfill): originally shipped at
# 0.5x/1x/2x. A 70-anchor historical replay against real TDVA data (14
# symbols) showed those multipliers can NEVER reach "0.5-1"/"1-2" —
# the grid's own SWEEP_SL_RANGE/SWEEP_TP_RANGE + MIN_RR reject every
# tp_bricks below 5, so the floor was 5 * 0.5 = 2.5x ATR ("2-4" at best).
# 0.15x/0.3x/0.6x put tp_bricks=5 (the grid's minimum viable value) at
# 0.75x/1.5x/3.0x ATR — inside "0.5-1"/"1-2"/"2-4" respectively.
#   off    (default): unchanged — identical candidates/behavior to today.
#   shadow: backtests the extra candidates too (so the reachability-mode
#           shadow comparison above finally has something good to find),
#           logs what the *baseline* Sharpe-only pick would be with vs.
#           without them, but the real persisted brick_params.yaml pick
#           still comes from the original 5-candidate set only — zero
#           live-behavior change.
#   live:   the extra candidates can win the baseline Sharpe-only pick
#           for real (still subject to heavy_sweep_reachability_mode's
#           own gate on top, unchanged).
# NOT live by default — same discipline as every other mode flag in this
# file, and the exact gating this key's own governing comment above
# already called for before Phase 3b could ship.
heavy_sweep_atr_anchored_bricks_mode: off

# heavy_sweep_deadline_aware_scoring_mode (2026-09-08, worklog
# 20260908_PRICING_SCORING_ROOT_CAUSE_AND_SCOPE.md) — THE root-cause fix,
# superseding the ATR-anchoring key above (that was solving the wrong
# variable: candidate SET, not candidate SCORING). The heavy-sweep grid
# search scores every candidate bracket by Sharpe over the full 90-day
# backtest with no concept of a deadline — a simulated trade that takes
# 200+ hours to close still counts as a win there. eod_resolver.py gives
# every real signal only EXPIRY_BARS (48) hours before calling it expired.
# Proven directly (scripts/sim_deadline_aware_scoring.py, real TDVA data,
# no candidate widening): XAUUSD's actual current pick produces 10
# trades / 0 wins / 0 losses / 10 expired / $0 — literally every "win" in
# its backtest takes longer than 48h to close. Rescoring the SAME
# candidates with any trade held > EXPIRY_BARS treated as 0 PnL first
# (matching what eod_resolver.py already does to real signals) picked a
# different bracket: 15 trades / 13 wins / 2 losses / 0 expired / 86.7%
# win / +$468.70. This was independently found and numerically verified
# once already, two weeks earlier, in worklog
# 20260825_US500_USDCAD_TIME_HORIZON_SCOPE.md (candidate fix #3, "full
# wall-clock backtest/live parity") — explicitly deferred there as
# "structurally correct... right long-term target, wrong thing to lead
# with," and nothing on that list was built before this. Don't repeat
# that: this key exists so the fix ships, gated, not deferred again.
#   off    (default): unchanged — identical candidate scoring to today.
#   shadow: computes the corrected Sharpe too (ComboResult.deadline_aware_sharpe
#           is always populated regardless of mode — cheap, same trade
#           list already in hand), logs/persists what it would have
#           picked instead, but the real persisted pick is unchanged.
#   live:   the corrected Sharpe drives the real pick.
# NOT live by default — same discipline as every other mode flag in this
# file. Given the strength of the existing single-window evidence above,
# this does not need weeks of organic shadow accumulation the way the
# ATR-anchoring key did — a multi-window historical replay (same method as
# scripts/backfill_atr_anchored_bricks_shadow.py) can validate this
# directly against real history before flipping, rather than waiting.
heavy_sweep_deadline_aware_scoring_mode: live
# FLIPPED TO LIVE 2026-09-08 (worklog 20260908_PRICING_SCORING_ROOT_CAUSE_AND_SCOPE.md):
# multi-window historical validation (scripts/backfill_deadline_aware_scoring.py,
# 70 real anchors across all 14 symbols, not one lucky window) confirmed
# the corrected scoring beats today's uncapped method on every aggregate
# metric -- win% 58.5->74.5, expired% 49.3->42.0, total pnl $59,658->$66,632
# -- with no catastrophic regression on any symbol (USDCAD stays bad either
# way, a separate known directional-miscalibration issue this fix doesn't
# touch). Per user directive: verify continuously with real data, don't
# wait for a calendar review date once the evidence is this consistent.

# regime_warm_start_mode (2026-09-01, worklog
# 20260901_REGIME_LABEL_STABILITY_SCOPE.md): root-cause fix for
# regime_label flapping tick-to-tick. RegimeHMM.fit() rebuilds and
# re-fits a brand-new hmmlearn model every light-sweep tick with a
# FIXED random_state — deterministic given identical data, so the
# instability traces to the rolling window shifting one bar per tick,
# occasionally nudging hmmlearn's own k-means auto-init across a
# cluster boundary. live seeds each tick's EM initialization from the
# PREVIOUS tick's own converged params (rebased onto this tick's
# standardization scale) instead of a fresh auto-init, so EM starts
# close to last tick's answer and converges to the same partition far
# more often.
#
# Deliberately off | live only — no shadow. A true shadow comparison
# (fit both warm-started AND cold every tick) would double the CPU cost
# of the single most expensive part of each tick, for every symbol,
# forever — not the same cheap-to-compute shadow diagnostic Tier 1/2
# could afford. Confidence instead comes from unit-testing the
# rebasing math directly and a real before/after label-flip-rate
# comparison once live, not a live parallel-shadow computation.
#
# Only affects the light sweep (orchestrator.py) — heavy_sweep.py's own
# regime fit doesn't even thread the existing label-continuity
# (prev_vol_means/prev_trend_means) mechanism today, and its
# weekly-ish, TimesFM-gated cadence means there's no adjacent-tick
# relationship to warm-start from in the first place.
#
# Real-data verification found this alone doesn't reliably solve
# regime_label flapping (regressed AAPL; a follow-up separation guard
# regressed 4 other symbols) — see regime_label_debounce_mode below,
# which real data shows DOES work, consistently, without this. Left
# `off` rather than removed: harmless at rest, and the rebasing math
# stays independently useful if a future need for warm-starting shows
# up for a different reason.
regime_warm_start_mode: off

# regime_label_debounce_mode (2026-09-01, worklog
# 20260901_REGIME_LABEL_STABILITY_SCOPE.md "Fix 2"): off | shadow |
# live. Hysteresis on RegimeSnapshot.regime_label — RegimeLabelDebouncer
# in regime_engine.py requires regime_label_debounce_ticks consecutive
# ticks of agreement before promoting a new label, per symbol. shadow:
# computes the debounced label and persists a running raw-vs-debounced
# comparison to nt_regime_debounce_shadow, but direction selection and
# regime-shift detection keep reading the RAW label — zero live-
# behavior change. live: direction selection, regime-shift detection,
# and the persisted nt_sweep_result/nt_signal_sim "regime" column all
# switch to the debounced label instead (NOT the regime-based Kelly
# floor in _apply_regime_kelly_floor — that's a separate consumer,
# deliberately left reading the raw label, same wide-blast-radius
# boundary this session has held throughout).
#
# Verified live (500-tick, 5-symbol real-data comparison) BEFORE
# shipping: cuts a raw 36-58% tick-to-tick flip rate down to ~5-8% at
# n_confirm=3, consistently across every symbol tested — unlike
# regime_warm_start_mode above, no per-symbol regression found. Not
# live by default regardless — same shadow-first discipline as every
# other mode flag in this file.
regime_label_debounce_mode: shadow

# n_confirm for the debouncer above: consecutive ticks of agreement
# required before a new label is promoted. At this system's ~hourly
# effective relabeling cadence (the light sweep re-fits every ~5min,
# but re-fetches the same 200 hourly bars until the next hour rolls
# over, so the label only has an actual opportunity to change roughly
# once an hour), n_confirm=3 means a genuine regime change takes ~3
# hours to be confirmed and reported — a real tradeoff against faster
# response to genuine shifts, tunable. n=2 leaves meaningfully more
# noise through; n=4 buys a little more suppression for another hour
# of lag. 3 was the best balance found in the real-data comparison.
regime_label_debounce_ticks: 3
