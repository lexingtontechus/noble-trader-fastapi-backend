# nt_roadmap notes into a local SQLite file for future root-cause
# retrieval. Purely additive, read-only w.r.t. trading -- never influences
# a live signal or parameter. Simple on/off (not off/shadow/live): there's
# no live-baseline comparison for a search index to shadow-test against.
knowledge_index_enabled: true

