# macro_forecast_agent_enabled (2026-09-11, worklog
# 20260911_SELF_LEARNING_PHASE_3_4_FORECASTING_RESCOPE.md SS4/RM-50
# follow-up): gates the nightly long-term (12-month) macro-forecast
# agent (regime_platform/services/self_learning/macro_forecast_agent.py)
# -- reads docs/LLM/commodity_12m_forecast_model_2027.md, classifies
# each of the 12 commodities into structured trend/direction/strength
# fields matching trend_filter.py/macro_filter.py's existing label
# vocabularies, writes to nt_macro_forecast. Shadow-mode diagnostic --
# nothing reads that table to make a live decision yet. Requires
# OPENROUTER_API_KEY or NVIDIA_NIM_API_KEY. Simple on/off, same
# reasoning as self_learning_detectors_enabled above.
macro_forecast_agent_enabled: true

# clef_flash_mode (2026-10-04, docs/scopes/20261004_CLEF_FLASH_CLASSIFIER_ROLE_SCOPE.md
# + 20261004_P_CLEF_SHADOW_STAMP_REQUIREMENTS.md): off | shadow | live.
# Clef-Flash (@cf/cloudflare/clef-flash, Cloudflare Workers AI) is a
# structured-decision model -- one logit per option per question, softmax
# normalised, no free text, no extract_json() fragility. REPURPOSED from a
# retired EV-blend source to a shadow research stamp.
#   shadow (default): call the Worker /decision route for qualifiable
#           light-sweep signals, stamp p_clef_dir/p_clef_wait/p_clef_symbol
#           on nt_signal_sim (migration 194). RESEARCH ONLY -- never in
#           P_WIN_WEIGHTS_FULL, never passed to compute_ev(), never touches
#           qualified/kelly/SL/TP.
#   live:   reserved for the classifier cutover (kairos_pivot.py /
#           macro_forecast_agent.py call sites). Does NOT change the shadow
#           stamp -- the stamp is always shadow.
#   off:    no HTTP call, no stamp.
# Requires CF_EMBEDDINGS_URL (the Worker base URL). No-ops without it.
clef_flash_mode: shadow

# heavy_sweep_force_refresh_hours -- REMOVED 2026-09-09 (worklog
# 20260909_CALIBRATION_AND_SCORING_METHODOLOGY_REFRAME.md SS13). This was
# a 72h timer bounding how long the TimesFM confidence gate in
# heavy_sweep.py could defer a symbol's bracket re-optimization. The gate
# itself was removed the same day (its only justification -- compute cost
# on the old Supabase Edge Function deployment -- was moot once that
# infrastructure was migrated to Lightning AI Studio, and was independently
# falsified by real measurement even before the migration). Bounding an
# unjustified decision with a timer was not a substitute for removing the
# decision -- see heavy_sweep.py's module docstring for the full history.
