heavy_sweep_grid:
  max_sharpe: 5.0    # reject combos with an absurdly high Sharpe (likely overfit)
  min_trades: 5      # minimum backtested trade count for a combo to qualify

# heavy_sweep_atr_anchored_bricks_mode (2026-09-07, Phase A of worklog
# 20260907_REACHABILITY_LIVE_RESOLUTION_AND_SIGNAL_QUALITY_REPORT_SCOPE.md
# — this is the "Phase 3b" grid-widening follow-up flagged above as
# not-yet-built). generate_brick_sizes()'s 5 candidates are derived from
# a coarse price-% volatility tier, never anchored to the symbol's own
# ATR — nt_bracket_reachability shows the grid then has zero candidates
# near the 0.5-1x ATR bucket that resolves reliably for XAUUSD/XAUEUR/
# XAUAUD, so heavy_sweep_reachability_mode's shadow filter finds "nothing
# survives" for those symbols no matter how it re-ranks. This flag adds 3
# extra ATR-multiple candidates (0.15x/0.3x/0.6x) to the grid search
# alongside the existing 5 — a strictly additive widening, not a
# replacement.
#
# CORRECTION (2026-09-07, real-data backfill): originally shipped at
# 0.5x/1x/2x. A 70-anchor historical replay against real TDVA data (14
# symbols) showed those multipliers can NEVER reach "0.5-1"/"1-2" —
# the grid's own SWEEP_SL_RANGE/SWEEP_TP_RANGE + MIN_RR reject every
# tp_bricks below 5, so the floor was 5 * 0.5 = 2.5x ATR ("2-4" at best).
# 0.15x/0.3x/0.6x put tp_bricks=5 (the grid's minimum viable value) at
# 0.75x/1.5x/3.0x ATR — inside "0.5-1"/"1-2"/"2-4" respectively.
#   off    (default): unchanged — identical candidates/behavior to today.
#   shadow: backtests the extra candidates too (so the reachability-mode
#           shadow comparison above finally has something good to find),
#           logs what the *baseline* Sharpe-only pick would be with vs.
#           without them, but the real persisted brick_params.yaml pick
#           still comes from the original 5-candidate set only — zero
#           live-behavior change.
#   live:   the extra candidates can win the baseline Sharpe-only pick
#           for real (still subject to heavy_sweep_reachability_mode's
#           own gate on top, unchanged).
# NOT live by default — same discipline as every other mode flag in this
# file, and the exact gating this key's own governing comment above
# already called for before Phase 3b could ship.
#
# QUOTED (2026-09-12, found by the Phase 2 dead-mechanism detector's
# first real run): YAML 1.1 parses the unquoted bareword `off` as the
# boolean False, not the string "off" -- get_heavy_sweep_atr_anchored_
# bricks_mode()'s str(value).lower() then returned "false", not "off".
# heavy_sweep.py's own candidate-generation check is `if
# atr_anchored_mode != "off":` (permissive — true for "false"), while
# its shadow/live application checks are `in ("shadow", "live")`/`==
# "live"` (both false for "false") — so ATR-anchored brick candidates
# were SILENTLY being added to every heavy-sweep grid search (and
# eligible for pick_best_combo() to select) despite this being
# configured off, while the shadow table correctly stayed empty
# (explaining why it looked inert even though the grid search itself
# was not). Quoting forces YAML to parse this as the string "off".
heavy_sweep_atr_anchored_bricks_mode: live

# heavy_sweep_deadline_aware_scoring_mode (2026-09-08, worklog
# 20260908_PRICING_SCORING_ROOT_CAUSE_AND_SCOPE.md) — THE root-cause fix,
# superseding the ATR-anchoring key above (that was solving the wrong
# variable: candidate SET, not candidate SCORING). The heavy-sweep grid
# search scores every candidate bracket by Sharpe over the full 90-day
# backtest with no concept of a deadline — a simulated trade that takes
# 200+ hours to close still counts as a win there. eod_resolver.py gives
# every real signal only EXPIRY_BARS (48) hours before calling it expired.
# Proven directly (scripts/sim_deadline_aware_scoring.py, real TDVA data,
# no candidate widening): XAUUSD's actual current pick produces 10
# trades / 0 wins / 0 losses / 10 expired / $0 — literally every "win" in
# its backtest takes longer than 48h to close. Rescoring the SAME
# candidates with any trade held > EXPIRY_BARS treated as 0 PnL first
# (matching what eod_resolver.py already does to real signals) picked a
# different bracket: 15 trades / 13 wins / 2 losses / 0 expired / 86.7%
# win / +$468.70. This was independently found and numerically verified
# once already, two weeks earlier, in worklog
# 20260825_US500_USDCAD_TIME_HORIZON_SCOPE.md (candidate fix #3, "full
# wall-clock backtest/live parity") — explicitly deferred there as
# "structurally correct... right long-term target, wrong thing to lead
# with," and nothing on that list was built before this. Don't repeat
# that: this key exists so the fix ships, gated, not deferred again.
#   off    (default): unchanged — identical candidate scoring to today.
#   shadow: computes the corrected Sharpe too (ComboResult.deadline_aware_sharpe
#           is always populated regardless of mode — cheap, same trade
#           list already in hand), logs/persists what it would have
#           picked instead, but the real persisted pick is unchanged.
#   live:   the corrected Sharpe drives the real pick.
# NOT live by default — same discipline as every other mode flag in this
# file. Given the strength of the existing single-window evidence above,
# this does not need weeks of organic shadow accumulation the way the
# ATR-anchoring key did — a multi-window historical replay (same method as
# scripts/backfill_atr_anchored_bricks_shadow.py) can validate this
# directly against real history before flipping, rather than waiting.
heavy_sweep_deadline_aware_scoring_mode: live
# FLIPPED TO LIVE 2026-09-08 (worklog 20260908_PRICING_SCORING_ROOT_CAUSE_AND_SCOPE.md):
# multi-window historical validation (scripts/backfill_deadline_aware_scoring.py,
# 70 real anchors across all 14 symbols, not one lucky window) confirmed
# the corrected scoring beats today's uncapped method on every aggregate
# metric -- win% 58.5->74.5, expired% 49.3->42.0, total pnl $59,658->$66,632
# -- with no catastrophic regression on any symbol (USDCAD stays bad either
# way, a separate known directional-miscalibration issue this fix doesn't
# touch). Per user directive: verify continuously with real data, don't
# wait for a calendar review date once the evidence is this consistent.

# settlement_contract_mode (Batch A, worklog 20260916_STREAMLINE_...):
# off | shadow | live. live: eod_resolver delegates outcome+PnL to
# settlement_contract.py (single source of truth). off: emergency revert
# to the historical inline close-walk. shadow: contract computes and logs
# outcome mismatches vs legacy. Default live + tp_first is intended to be
# byte-compatible with pre-Batch-A outcomes.
settlement_contract_mode: "live"

# settlement_same_bar_policy: tp_first | sl_first. tp_first = historical
# CLOSE-WALK convention (optimistic — a close-walk can only ever see one
# price per bar, so a "same-bar tie" is close-walk-impossible). sl_first =
# conservative; with only hourly OHLC the order of two touches inside one bar
# is unknowable, so assuming the stop filled is the honest choice.
#
# 2026-10-08 (worklog 20261008_GEOMETRY_BASIS_DIVERGENCE.md): set to
# **sl_first** to make the flag match what the LIVE intrabar resolver actually
# did. `eod_resolver.resolve_signal_outcome_ohlc` hardcoded SL-first while this
# flag read tp_first — the flag and the behaviour disagreed. The live path
# only ever runs the intrabar judge (eod_resolver_basis: intrabar), so
# sl_first is behaviour-preserving for live settlement and removes the silent
# divergence. The geometry picker now reads this same flag, so picker and
# resolver share one tie-break. A close-walk replay of pre-cutover history
# should pass tp_first explicitly.
settlement_same_bar_policy: "sl_first"

# p_win_bracket_mode (Batch C, worklog 20260916): off | shadow | live.
# shadow (default): compute p_resolve * p_win|resolve from stored-ATR
# reachability buckets, persist on nt_signal_sim, log bracket_gate_shadow
# when live gates pass but the bracket gate would reject. Gates still use
# directional p_win. live: bracket probability participates in qualification
# (min_p_win_bracket). Flip only after scripts/replay_p_win_bracket_gate.py
# passes Phase 3.4.
# 2026-09-22: 0.45 was wrong scale (p_win_bracket max ~0.31 live → 0% pass).
# 0.20 ≈ 21% pass on the scored book (worklog 20260922_R2_ADDENDUM).
p_win_bracket_mode: "shadow"
min_p_win_bracket: 0.20

# p_win_bracket_unscored_policy (2026-09-24, methodology worklog §10 #1):
# fail_closed | fail_open. Unscored p_win_bracket (no reachability bucket /
# n_stored below floor / lookup miss) on the QUALIFICATION path.
#   fail_closed (default): unscored ⇒ qualified=False, suppress_reason=
#     'bracket_unscored', gate_outcome='suppressed' when other gates passed.
#     Live book will not publish or size without a scored bracket probability.
#     Research capture (nt_signal_sim) still writes the row.
#   fail_open: legacy — keep directional qualified (research comparison only).
# Threshold reject (p_win_bracket < min_p_win_bracket) still requires
# p_win_bracket_mode=live; this policy is about MISSING evidence.
p_win_bracket_unscored_policy: "fail_closed"

# p_win_in_ev_mode (R2, worklog 20260922_L1_CONFIDENT_CALIBRATION_RECOMMENDATIONS.md):
# off | shadow | live. Which probability prices EV and Kelly.
#   off: directional p_win (blend) in EV/Kelly — historical.
#   shadow: log would-be EV from p_win_dir; live EV unchanged.
#   live: EV = p_win_dir*profit − p_sl*stake (expire not charged as loss);
#         Kelly ev_scale follows. p_win_ok gate scores p_win_dir against
#         min_p_win_bracket when live. Unscored bracket fails open (keeps
#         directional EV). Requires p_win_bracket_mode!=off.
#   2026-10-03: p_win_bracket renamed to p_win_dir. p_win_dir now holds
#         the bracket probability (p_resolve * p_win|resolve). The old
#         p_win_dir (directional logit blend = p_win_raw) is deprecated.
p_win_in_ev_mode: "live"

# Per-asset-class min_p_win_bracket thresholds (2026-10-04, worklog
# 20261004_GEOMETRY_GATE_SHADOW_ANALYSIS.md). The geometry gate's false
# positive rate varies by asset class: metals 2.6% (ready), forex 11.8%
# (moderate), equities 16.7% (too aggressive), crypto 25.0% (not useful).
# Each class gets its own threshold, similar to dynamic_atr's per-symbol ATR.
# Classes not listed here fall back to the global min_p_win_bracket.
min_p_win_bracket_by_asset_class:
  metal: 0.20
  forex: 0.30
  equity: 0.40
  crypto: 0.50
  commodity: 0.30
  index: 0.40
  etf: 0.40

# Geometry band calibration urgency (2026-10-04, worklog
# 20261004_GEOMETRY_BAND_CALIBRATION_URGENCY_SCOPE.md).
# Replicates the dynamic_atr methodology: global defaults + by_symbol overrides.
# The urgency process monitors per-bucket calibration bias and triggers
# targeted re-computation when drift exceeds threshold.
#
# Trigger: |bias_shrunk| > urgency_threshold (per symbol, per bucket)
# Action: targeted bucket re-computation (not full rebuild)
# Frequency: 4h check, 4h per-bucket cooldown
# Output: updated nt_bracket_reachability row + nt_eod_actions audit log
#
# by_symbol overrides work exactly like dynamic_atr.by_symbol:
#   - Each symbol can have its own urgency_threshold, min_n, cooldown_hours
#   - Symbols not listed fall back to global defaults
#   - FOREX is a shared key for all forex majors (like dynamic_atr)
geometry_band_urgency:
  enabled: true
  urgency_threshold: 0.15
  min_n: 20
  cooldown_hours: 4
  min_age_hours: 4
  lookback_days: 7
  # Drift detection thresholds (migration 201): compare fresh recomputed
  # stats against previous_stats. Drift is detected when |Δpct_hit_tp| >=
  # drift_threshold_pct OR |Δmedian_hours| >= drift_threshold_hours.
  drift_threshold_pct: 0.10
  drift_threshold_hours: 6.0
  by_symbol:
    FOREX:
      urgency_threshold: 0.15
      min_n: 20
    XAUUSD:
      urgency_threshold: 0.20
      min_n: 30
    XAGUSD:
      urgency_threshold: 0.15
      min_n: 20
    BTCUSD:
      urgency_threshold: 0.10
      min_n: 15

# Rank score calibration feedback (2026-10-04, worklog
# 20261004_RANK_SCORE_ANALYSIS_AND_CALIBRATION_SCOPE.md).
# off: standard Bayesian shrink (status quo).
# shadow: compute rank-conditioned adjustment and log; live unchanged.
# live: apply rank-conditioned adjustment after standard Bayesian shrink.
#   High-rank signals (top tercile) shrink less — trust the model more.
#   Low-rank signals (bottom tercile) shrink more — distrust the model more.
#   The rank score is NOT a gate — it modulates calibration confidence.
rank_score_calibration_mode: "live"
# How strongly the rank score modulates the Bayesian shrink.
# 0.0 = no modulation (standard shrink). 1.0 = full modulation.
# At 1.0: high-rank signals get 50% less shrink, low-rank get 50% more.
rank_score_calibration_slope: 0.5

# geometry_incubation_mode (2026-09-23, worklog
# 20260923_GEOMETRY_FORWARD_TEST_SCOPE.md): off | shadow | live.
# Forward-test / incubation gate on heavy-sweep brick geometry picks —
# today write_brick_params() (config/brick_params.py, "the SOLE writer")
# takes a heavy-sweep combo straight from a single in-sample 90-day grid
# backtest to config/brick_params.yaml, live on the very next light-sweep
# tick. No held-out check exists (tests/test_renko_backtest.py still
# references a walk_forward() removed in v7.3, never rebuilt).
#   off:    byte-identical to today — heavy sweep writes straight to YAML,
#           nt_geometry_incubation (migration 165) is never touched.
#   shadow: heavy sweep STILL writes straight to YAML (zero live behavior
#           change) but every pick is also tracked in
#           nt_geometry_incubation so promote/reject verdicts can be
#           reviewed before anything gates real writes.
#   live:   a new candidate is held as status=incubating (previous live
#           combo keeps trading) until reconcile_incubations() promotes it
#           per the gates below; only then is write_brick_params() called.
geometry_incubation_mode: "shadow"
# Minimum wall-clock days a candidate must incubate before it is eligible
# for promotion, regardless of sample count. Heavy sweep runs DAILY
# (nt_symbol.sweep_cron default '0 20 * * *', changed from weekly
# 2026-09-08 migration 142) — 7 days is deliberately NOT tied to sweep
# cadence; it's a calendar-week floor so incubation sees at least one
# full weekday/weekend cycle of market conditions before a promotion
# decision, not just "wait for the next sweep run" (which would be as
# short as 1 day and too thin a forward sample).
geometry_incubation_min_days: 7
# Minimum forward-RESOLVED (tp_hit/sl_hit) nt_signal_sim rows under the
# exact candidate geometry before promotion — deliberately separate from
# heavy_sweep_grid.min_trades (in-sample backtest count); this is
# out-of-sample count. 20 mirrors the platform's existing calibration
# min-episode conventions (nt_calibration_bias_by_bucket, drift monitor).
geometry_incubation_min_resolved: 20
# Reject a candidate whose forward pct_expired regresses more than this
# many percentage points versus the previous live combo's own
# baseline_pct_expired — a candidate should never legitimately go live if
# it resolves worse than what it is replacing.
geometry_incubation_max_expiry_regression: 0.10
# Adaptive evidence-relative time floor (2026-10-09, worklog
# 20261009_ATR_GEOMETRY_SINGLE_SOURCE.md Part B). The static min_days=7 above
# assumed a uniform ~1 resolution/day cadence; live data shows a 3-5x spread
# (XAGUSD ~101/24h … US500 ~29/24h), and fast symbols never survive the
# no-change supersede churn that resets the 7-day clock (max observed
# incubation age 7.6h; 149/427 supersedes are no-change). adaptive_days_mode
# replaces the fixed floor with one derived from the symbol's FRESH
# nt_signal_sim resolution rate (resolved rows / active day):
#   off:    static geometry_incubation_min_days (historical behaviour).
#   shadow: compute + LOG the adaptive floor, still gate on the static floor
#           (zero live behaviour change).
#   live:   gate on the adaptive floor = ceil(min_resolved / rate), clamped to
#           [adaptive_floor_days, adaptive_cap_days]. A cold/None rate fails
#           open to adaptive_cap_days (= the old floor), so it is never looser
#           than the pre-change gate when there is no evidence.
geometry_incubation_adaptive_days_mode: "shadow"
# Never demand less than this many wall-clock days (a full trading day, so a
# promotion is never decided on an intraday slice), even for the fastest symbol.
geometry_incubation_adaptive_floor_days: 1
# Never relax below this many days; a cold/unknown rate returns exactly this,
# making the fail-open behaviour identical to the old static floor.
geometry_incubation_adaptive_cap_days: 7
# settlement_expiry_mode (2026-10-09, worklog 20261009_P90_HOURS_LIVE_MODE.md):
# fixed | shadow | live. Per-signal dynamic settlement expiry, replacing the
# hard-coded EXPIRY_BARS=48 with a per-bracket horizon derived from
# nt_bracket_reachability. The fixed 48h bar is right for wide brackets and
# wrong for tight ones (median p90: 1-2 bucket 23h, 4+ bucket 56h; 67% of
# n>=30 buckets have p90<=48h). A flat ceil(p90) is the wrong rule — a tight
# bracket that settles in ~4h median would get a LOOSER leash under p90 — so
# the expiry is bracket-aware: median*safety_mult for tight/mid buckets,
# p90 for the wide 4+ bucket (its 54% expiry rate is largely the 48h bar
# cutting a 41h-median/56h-p90 tail). Clamped to [floor, cap].
#   fixed:  byte-identical to today (EXPIRY_BARS=48).
#   shadow: compute + LOG the dynamic expiry and the fixed-vs-dynamic delta,
#           still settle on 48 (zero live change). This is the calibration run.
#   live:   settle each signal on its dynamic expiry; cold/missing
#           reachability row fails open to 48.
# NOTE: the reachability key is currently the coarse 5-bucket ladder, and the
# continuous tp_distance_atr spans a 10x range WITHIN the 4+ bucket. Shadow
# exists to observe whether the coarse bucket yields a usable expiry before
# any rekey to a continuous / per-symbol-normalized ATR is committed to.
settlement_expiry_mode: "fixed"
# Never expire before half a day — a resolving signal must get a real chance.
settlement_expiry_floor_hours: 12.0
# Never hold past 3 days even if p90 is extreme (wide-bucket p90 runs to 78h);
# an unbounded expiry would stall the resolver loop.
settlement_expiry_cap_hours: 72.0
# Tight/mid bucket expiry = median_hours_to_resolve * this multiple. 2.0 → a
# bracket that settles in ~4h gets an ~8h expiry, not a 48h leash.
settlement_expiry_tight_safety_mult: 2.0

# signal_sim_retention_resolved_days (2026-09-23, user-approved; replaces
# settings.EOD_RETENTION_RESOLVED_DAYS=30, which Studio never read — Studio
# injects only Secrets as env, all other knobs live in config/*): the
# nightly retention pass DELETEs resolved nt_signal_sim rows older than
# this. 120 keeps enough history for the Kairos edge-state research
# (worklog/kairos/scopes/20260923_KAIROS_EDGE_STATE_SCOPE.md K0; needs ≥ 60 days of
# regime + geometry + MFE/MAE). ≈ 2,400 resolved rows/day → ~290k rows at
# steady state. Getter floors at 7.
signal_sim_retention_resolved_days: 120

# kairos_mode (2026-09-24, worklog/kairos/scopes/20260924_KAIROS_V3_SCOPE.md P0,
# migration 167): off | shadow | live. shadow stamps the geometry-free
# market-movement capture columns on nt_signal_sim (rel_volume_1h, clv_1h,
# efficiency_24h, atr_ratio_run, spread_bps) and refreshes the daily
# economic-calendar cache (.cache/kairos/econ_calendar.json). Zero effect on
# qualification, sizing, SL/TP or delivery. live is reserved for P3 knobs
# and currently behaves as shadow. drift_12h/48h_pct are written by the
# resolver + nightly backfill regardless of this flag (outcome-side data).
kairos_mode: shadow

# regime_warm_start_mode (2026-09-01, worklog
# 20260901_REGIME_LABEL_STABILITY_SCOPE.md): root-cause fix for
# regime_label flapping tick-to-tick. RegimeHMM.fit() rebuilds and
# re-fits a brand-new hmmlearn model every light-sweep tick with a
# FIXED random_state — deterministic given identical data, so the
# instability traces to the rolling window shifting one bar per tick,
# occasionally nudging hmmlearn's own k-means auto-init across a
# cluster boundary. live seeds each tick's EM initialization from the
# PREVIOUS tick's own converged params (rebased onto this tick's
# standardization scale) instead of a fresh auto-init, so EM starts
# close to last tick's answer and converges to the same partition far
# more often.
#
# Deliberately off | live only — no shadow. A true shadow comparison
# (fit both warm-started AND cold every tick) would double the CPU cost
# of the single most expensive part of each tick, for every symbol,
# forever — not the same cheap-to-compute shadow diagnostic Tier 1/2
# could afford. Confidence instead comes from unit-testing the
# rebasing math directly and a real before/after label-flip-rate
# comparison once live, not a live parallel-shadow computation.
#
# Only affects the light sweep (orchestrator.py) — heavy_sweep.py's own
# regime fit doesn't even thread the existing label-continuity
# (prev_vol_means/prev_trend_means) mechanism today, and its
# weekly-ish, TimesFM-gated cadence means there's no adjacent-tick
# relationship to warm-start from in the first place.
#
# Real-data verification found this alone doesn't reliably solve
# regime_label flapping (regressed AAPL; a follow-up separation guard
# regressed 4 other symbols) — see regime_label_debounce_mode below,
# which real data shows DOES work, consistently, without this. Left
# `off` rather than removed: harmless at rest, and the rebasing math
# stays independently useful if a future need for warm-starting shows
# up for a different reason.
#
# QUOTED (2026-09-12, same YAML-bareword-boolean issue found in
# heavy_sweep_atr_anchored_bricks_mode above): unquoted `off` parses as
# Python False, not the string "off". Confirmed this one had NO live
# effect despite the bug -- every usage site (orchestrator.py:2537/2553)
# checks `== "live"` specifically, which is correctly False for the
# coerced "false" value too. Quoted anyway for correctness/hygiene, not
# because a behavior bug was found here.
regime_warm_start_mode: "off"

# regime_label_debounce_mode (2026-09-01, worklog
# 20260901_REGIME_LABEL_STABILITY_SCOPE.md "Fix 2"): off | shadow |
# live. Hysteresis on RegimeSnapshot.regime_label — RegimeLabelDebouncer
# in regime_engine.py requires regime_label_debounce_ticks consecutive
# ticks of agreement before promoting a new label, per symbol. shadow:
# computes the debounced label and persists a running raw-vs-debounced
# comparison to nt_regime_debounce_shadow, but direction selection and
# regime-shift detection keep reading the RAW label — zero live-
# behavior change. live: direction selection, regime-shift detection,
# and the persisted nt_sweep_result/nt_signal_sim "regime" column all
# switch to the debounced label instead (NOT the regime-based Kelly
# floor in _apply_regime_kelly_floor — that's a separate consumer,
# deliberately left reading the raw label, same wide-blast-radius
# boundary this session has held throughout).
#
# Verified live (500-tick, 5-symbol real-data comparison) BEFORE
# shipping: cuts a raw 36-58% tick-to-tick flip rate down to ~5-8% at
# n_confirm=3, consistently across every symbol tested — unlike
# regime_warm_start_mode above, no per-symbol regression found. Not
# live by default regardless — same shadow-first discipline as every
# other mode flag in this file.
# 2026-09-22: shadow -> live (user approval). Label-stability layer for
# choppy/consolidation flip-flop; 3-tick debounce applied to regime_label
# used for direction. pct_differ 17-24% on FX/crypto at review.
regime_label_debounce_mode: live

# n_confirm for the debouncer above: consecutive ticks of agreement
# required before a new label is promoted. At this system's ~hourly
# effective relabeling cadence (the light sweep re-fits every ~5min,
# but re-fetches the same 200 hourly bars until the next hour rolls
# over, so the label only has an actual opportunity to change roughly
# once an hour), n_confirm=3 means a genuine regime change takes ~3
# hours to be confirmed and reported — a real tradeoff against faster
# response to genuine shifts, tunable. n=2 leaves meaningfully more
# noise through; n=4 buys a little more suppression for another hour
# of lag. 3 was the best balance found in the real-data comparison.
regime_label_debounce_ticks: 3

# regime_state_persist_mode (2026-09-25, worklog/kairos/
# 20260925_RESTART_SAFE_STATE_AND_ACCELERATED_G2.md): off | live.
# Snapshot the debouncers, Kairos run tracker, HMM label-continuity means
# and Markov/trend EMAs to .cache/kairos/regime_state.json after every
# light-sweep symbol and restore them on start. Measured over 22 Studio
# restarts 2026-09-22..25: 58% of symbols changed regime cell across a
# restart vs 9% between normal ticks — restarts, not markets. Live by
# default: it restores the pre-restart state and changes no gate,
# threshold or delivery (the next tick behaves as if nothing stopped).
# Snapshots older than regime_state_persist_max_age_hours are ignored
# (same > 3h gap rule v_kairos_regime_runs uses), so a real outage or
# weekend still cold-starts.
regime_state_persist_mode: live
regime_state_persist_max_age_hours: 3.0

# light_sweep_catchup_mode (2026-09-25, worklog/kairos/
# 20260925_RESTART_SAFE_STATE_AND_ACCELERATED_G2.md §6): off | live.
# On start, re-run the most recent light-sweep slot (within 60 min) for any
# symbol with no sweep-light row since it — a fresh APScheduler never fires
# a slot that passed while the process was down (the 04:18 deploy restart
# on 2026-09-25 dropped the 04:15 slot for all 14 symbols). Skipped when
# the next scheduled tick is < 5 min away and when the swept-symbols read
# fails, so it can never double a tick. Same pipeline, same gates.
light_sweep_catchup_mode: live

# calibration_resolve_hourly_mode (2026-09-25, worklog/kairos/
# 20260926_HOURLY_CALIBRATION_RESOLVE.md; Kairos V3 scope §14.2 lever 1):
# off | shadow | live. TP/SL outcomes reach nt_calibration_records only at
# the 01:17 UTC nightly resolver (median ~11h after the outcome), so the
# bias that corrects the next qualified signal is built on stale evidence.
# Measured on 446 S2 targets: the hourly-evidence version of the SAME bias
# rule improves S2 Brier -0.043 vs -0.025 nightly. Hourly job at :38 (clear
# of the :00/:15/:30/:45 light sweeps, :17 nightly, :20 Kairos job).
#   shadow: read-only dry run — logs what would resolve now (TP/SL/expired
#           counts per symbol) and the evidence-hours saved vs the next
#           nightly. No writes.
#   live:   runs the existing resolver (same close-walk, same minimum-age
#           gate, same calibration-record writer) hourly. Only the timing
#           changes; the bias formula (fetch_calibration_bias) does not.
# The resolver is serialized with the nightly by an in-process lock.
# 2026-09-27 pulse: flipped live (D1). Shadow runs clean (0 errors,
# ~20h evidence saved); HOL parity gap fixed by eod_resolver_scan_full.
calibration_resolve_hourly_mode: live

# calibration_evidence_pool_mode (2026-09-26, Kairos V3 scope §14.3,
# worklog/kairos/20260926_CALIBRATION_EVIDENCE_POOL.md): off | shadow | live.
# Which signals' TP/SL outcomes count as evidence for eod_correction's
# calibration bias. Today every tier counts, and gate_fail is ~84% of it
# (its p_win error is +0.15 vs +0.34/+0.39 for qualified/suppressed), so the
# all-tier bias understates how overconfident qualified signals are.
# Walk-forward on S2: qualified+suppressed pool Δ Brier −0.118 vs all-tier
# −0.043 (both halves of the month). Reads v_calibration_records_tiered
# (migration 171, a view: nt_calibration_records ⋈ nt_signal_sim on
# signal_id). shadow: all-tier bias still enforces; the pooled bias is
# computed and logged as [eod:pool]. live: the pooled bias enforces, with
# an all-tier fallback when the pool bias is INSUFFICIENT.
calibration_evidence_pool_mode: live
calibration_evidence_tiers: [qualified, suppressed]

# eod_resolver_scan_mode (2026-09-26, worklog/kairos/
# 20260926_RESOLVER_HEAD_OF_LINE_FIX.md): full | head. The resolver reads the
# pending queue oldest-first and used to stop at the first batch that
# resolved nothing — so TP/SL already decided behind ~1,000 still-young
# signals waited for the head to expire (2026-09-26 nightly wrote 15 TP /
# 21 SL while 12 TP / 83 SL were decided: losses under-written). full pages
# past still-pending rows to the end of the queue (nightly + hourly live);
# head = old behaviour, rollback only. page_pause_s spaces the batched
# TradingView candle fetches.
eod_resolver_scan_mode: full
eod_resolver_page_pause_s: 2.0

# renko_brick_retention_days (2026-09-09, worklog
# 20260909_CALIBRATION_AND_SCORING_METHODOLOGY_REFRAME.md §7 "Finding 2"):
# nightly retention (regime_platform/sweep_orchestrator/renko_retention.py,
# Part VI of orchestrator.py's eod-lookback cycle) deletes nt_renko_bricks
# rows with session_date older than this many days, on top of the
# separate stale-brick_size-grid prune in the same pass. 2 reuses the
# exact steady state migration 111 already established for this table
# ("Keep at most 2 sessions (today + yesterday) so the Markov series...
# stays feedable and the chart's 10-brick window is always the latest
# session") — not a new number, the same one this table has been designed
# around since 2026-08-09, just enforced on a recurring schedule now
# instead of a one-time migration DELETE.
renko_brick_retention_days: 2

# sweep_result_retention_days / regime_log_retention_days (2026-10-01,
# worklog 20261001_NT_RENKO_BRICKS_TIMEOUT_AND_GROWTH.md §7/§11): neither
# nt_sweep_result nor nt_regime_log had ANY retention pass — a Supabase
# size audit found them at 103.41 MB (17.09% of the database) and 79.47 MB
# (13.13%) respectively, growing with every sweep tick (~174K/~178K
# inserts per migration 177's 2026-09-27 note). A full-repo audit (§10,
# checked every replay/research script + every live app query path)
# confirmed no consumer reads more than ~7 days back. Nightly retention
# (regime_platform/sweep_orchestrator/sweep_result_retention.py, Part VII
# of orchestrator.py's eod-lookback cycle) deletes rows older than these
# cutoffs from each table independently. 30 gives headroom above every
# confirmed need.
sweep_result_retention_days: 30
regime_log_retention_days: 30

# knowledge_index_enabled (2026-09-10, Phase 1 of worklog
# 20260910_AAPL_REGIME_STALENESS_AND_SELF_LEARNING_SCOPE.md SS3): gates the
# nightly local knowledge-index rebuild (regime_platform/services/
