# Brick parameters (v5 — replaces Redis trading:config:{symbol} hash)
#
# This is the source of truth for brick_size, sl_bricks, tp_bricks per symbol.
# The heavy sweep (weekly, weekend 20:00 UTC) rewrites this file with optimised
# values from the ATR-scaled generateBrickSizes() calculation.
#
# Format:
#   defaults: applied to any symbol not listed below
#   symbols: per-symbol overrides (keyed by symbol name)
#
# RR (reward:risk) = tp_bricks / sl_bricks. Should be >= 2.0 to pass MIN_RR=2.0
# gate. Default 5/3 = 1.67 (FAILS MIN_RR) — adjust either tp_bricks up to 6,
# sl_bricks down to 2, or override per symbol below.
#
# Brick velocity model: 1 brick = 1 bar. tp_bricks also serves as N for the
# T^N Markov hold probability (P_markov_hold_N), unless overridden via the
# MARKOV_HOLD_STEPS env var.

defaults:
  brick_size: 0.50
  sl_bricks: 3
  tp_bricks: 6    # 6/3 = 2.0 — passes MIN_RR=2.0

# Per-symbol overrides — populated by the heavy sweep.
# Use asset-class sensible defaults here as a starting point; the heavy sweep
# will rewrite these with ATR-scaled values weekly.
symbols:
  # ── Crypto (high volatility → larger bricks) ──────────────────────
  BTC:
    brick_size: 250.0
    sl_bricks: 3
    tp_bricks: 6
  ETH:
    brick_size: 15.0
    sl_bricks: 3
    tp_bricks: 6
  SOL:
    brick_size: 1.5
    sl_bricks: 3
    tp_bricks: 6

  # ── Equities (medium volatility) ──────────────────────────────────
  AAPL:
    brick_size: 1.0
    sl_bricks: 3
    tp_bricks: 6
  NVDA:
    brick_size: 3.0
    sl_bricks: 3
    tp_bricks: 6
  TSLA:
    brick_size: 2.5
    sl_bricks: 3
    tp_bricks: 6
  SPY:
    brick_size: 1.0
    sl_bricks: 3
    tp_bricks: 6
  QQQ:
    brick_size: 1.0
    sl_bricks: 3
    tp_bricks: 6

  # ── Forex (low volatility, 5th decimal pricing) ───────────────────
  EURUSD:
    brick_size: 0.00100
    sl_bricks: 3
    tp_bricks: 6
  GBPUSD:
    brick_size: 0.00100
    sl_bricks: 3
    tp_bricks: 6
  USDJPY:
    brick_size: 0.100
    sl_bricks: 3
    tp_bricks: 6

  # ── Commodities ───────────────────────────────────────────────────
  GOLD:
    brick_size: 5.0
    sl_bricks: 3
    tp_bricks: 6
  SILVER:
    brick_size: 0.20
    sl_bricks: 3
    tp_bricks: 6
  OIL:
    brick_size: 0.50
    sl_bricks: 3
    tp_bricks: 6
