[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noble-trader-backend"
version = "8.0.0"
description = "Dynamic Regime Risk Management Platform — HMM regime detection, Renko HFT pipeline, GPU-accelerated forecasting, and execution engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Noble Trader", email = "nobletrader@0xdweb.com"},
]
keywords = ["trading", "hmm", "renko", "risk-management", "timesfm", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "hmmlearn>=0.3.2",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "pydantic>=2.11.2",
    "python-multipart>=0.0.9",
    "httpx>=0.28.1",
    "fastapi-mcp>=0.4.0",
    "slowapi>=0.1.9",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "alpaca-py>=0.32.0",
    "urllib3<2.0",
    "yfinance>=0.2.31",
    # TimesFM forecasting
    "timesfm>=2.0.1",
    "torch>=2.4.0",
    "huggingface-hub>=1.0",
    "safetensors>=0.6",
    "gunicorn>=26.0.0",
    "apscheduler>=3.10.0",
    # Self-learning local knowledge index (2026-09-10, Phase 1 of worklog
    # 20260910_AAPL_REGIME_STALENESS_AND_SELF_LEARNING_SCOPE.md) — reuses
    # the torch/huggingface-hub already installed above for TimesFM.
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4",
]
gpu = [
    "pomegranate>=1.0.0",    # GPU-accelerated HMM
    "torch>=2.4.0",          # already in core, explicit for GPU path
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/lexingtontechus/noble-trader-fastapi-backend"
Source = "https://github.com/lexingtontechus/noble-trader-fastapi-backend"
Issues = "https://github.com/lexingtontechus/noble-trader-fastapi-backend/issues"

[tool.setuptools.packages.find]
include = ["regime_platform*", "renko*", "notifications*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
