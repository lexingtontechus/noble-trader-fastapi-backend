services:
  - type: web
    name: noble-trader-fastapi-backend
    runtime: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # ── CORS ───────────────────────────────────────────────────────
      - key: CORS_ORIGINS
        value: https://noble-trader-agent-frontend.vercel.app
      # ── Alpaca Trading API ───────────────────────────────────────
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      # ── Discord Webhooks (Notifications) ─────────────────────────
      - key: DISCORD_WEBHOOK_SIGNALS
        sync: false
      - key: DISCORD_WEBHOOK_EXECUTIONS
        sync: false
      - key: DISCORD_WEBHOOK_STATUS
        sync: false
      # ── Auth (Clerk) ─────────────────────────────────────────────
      - key: CLERK_SECRET_KEY
        sync: false
      # ── CORS ──────────────────────────────────────────────────────
      - key: CORS_ORIGINS
        value: https://noble-trader-agent-frontend.vercel.app
      # ── MCP Auth ──────────────────────────────────────────────────
      - key: MCP_AUTH_ENABLED
        value: "true"
      # ── JWT ───────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        sync: false
	      # ── Redis (Upstash) ────────────────────────────────────────────
	      # Value set via Render dashboard (not committed to repo).
	      # Format: rediss://:<token>@<host>.upstash.io:6379
	      - key: REDIS_URL
	        sync: false
	      # ═════════════════════════════════════════════════════════════
	      # TimesFM env vars are NOT needed here.
	      # TimesFM is called by Supabase Edge Functions (sweep), not FastAPI.
	      # Set TIMESFM_INFERENCE_URL + TIMESFM_API_KEYS + SB_SERVICE_ROLE_KEY
	      # in Supabase Dashboard → Edge Functions → Secrets.
	      # ═════════════════════════════════════════════════════════════
