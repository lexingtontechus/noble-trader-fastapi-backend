openapi: "3.1.0"

info:
  title: Noble Trader Agent - FastAPI Backend
  version: "7.8.0"
  description: |
    A production-grade quantitative trading platform combining two major subsystems:

    ## Renko HFT Pipeline (`/renko/*`)
    A 6-layer Renko brick processing pipeline for high-frequency trading:
    1. **Brick Engine** - price -> Renko brick conversion (fixed / ATR / dynamic sizing)
    2. **Swing Classifier** - HH/HL/LH/LL brick labelling with swing-point detection
    3. **Pattern Detector** - consecutive-swing pattern recognition (bull/bear triggers, double-top/bottom, consolidation)
    4. **Signal Filter** - session-time, regime-gate, cooldown, loss-limit, and velocity filters
    5. **Risk Manager** - bracket orders with SL/TP in brick units, trailing stop, daily loss cap
    6. **Executor** - paper/live order submission via Alpaca with Discord notification hooks

    ## Regime Platform (multiple routers)
    HMM-based regime detection, Kelly position sizing, VaR/CVaR risk analysis,
    walk-forward backtesting, topological data analysis, Monte Carlo simulation,
    multi-asset correlation, portfolio optimisation, live feed adapters, GPU HMM
    acceleration, and real-time streaming over SSE and WebSocket.

    ### Authentication
    Single shared-secret gatekeeping (2026-08-25): every endpoint checks
    the same `X-API-Key` header against one configured `API_KEY` value.
    No roles, no per-user identity, no login/token endpoints.

    SSE endpoints also require auth. The `/health` and `/renko/health` endpoints are public.
  contact:
    name: Noble Trader Agent
    email: nobletrader@0xdweb.com
  license:
    name: MIT

servers:
  - url: https://noble-trader-fastapi-backend.onrender.com
    description: Production (Render)
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Renko HFT Pipeline
    description: 6-layer Renko brick processing pipeline for HFT signal generation and trade execution
  - name: Full Pipeline
    description: One-shot batch analysis (regime + sizing + risk)
  - name: Regime Detection
    description: HMM-based volatility + trend regime classification
  - name: Position Sizing
    description: Regime-gated fractional Kelly Criterion position sizing
  - name: Risk Analysis
    description: VaR, CVaR, drawdown, stop/TP, stress testing
  - name: Strategy Signals
    description: Strategy signal generation with regime context and position sizing
  - name: Backtesting
    description: Walk-forward backtesting, result management, comparison, optimisation, and export
  - name: Observation Builder
    description: 24-feature HMM observation vector construction
  - name: TDA Features
    description: Topological Data Analysis - persistent homology feature extraction
  - name: Simulation
    description: Monte Carlo regime transition simulation
  - name: Portfolio
    description: Multi-symbol aggregated regime + risk, correlation matrix
  - name: Multi-Asset
    description: Portfolio-level correlation regime detection and drawdown-optimised allocation
  - name: Live Stream
    description: REST tick ingestion and session management
  - name: Real-Time Streaming
    description: WebSocket and Server-Sent Events
  - name: Feed Adapters
    description: Alpaca / Binance / IB live data feed management
  - name: GPU Engine
    description: GPU HMM backend capabilities and latency benchmarks
  - name: Admin Config
    description: Runtime configuration management with audit trail and category-based access
  - name: Operational Hardening
    description: Operating mode control, kill switch, reconciliation, and audit logging
  - name: PnL Dashboard
    description: PnL tracking, history, export, and threshold alerts
  - name: Live Stream REST
    description: REST tick ingestion and session management for live streaming
  - name: Health
  - name: Calibration
    description: Calibration loop — bias detection and weight adjustment
  - name: Venue Management
    description: Venue registry and account snapshot tracking
    description: Service health check

# ─────────────────────────────────────────────────────────────────────────────
security:
  - ApiKeyAuth: []

paths:

  # ── HEALTH ────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Health check + Discord status
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: "7.8.0"
                  sessions:
                    type: integer
                    description: Number of active streaming sessions
                  discord:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      channels:
                        type: object
                        properties:
                          signals:
                            type: boolean
                          executions:
                            type: boolean
                          status:
                            type: boolean
                  gpu_backend:
                    type: string
                    example: RegimeHMM (hmmlearn)
                  device:
                    type: string
                    example: cpu

  # ══════════════════════════════════════════════════════════════════════════
  #  RENKO HFT PIPELINE
  # ══════════════════════════════════════════════════════════════════════════

  /renko/tick:
    post:
      tags: [Renko HFT Pipeline]
      summary: Process single tick through 6-layer pipeline
      security:
        - ApiKeyAuth: []
      description: |
        Pushes a single price tick through the full Renko HFT pipeline:
        Brick Engine -> Swing Classifier -> Pattern Detector -> Signal Filter ->
        Risk Manager -> Executor. Returns the complete processing result
        including any generated signals, trade results, and brick updates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TickInput' }
      responses:
        "200":
          description: Tick processing result
          content:
            application/json:
              schema:
                type: object
                description: Pipeline processing result dict
        "422":
          $ref: '#/components/responses/ValidationError'

  /renko/tick/batch:
    post:
      tags: [Renko HFT Pipeline]
      summary: Batch tick processing (backtest/warmup)
      security:
        - ApiKeyAuth: []
      description: |
        Processes a batch of ticks through the Renko pipeline for backtesting
        or warm-up. Supports pre-computed regime labels for regime-gated backtests.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchTickInput' }
      responses:
        "200":
          description: Batch processing result
          content:
            application/json:
              schema:
                type: object
                description: Batch backtest result with trades, bricks, and statistics
        "422":
          $ref: '#/components/responses/ValidationError'

  /renko/state:
    get:
      tags: [Renko HFT Pipeline]
      summary: Current pipeline state with readiness assessment
      security:
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Pipeline state
          content:
            application/json:
              schema:
                type: object
                description: |
                  Complete pipeline state snapshot including readiness assessment.
                  The `readiness` field tells MCP agents whether to trade:
                    - cold: needs warmup (brick_count == 0)
                    - warming: insufficient data (brick_count < 50)
                    - warm: signals active but limited history
                    - hot: full detection + journal, position already open
                    - live_ready: ready for new entries

  /renko/stats:
    get:
      tags: [Renko HFT Pipeline]
      summary: Comprehensive pipeline statistics
      security:
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Pipeline statistics
          content:
            application/json:
              schema:
                type: object
                description: Comprehensive statistics from all pipeline layers

  /renko/bricks:
    get:
      tags: [Renko HFT Pipeline]
      summary: Recent Renko bricks
      security:
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: last_n
          in: query
          schema: { type: integer, default: 100 }
          description: Number of recent bricks to return
      responses:
        "200":
          description: List of Renko bricks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Renko brick with direction, price, timestamp

  /renko/classified:
    get:
      tags: [Renko HFT Pipeline]
      summary: Bricks with swing labels
      security:
        - ApiKeyAuth: []
      description: |
        Returns recent bricks with swing classification labels (HH, HL, LH, LL)
        applied by the Swing Classifier layer.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: last_n
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Classified bricks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Classified brick with swing label

  /renko/signals:
    get:
      tags: [Renko HFT Pipeline]
      summary: Pattern signals history
      security:
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: last_n
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Pattern signals
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Pattern signal with direction, type, strength

  /renko/trades:
    get:
      tags: [Renko HFT Pipeline]
      summary: Trade journal records
      security:
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: last_n
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Trade records
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Trade journal entry with PnL, direction, entry/exit

  /renko/swing-points:
    get:
      tags: [Renko HFT Pipeline]
      summary: Detected swing points
      security:
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: last_n
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Swing points
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Swing point with type (high/low), price, index

  /renko/regime:
    post:
      tags: [Renko HFT Pipeline]
      summary: Update HMM regime for gate filter (admin only)
      security:
        - ApiKeyAuth: []
      description: |
        Updates the current HMM regime label used by the Signal Filter's
        regime gate. Only trades aligned with the current regime are allowed.
        Requires the shared API key.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegimeInput' }
      responses:
        "200":
          description: Regime updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  regime: { type: string }
        "401":
          description: Not authenticated
        "403":
          description: Unauthorized - invalid or missing API key
        "422":
          $ref: '#/components/responses/ValidationError'

  /renko/equity:
    post:
      tags: [Renko HFT Pipeline]
      summary: Update account equity (admin only)
      security:
        - ApiKeyAuth: []
      description: |
        Updates the current account equity used for position sizing
        calculations in the Risk Manager layer.
        Requires the shared API key.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquityInput' }
      responses:
        "200":
          description: Equity updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  equity: { type: number }
        "401":
          description: Not authenticated
        "403":
          description: Unauthorized - invalid or missing API key
        "422":
          $ref: '#/components/responses/ValidationError'

  /renko/config:
    post:
      tags: [Renko HFT Pipeline]
      summary: Update pipeline configuration (resets pipeline)
      security:
        - ApiKeyAuth: []
      description: |
        Replaces the entire pipeline configuration and resets the pipeline
        for the symbol. Requires the shared API key.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigInput' }
      responses:
        "200":
          description: Configuration updated and pipeline reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  config:
                    type: object
                    description: Applied configuration dict
        "422":
          $ref: '#/components/responses/ValidationError'

  /renko/reset:
    post:
      tags: [Renko HFT Pipeline]
      summary: Reset pipeline for a symbol
      security:
        - ApiKeyAuth: []
      description: |
        Resets the pipeline state (bricks, trades, signals) for a symbol
        without changing configuration. Requires the shared API key.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Pipeline reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /renko/health:
    get:
      tags: [Renko HFT Pipeline, Health]
      summary: Renko pipeline diagnostic health check
      description: |
        Tests pipeline creation, runtime_config, and Supabase connectivity.
        No authentication required. Returns status of each subsystem:
        runtime_config, config_creation, pipeline_creation, supabase_snapshot,
        and pipeline_async.
      security: []
      responses:
        "200":
          description: Health check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded, broken]
                    description: Overall health status
                  errors:
                    type: array
                    items: { type: string }
                  runtime_config:
                    type: object
                    properties:
                      available: { type: boolean }
                      cache_entries: { type: integer }
                      db_available: { type: boolean }
                  config_creation:
                    type: object
                    properties:
                      ok: { type: boolean }
                      brick_size: { type: number }
                      symbol: { type: string }
                      brick_size_mode: { type: string }
                  pipeline_creation:
                    type: object
                    properties:
                      ok: { type: boolean }
                      brick_count: { type: integer }
                  supabase_snapshot:
                    type: object
                    properties:
                      ok: { type: boolean }
                      status_code: { type: integer }
                      note: { type: string }
                  pipeline_async:
                    type: object
                    properties:
                      ok: { type: boolean }
                      brick_count: { type: integer }
                      symbol: { type: string }

  /renko/backtest/stats:
    get:
      tags: [Renko HFT Pipeline]
      summary: Backtest statistics from journal
      security:
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Backtest/trading statistics
          content:
            application/json:
              schema:
                type: object
                description: Journal statistics including win rate, PnL, trade count

  /renko/backtest/run:
    post:
      tags: [Renko HFT Pipeline]
      summary: Run full backtest with Phase 2-7 analytics
      security:
        - ApiKeyAuth: []
      description: |
        Runs a complete Renko backtest with transaction cost modeling (Phase 2),
        execution realism (Phase 3), statistical rigor (Phase 6), and execution
        modeling (Phase 7). Uses runtime config as the base, then applies the
        explicit overrides from the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenkoBacktestRequest' }
      responses:
        "200":
          description: Backtest result with analytics
          content:
            application/json:
              schema:
                type: object
                description: Full backtest result with Phase 2-7 analytics
        "422":
          $ref: '#/components/responses/ValidationError'

  /renko/backtest/run/stream:
    post:
      tags: [Renko HFT Pipeline]
      summary: SSE streaming backtest
      security:
        - ApiKeyAuth: []
      description: |
        Runs a Renko backtest with Server-Sent Events streaming. Emits chunk
        results as they are computed, allowing real-time progress display.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenkoBacktestStreamRequest' }
      responses:
        "200":
          description: SSE stream of backtest chunks
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE events with JSON-encoded backtest chunks

  /renko/backtest/optimize:
    post:
      tags: [Renko HFT Pipeline]
      summary: Parameter sweep optimization with statistical rigor
      security:
        - ApiKeyAuth: []
      description: |
        Runs a grid-search parameter sweep over brick_sizes × sl_bricks × tp_bricks
        combinations. Applies multiple testing corrections (Bonferroni, Holm-Bonferroni,
        Benjamini-Hochberg) and computes the Deflated Sharpe Ratio for the best strategy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenkoOptimizationRequest' }
      responses:
        "200":
          description: Optimization results with statistical rigor
          content:
            application/json:
              schema:
                type: object
                properties:
                  n_combinations: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        brick_size: { type: number }
                        sl_bricks: { type: integer }
                        tp_bricks: { type: integer }
                        total_trades: { type: integer }
                        win_rate: { type: number }
                        sharpe: { type: number }
                        profit_factor: { type: number }
                  multiple_testing: { type: object }
                  deflated_sharpe: { type: object }
                  best: { type: object }

  /renko/statistics/rigor:
    post:
      tags: [Renko HFT Pipeline]
      summary: Statistical rigor tests (Phase 6)
      security:
        - ApiKeyAuth: []
      description: |
        Runs bootstrap confidence intervals, Deflated Sharpe Ratio, and
        significance tests on trade results. Validates that observed
        performance is statistically significant and not due to data snooping.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatisticalRigorRequest' }
      responses:
        "200":
          description: Statistical rigor test results
          content:
            application/json:
              schema:
                type: object
                properties:
                  bootstrap_ci: { type: object }
                  deflated_sharpe: { type: object }
                  significance_tests: { type: object }

  /renko/execution/model:
    post:
      tags: [Renko HFT Pipeline]
      summary: Execution modeling costs (Phase 7)
      security:
        - ApiKeyAuth: []
      description: |
        Computes execution modeling costs including market impact (Almgren-Chriss),
        fill probability, and financing costs (borrow, margin, dividends).
        Uses runtime_config as the source of defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionModelRequest' }
      responses:
        "200":
          description: Execution modeling cost breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  market_impact: { type: object }
                  fill_probability: { type: object }
                  financing_costs: { type: object }

  /renko/live/status:
    get:
      tags: [Renko HFT Pipeline]
      summary: Live execution status
      security:
        - ApiKeyAuth: []
      description: |
        Returns the current live execution status for a pipeline, including
        whether it is in dry_run or live mode, the execution mode, and
        whether a position is currently open.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Live execution status
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol: { type: string }
                  dry_run: { type: boolean }
                  live_enabled: { type: boolean }
                  execution_mode: { type: string, enum: [simulation, paper, live] }
                  has_position: { type: boolean }

  /renko/live/toggle:
    post:
      tags: [Renko HFT Pipeline]
      summary: Toggle live execution (admin only)
      security:
        - ApiKeyAuth: []
      description: |
        Toggle live execution for a pipeline. When enabled=False, sets
        dry_run=True (safe mode). When enabled=True, sets dry_run=False
        and live_enabled=True. Requires the shared API key.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: enabled
          in: query
          schema: { type: boolean, default: true }
          description: Enable or disable live execution
      responses:
        "200":
          description: Execution mode updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  symbol: { type: string }
                  dry_run: { type: boolean }
                  live_enabled: { type: boolean }

  /renko/warmup:
    post:
      tags: [Renko HFT Pipeline]
      summary: Backend-native pipeline warmup (Yahoo fetch + snapshot save)
      security:
        - ApiKeyAuth: []
      description: |
        Warm up a Renko pipeline with historical prices from Yahoo Finance.
        This endpoint replaces the BFF (Next.js frontend) warmup, enabling
        MCP agents to fully operate the pipeline without any frontend dependency.

        Flow:
          1. Check Supabase for a fresh snapshot (<4h) - if found, restore it (instant)
          2. Fetch historical prices from Yahoo Finance (via yfinance or Yahoo v8 API)
          3. Create a fresh pipeline with runtime config
          4. Set regime to `low_vol_bull` (enables signal generation during warmup)
          5. Feed prices through the pipeline via backtest (warmup mode)
          6. Save snapshot to Supabase
          7. Prune stale snapshots older than 24h (housekeeping)

        Requires the shared API key.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: period
          in: query
          schema: { type: string, default: 6mo }
          description: Yahoo Finance period (1mo, 3mo, 6mo, 1y, 2y, 5y, max)
        - name: chunk_size
          in: query
          schema: { type: integer, default: 150 }
      responses:
        "200":
          description: Warmup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  symbol: { type: string }
                  source: { type: string, enum: [snapshot_restore, yahoo_fetch, stale_snapshot_restore] }
                  age_seconds: { type: integer, description: Age of restored snapshot in seconds (snapshot_restore only) }
                  prices_fed: { type: integer, description: Number of prices processed (yahoo_fetch only) }
                  brick_count: { type: integer }
                  total_trades: { type: integer }
                  total_pnl_bricks: { type: number }
                  pruned_snapshots: { type: integer, description: Number of stale snapshots pruned (yahoo_fetch only) }
                  state: { type: object, description: Pipeline state dict }
                  elapsed_ms: { type: integer }
        "401":
          description: Not authenticated
        "403":
          description: Forbidden - write role required
        "502":
          description: Yahoo Finance fetch failed and no snapshot available

  /renko/snapshot/save:
    post:
      tags: [Renko HFT Pipeline]
      summary: Save pipeline state to Supabase (confirmed)
      security:
        - ApiKeyAuth: []
      description: |
        Explicitly saves the current pipeline state to Supabase
        (awaited, confirmed write). Unlike automatic periodic saves
        (fire-and-forget), this endpoint awaits the upsert and returns
        confirmation including snapshot version, brick/trade counts,
        active position status, and pipeline readiness.

        MCP agents should use this after critical state changes (regime,
        equity, position open) where persistence must be guaranteed before
        proceeding.

        Requires the shared API key.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Snapshot save confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, failed] }
                  symbol: { type: string }
                  snapshot_version: { type: integer, description: Snapshot format version (3) }
                  brick_count: { type: integer }
                  total_trades: { type: integer }
                  has_active_position: { type: boolean }
                  snapshot_ts: { type: number, description: Unix timestamp of snapshot }
                  bricks_serialized: { type: integer }
                  trades_serialized: { type: integer }
                  classified_serialized: { type: integer }
                  readiness: { type: object, description: Pipeline readiness assessment }
        "401":
          description: Not authenticated
        "403":
          description: Forbidden - write role required

  /renko/snapshot/restore:
    post:
      tags: [Renko HFT Pipeline]
      summary: Restore pipeline from Supabase snapshot (write access)
      security:
        - ApiKeyAuth: []
      description: |
        Attempts to restore a pipeline from Supabase (~100ms).

        If no snapshot exists, returns restored=false.
        v3 snapshots include full brick history, classified bricks, trade
        journal, active position with trailing stop state, and signal filter
        state - enabling complete pipeline hydration without warmup.

        Requires the shared API key.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Snapshot restore result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  symbol: { type: string }
                  restored: { type: boolean }
                  message: { type: string }
                  state:
                    type: object
                    description: Pipeline state dict (when restored=true)
        "401":
          description: Not authenticated
        "403":
          description: Forbidden - write role required

  /renko/sizing/model:
    get:
      tags: [Renko HFT Pipeline, Position Sizing]
      summary: Get current position sizing model and parameters
      description: |
        Returns the current position sizing model (kelly or masaniello) and its
        parameters for a given symbol. Includes Kelly parameters always, and
        Masaniello parameters when the sizing mode is `masaniello`.
        Also returns the current batch state for Masaniello tracking.
        Requires the shared API key.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Current sizing model and parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  sizing_mode:
                    type: string
                    enum: [kelly, masaniello]
                    description: Active position sizing model
                  kelly:
                    type: object
                    description: Kelly criterion parameters
                    properties:
                      kelly_fraction: { type: number, description: Kelly fraction (e.g. 0.5) }
                      max_position_pct: { type: number, description: Max position as fraction of equity (e.g. 0.10) }
                      min_position_usd: { type: number, description: Minimum order value in USD }
                      default_win_rate: { type: number, description: Fallback win rate when no journal history }
                  masaniello:
                    type: object
                    nullable: true
                    description: Masaniello parameters (present only when sizing_mode=masaniello)
                    properties:
                      max_drawdown: { type: number, description: Maximum allowed drawdown fraction }
                      regime_floor: { type: number, description: Regime probability floor for sizing }
                      use_kelly_overlay: { type: boolean, description: Whether Kelly overlays Masaniello sizing }
                      batch_size: { type: integer, description: Number of trades per Masaniello batch }
                      target_wins: { type: integer, description: Target wins per batch }
                  batch_state:
                    type: object
                    nullable: true
                    description: Current Masaniello batch tracking state
                    properties:
                      wins: { type: integer, description: Wins in current batch }
                      losses: { type: integer, description: Losses in current batch }
                      trade_index: { type: integer, description: Current trade index within batch }
                      initial_equity: { type: number, description: Equity at batch start }
                      peak_equity: { type: number, description: Peak equity in batch }
                      pnl: { type: number, description: Cumulative P&L in batch }
        "401":
          description: Not authenticated

    post:
      tags: [Renko HFT Pipeline, Position Sizing]
      summary: Set position sizing model (admin only)
      description: |
        Sets the position sizing model and its parameters for a given symbol.
        Switches between Kelly Criterion and Masaniello sizing modes, and
        updates all associated parameters.
        Requires the shared API key.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SizingModelRequest' }
      responses:
        "200":
          description: Sizing model updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  symbol: { type: string }
                  sizing_mode: { type: string, enum: [kelly, masaniello] }
                  config:
                    type: object
                    description: Applied sizing configuration dict
        "401":
          description: Not authenticated
        "403":
          description: Unauthorized - invalid or missing API key
        "422":
          $ref: '#/components/responses/ValidationError'

  # ══════════════════════════════════════════════════════════════════════════
  #  REGIME PLATFORM
  # ══════════════════════════════════════════════════════════════════════════

  # ── FULL PIPELINE ──────────────────────────────────────────────────────────

  /analyse/full:
    post:
      tags: [Full Pipeline]
      summary: One-shot full pipeline - regime + sizing + risk
      description: |
        Runs the complete pipeline in a single request:
        1. Fit dual Gaussian HMMs -> regime posteriors + risk_multiplier
        2. Fractional Kelly -> vol-scaled -> regime-gated position size
        3. Historical VaR/CVaR, drawdown, stop/TP suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FullAnalysisRequest' }
            example:
              symbol: SPY
              prices: [450.1, 451.3, 449.8, 452.0]
              kelly_fraction: 0.5
              target_vol: 0.15
              base_risk_limit: 0.02
      responses:
        "200":
          description: Full analysis result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FullAnalysisResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  # ── REGIME DETECTION ──────────────────────────────────────────────────────

  /regime/detect:
    post:
      tags: [Regime Detection]
      summary: Detect market regime from price series
      description: |
        Fits dual Gaussian HMMs (volatility + trend) on the supplied price
        series and returns posterior regime probabilities plus a risk multiplier.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricePayload' }
      responses:
        "200":
          description: Regime classification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegimeResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  /regime/detect-v2:
    post:
      tags: [Regime Detection]
      summary: Enhanced regime detection with configurable 2-4 states
      description: |
        Enhanced HMM regime detection with configurable states per dimension,
        auto-labeled states sorted by emission means, transition matrix entropy,
        and regime stability metric.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegimeV2Request' }
      responses:
        "200":
          description: Enhanced regime classification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegimeV2Response' }
        "422":
          $ref: '#/components/responses/ValidationError'

  /regime/simulate/{symbol}:
    post:
      tags: [Regime Detection, Simulation]
      summary: Markov-chain regime simulation
      description: |
        Fits a 4-state HMM on the supplied price series, then simulates
        `n_paths` forward paths of `horizon` bars using the fitted
        Markov transition matrix.
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateRequest' }
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulateResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  # ── POSITION SIZING ───────────────────────────────────────────────────────

  /size/kelly:
    post:
      tags: [Position Sizing]
      summary: Regime-gated fractional Kelly sizing
      description: |
        Computes fractional Kelly position size, optionally scaled by
        current realised volatility vs target volatility and the dynamic
        regime risk multiplier from HMM.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SizeRequest' }
      responses:
        "200":
          description: Kelly sizing result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SizeResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  # ── RISK ANALYSIS ─────────────────────────────────────────────────────────

  /risk/analyse:
    post:
      tags: [Risk Analysis]
      summary: VaR, CVaR, drawdown, stop/TP
      description: |
        Computes comprehensive risk metrics including parametric + historical
        VaR/CVaR, max drawdown, Sortino & Calmar ratios, and regime-adjusted
        stop-loss/take-profit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiskRequest' }
      responses:
        "200":
          description: Risk analysis result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  /risk/analyze:
    post:
      tags: [Risk Analysis]
      summary: Enhanced risk analysis with stress testing
      description: |
        Enhanced risk analysis (US spelling endpoint) with VaR/CVaR,
        stress test scenarios (2008 crash, flash crash, volatility spike,
        rate shock, liquidity crisis), and regime context.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiskAnalyzeRequest' }
      responses:
        "200":
          description: Enhanced risk analysis result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskAnalyzeResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  /risk/stress-test:
    post:
      tags: [Risk Analysis]
      summary: Portfolio stress testing
      description: |
        Runs stress test scenarios on a portfolio including 2008-style crash,
        flash crash, volatility spike, interest rate shock, and liquidity crisis.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiskAnalyzeRequest' }
      responses:
        "200":
          description: Stress test results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskAnalyzeResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  # ── STRATEGY SIGNALS ──────────────────────────────────────────────────────

  /strategy/signal:
    post:
      tags: [Strategy Signals]
      summary: Strategy signal generation
      description: |
        Full strategy signal pipeline:
        1. Fit HMM regime model -> detect current regime
        2. Generate trading signal (long/short/flat) based on regime
        3. Compute regime-gated Kelly position size
        4. Compute risk metrics and guidance (stop/TP, VaR/CVaR)
        5. Return combined signal with all context
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrategySignalRequest' }
      responses:
        "200":
          description: Strategy signal result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategySignalResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  # ── BACKTESTING ───────────────────────────────────────────────────────────

  /backtest/run:
    post:
      tags: [Backtesting]
      summary: Backtest execution
      description: |
        Walk-forward backtest pipeline with 30+ metrics:
        1. Rolling HMM fit on trailing window
        2. Strategy signal generation based on regime
        3. Regime-gated Kelly position sizing
        4. Risk check gates (VaR, max drawdown)
        5. Trade execution with commission/slippage
        6. Comprehensive performance metrics
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BacktestRequest' }
      responses:
        "200":
          description: Backtest result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacktestResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  /backtest/history:
    get:
      tags: [Backtesting]
      summary: Paginated list of saved backtest results
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated backtest result list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }

  /backtest/{id}:
    get:
      tags: [Backtesting]
      summary: Full backtest result by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full backtest result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BacktestResponse' }
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Backtesting]
      summary: Delete a saved backtest result
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Backtest deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: deleted }
                  id: { type: string }
        "404":
          $ref: '#/components/responses/NotFound'

  /backtest/compare:
    post:
      tags: [Backtesting]
      summary: Side-by-side comparison of saved results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                  minItems: 2
                  maxItems: 10
                  description: Backtest result IDs to compare
      responses:
        "200":
          description: Comparison result
          content:
            application/json:
              schema:
                type: object
                description: Side-by-side comparison of backtest metrics

  /backtest/optimize:
    post:
      tags: [Backtesting]
      summary: Parameter grid sweep (max 50 combos)
      description: |
        Runs a parameter grid sweep over backtest configurations.
        Maximum of 50 parameter combinations per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices, param_grid]
              properties:
                symbol: { type: string, default: UNKNOWN }
                prices:
                  type: array
                  items: { type: number, exclusiveMinimum: 0 }
                  minItems: 81
                param_grid:
                  type: object
                  description: Parameter ranges to sweep
                  properties:
                    kelly_fraction:
                      type: array
                      items: { type: number }
                    target_vol:
                      type: array
                      items: { type: number }
                    window:
                      type: array
                      items: { type: integer }
      responses:
        "200":
          description: Optimisation results
          content:
            application/json:
              schema:
                type: object
                description: Grid sweep results ranked by Sharpe ratio

  /backtest/export:
    post:
      tags: [Backtesting]
      summary: Export result as CSV/JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, format]
              properties:
                id:
                  type: string
                  description: Backtest result ID to export
                format:
                  type: string
                  enum: [csv, json]
                  description: Export format
      responses:
        "200":
          description: Exported backtest data
          content:
            application/json:
              schema:
                type: object
                description: Exported backtest result in requested format
            text/csv:
              schema:
                type: string
                description: CSV export of trade log and metrics

  # ── PORTFOLIO ─────────────────────────────────────────────────────────────

  /portfolio/:
    get:
      tags: [Portfolio]
      summary: Multi-symbol aggregated regime + risk
      description: |
        Returns a portfolio-level view aggregating all (or specified) active
        streaming sessions. Includes per-symbol regime, risk, and Kelly data,
        plus portfolio-level VaR, regime consensus, and risk flags.
      parameters:
        - name: symbols
          in: query
          schema: { type: string }
          description: Comma-separated symbols (omit for all active sessions)
        - name: kelly_fraction
          in: query
          schema: { type: number, default: 0.5, minimum: 0.1, maximum: 1.0 }
        - name: target_vol
          in: query
          schema: { type: number, default: 0.15, exclusiveMinimum: 0, maximum: 1.0 }
        - name: base_risk_limit
          in: query
          schema: { type: number, default: 0.02, exclusiveMinimum: 0, maximum: 0.5 }
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioResponse' }
        "500":
          description: Internal error

  /portfolio/correlation:
    get:
      tags: [Portfolio]
      summary: Correlation matrix
      description: |
        Returns the correlation matrix across all active streaming session symbols.
      responses:
        "200":
          description: Correlation matrix
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbols:
                    type: array
                    items: { type: string }
                  matrix:
                    type: array
                    items:
                      type: array
                      items: { type: number }

  # ── TDA FEATURES ──────────────────────────────────────────────────────────

  /tda/features:
    post:
      tags: [TDA Features]
      summary: TDA feature extraction
      description: |
        Topological Data Analysis feature extraction using persistent homology:
        1. Compute log-returns from price series
        2. Create Takens time-delay embedding (point cloud)
        3. Compute persistent homology (0-dim: connected components, 1-dim: loops)
        4. Compute Betti numbers at each filtration step
        5. Compute persistence entropy (topological complexity)
        6. Compute anomaly score and regime change probability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TDARequest' }
      responses:
        "200":
          description: TDA feature extraction result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TDAResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  # ── OBSERVATION BUILDER ───────────────────────────────────────────────────

  /observation/build:
    post:
      tags: [Observation Builder]
      summary: 24-feature HMM observation vector
      description: |
        Constructs the full 24-feature observation vector used by the RL/ML
        policy layer. Features 14–19 are Markov features: live HMM posterior
        probabilities from a fitted RegimeHMM.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationRequest' }
      responses:
        "200":
          description: Observation vector
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  /observation/batch:
    post:
      tags: [Observation Builder]
      summary: Batch observation building
      description: |
        Builds observation vectors for multiple price windows in a single
        request. Useful for pre-computing features for ML training.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [windows]
              properties:
                windows:
                  type: array
                  items: { $ref: '#/components/schemas/ObservationRequest' }
                  maxItems: 100
      responses:
        "200":
          description: Batch observation results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ObservationResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  # ── SIMULATION ────────────────────────────────────────────────────────────

  /simulate/{symbol}:
    post:
      tags: [Simulation]
      summary: Monte Carlo simulation
      description: |
        Fits a 4-state HMM on the supplied price series, then simulates
        `n_paths` forward paths of `horizon` bars using the fitted
        Markov transition matrix. Returns price fan, terminal return
        distribution, and regime path projections.
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateRequest' }
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulateResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  # ── LIVE STREAM ───────────────────────────────────────────────────────────

  /stream/seed:
    post:
      tags: [Live Stream]
      summary: Seed historical prices
      description: |
        Creates (or resets) a streaming session for a symbol and pre-loads
        historical prices so the HMM can be fitted immediately. Must be called
        before streaming ticks for a new symbol.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeedRequest' }
      responses:
        "200":
          description: Session created and seeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatus' }
        "422":
          $ref: '#/components/responses/ValidationError'

  /stream/tick:
    post:
      tags: [Live Stream]
      summary: Ingest single tick
      description: |
        Push a single price tick. Returns a full TickResponse once the
        session has enough bars; returns a buffering stub while warming up.
        The session must have been seeded first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TickIngest' }
      responses:
        "200":
          description: Tick snapshot or buffering stub
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TickResponse'
                  - $ref: '#/components/schemas/BufferingStub'
        "404":
          $ref: '#/components/responses/NotFound'

  /stream/ticks:
    post:
      tags: [Live Stream]
      summary: Batch tick ingestion
      description: |
        Replay or batch-ingest multiple ticks. Returns a snapshot for each
        tick (or a buffering stub when warming up). Useful for backtesting/replay.
      parameters:
        - name: symbol
          in: query
          required: true
          schema: { type: string }
        - name: prices
          in: query
          required: true
          schema:
            type: array
            items: { type: number }
        - name: timestamps
          in: query
          required: false
          schema:
            type: array
            items: { type: number }
      responses:
        "200":
          description: Array of tick snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/TickResponse'
                    - $ref: '#/components/schemas/BufferingStub'
        "404":
          $ref: '#/components/responses/NotFound'

  /stream/sessions:
    get:
      tags: [Live Stream]
      summary: List active streaming sessions
      description: Returns all active streaming sessions and their stats.
      responses:
        "200":
          description: Map of symbol -> session stats
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/SessionStats'

  /stream/session/{symbol}:
    get:
      tags: [Live Stream]
      summary: Get session status
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatus' }
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Live Stream]
      summary: Remove a session
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: removed }
                  symbol: { type: string }

  # ── FEED ADAPTERS ─────────────────────────────────────────────────────────

  /feeds/status:
    get:
      tags: [Feed Adapters]
      summary: Feed adapter health
      description: Returns running state and per-symbol bar counts for all active feed adapters.
      responses:
        "200":
          description: Feed adapter status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedStatusResponse' }

  /feeds/start:
    post:
      tags: [Feed Adapters]
      summary: Start Alpaca/Binance/IB feed
      description: |
        Start one or more live feed adapters. Symbols must be seeded via
        `POST /stream/seed` before starting feeds. Adapters reconnect
        automatically on disconnect (exponential backoff).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/FeedConfig' }
      responses:
        "200":
          description: Feeds started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: started }
                  adapters:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string }
                        symbols:
                          type: array
                          items: { type: string }
                  note: { type: string }
        "409":
          description: Feeds already running

  /feeds/stop:
    post:
      tags: [Feed Adapters]
      summary: Stop a feed adapter
      description: Gracefully stops all running feed adapter tasks.
      responses:
        "200":
          description: Feeds stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: stopped }

  # ── GPU ENGINE ────────────────────────────────────────────────────────────

  /gpu/capabilities:
    get:
      tags: [GPU Engine]
      summary: GPU HMM backend info
      description: |
        Returns which HMM backend will be used and what hardware is available.
        - `hmm_backend`: `"GpuRegimeHMM (pomegranate)"` or `"RegimeHMM (hmmlearn)"`
        - `active_device`: `"cuda"` | `"mps"` | `"cpu"`
      responses:
        "200":
          description: GPU capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GpuCapabilitiesResponse' }

  /gpu/benchmark:
    post:
      tags: [GPU Engine]
      summary: HMM fit/predict latency benchmark
      description: |
        Runs `n_iterations` fit+predict cycles on synthetic price data of
        length `n_bars`. Returns mean latency for fit and predict separately.
        Use `force_cpu=true` to benchmark the hmmlearn baseline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BenchmarkRequest' }
      responses:
        "200":
          description: Benchmark result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenchmarkResult' }
        "422":
          $ref: '#/components/responses/ValidationError'

  # ── SSE ───────────────────────────────────────────────────────────────────

  /sse/{symbol}:
    get:
      tags: [Real-Time Streaming]
      summary: SSE stream per-symbol regime snapshots
      description: |
        Server-Sent Events stream. Pushes a TickResponse JSON on every tick
        processed for `symbol`. Requires a seeded session. Sends comment
        heartbeats every 15 seconds of inactivity.

        Connect with: `new EventSource('/sse/SPY')`
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each `data:` line is a JSON-serialised TickResponse.
                  First event: `{"type": "connected", "symbol": "SPY"}`
        "404":
          $ref: '#/components/responses/NotFound'

  /sse/alerts:
    get:
      tags: [Real-Time Streaming]
      summary: Global SSE alert stream
      description: |
        Broadcasts RegimeAlert events across all active symbol sessions.
        Only fires on regime state transitions (not every tick).

        Connect with: `new EventSource('/sse/alerts')`
      responses:
        "200":
          description: SSE alert stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each `data:` line is a JSON-serialised RegimeAlert.
                  First event: `{"type": "connected", "scope": "alerts"}`

  # ── WEBSOCKET ─────────────────────────────────────────────────────────────

  /ws/{symbol}:
    get:  # OpenAPI workaround - actual protocol is WS
      tags: [Real-Time Streaming]
      summary: WebSocket stream
      description: |
        Full-duplex WebSocket for a single symbol. Connect, then send JSON
        messages to seed / push ticks. The server pushes back a regime
        snapshot after every tick and an alert message on regime transitions.

        **Client -> Server messages:**
        - `{"type":"seed", "symbol":"SPY", "prices":[...]}`
        - `{"type":"tick", "symbol":"SPY", "price":512.34}`
        - `{"type":"subscribe", "symbol":"SPY"}`
        - `{"type":"ping"}`

        **Server -> Client messages:**
        - Tick snapshots (TickResponse JSON)
        - `{"type":"pong"}`
        - `{"type":"error", "detail":"..."}`
        - `{"type":"alert", ...}`
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        "101":
          description: WebSocket upgrade

  # ══════════════════════════════════════════════════════════════════════════
  #  ADMIN CONFIG API
  # ══════════════════════════════════════════════════════════════════════════

  /config/:
    get:
      tags: [Admin Config]
      summary: Get all config entries
      description: |
        Returns all runtime configuration entries across every category.
        Requires the shared API key.
      responses:
        "200":
          description: All config entries
          content:
            application/json:
              schema:
                type: object
                description: Map of config key -> value with metadata

  /config/categories:
    get:
      tags: [Admin Config]
      summary: List config categories
      description: |
        Returns a list of all available configuration categories.
        Requires the shared API key.
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /config/{category}:
    get:
      tags: [Admin Config]
      summary: Get config by category
      description: |
        Returns all configuration entries for a specific category.
        Requires the shared API key.
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
          description: Configuration category name
      responses:
        "200":
          description: Category config entries
          content:
            application/json:
              schema:
                type: object
                description: Map of config key -> value for the category
        "404":
          $ref: '#/components/responses/NotFound'

  /config/schema:
    get:
      tags: [Admin Config]
      summary: Get full config schema
      description: |
        Returns the complete configuration schema including all keys, types,
        defaults, descriptions, and validation rules.
        Requires the shared API key.
      responses:
        "200":
          description: Full configuration schema
          content:
            application/json:
              schema:
                type: object
                description: Schema document with types, defaults, and validation rules

  /config/audit:
    get:
      tags: [Admin Config]
      summary: Get config audit log
      description: |
        Returns the audit trail of all configuration changes including who
        changed what, when, and the previous value.
        Requires the shared API key.
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    old_value: { type: string, nullable: true }
                    new_value: { type: string }
                    changed_by: { type: string }
                    changed_at: { type: string, format: date-time }
                    category: { type: string }

  /config/key/{key}:
    get:
      tags: [Admin Config]
      summary: Get single config key
      description: |
        Returns the current value and metadata for a single configuration key.
        Requires the shared API key.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          description: Configuration key name
      responses:
        "200":
          description: Config key value
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  value: { type: string }
                  default: { type: string }
                  type: { type: string }
                  category: { type: string }
                  description: { type: string }
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin Config]
      summary: Update a config value
      description: |
        Updates a single configuration key. The change is audited.
        Requires the shared API key.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          description: Configuration key name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  description: New value for the config key
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  key: { type: string }
                  old_value: { type: string, nullable: true }
                  new_value: { type: string }
        "404":
          $ref: '#/components/responses/NotFound'

  /config/key/{key}/reset:
    post:
      tags: [Admin Config]
      summary: Reset a config key to default
      description: |
        Resets a configuration key to its default value. The change is audited.
        Requires the shared API key.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          description: Configuration key name
      responses:
        "200":
          description: Config reset to default
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: reset }
                  key: { type: string }
                  default_value: { type: string }
        "404":
          $ref: '#/components/responses/NotFound'

  /config/reload:
    get:
      tags: [Admin Config]
      summary: Force reload config from DB
      description: |
        Forces a reload of all configuration from the database, discarding
        any in-memory cache. Requires the shared API key.
      responses:
        "200":
          description: Config reloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: reloaded }
                  entries_loaded: { type: integer }

  # ══════════════════════════════════════════════════════════════════════════
  #  OPERATIONAL HARDENING
  # ══════════════════════════════════════════════════════════════════════════

  /operational/mode:
    get:
      tags: [Operational Hardening]
      summary: Current operating mode
      description: |
        Returns the current operating mode (e.g. simulation, paper, live)
        and mode metadata including who set it and when.
      responses:
        "200":
          description: Operating mode
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [simulation, paper, live] }
                  set_by: { type: string }
                  set_at: { type: string, format: date-time }
                  pending_change: { type: boolean }

  /operational/mode/request:
    post:
      tags: [Operational Hardening]
      summary: Request mode change
      description: |
        Requests a change to the operating mode. Requires confirmation via
        `/operational/mode/confirm` within a timeout window. Critical mode
        changes (e.g. to `live`) require two-step confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [simulation, paper, live]
                  description: Target operating mode
      responses:
        "200":
          description: Mode change requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: pending }
                  requested_mode: { type: string }
                  confirmation_required: { type: boolean }
                  timeout_seconds: { type: integer }
        "409":
          description: Mode change already pending

  /operational/mode/confirm:
    post:
      tags: [Operational Hardening]
      summary: Confirm mode change
      description: |
        Confirms a previously requested mode change. Must be called within
        the confirmation timeout window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [simulation, paper, live]
                  description: Mode to confirm (must match pending request)
      responses:
        "200":
          description: Mode change confirmed and applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: confirmed }
                  mode: { type: string }
        "409":
          description: No pending mode change or mismatch

  /operational/mode/health:
    get:
      tags: [Operational Hardening, Health]
      summary: Mode health check
      description: |
        Returns the health status of the operating mode subsystem, including
        connectivity to execution venues and data feeds.
      responses:
        "200":
          description: Mode health
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string }
                  healthy: { type: boolean }
                  execution_connected: { type: boolean }
                  feed_connected: { type: boolean }
                  latency_ms: { type: number }

  /operational/kill-switch/status:
    get:
      tags: [Operational Hardening]
      summary: Kill switch status
      description: |
        Returns the current status of the kill switch, including whether
        it is active and when it was last activated/deactivated.
      responses:
        "200":
          description: Kill switch status
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  activated_at: { type: string, format: date-time, nullable: true }
                  activated_by: { type: string, nullable: true }
                  reason: { type: string, nullable: true }

  /operational/kill-switch/activate:
    post:
      tags: [Operational Hardening]
      summary: Activate kill switch
      description: |
        Activates the kill switch. Immediately halts all new order submissions
        and optionally cancels existing orders. Requires the shared API key.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for activation
                cancel_orders:
                  type: boolean
                  default: true
                  description: Cancel all open orders on activation
      responses:
        "200":
          description: Kill switch activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: activated }
                  orders_cancelled: { type: integer }
                  timestamp: { type: string, format: date-time }

  /operational/kill-switch/deactivate:
    post:
      tags: [Operational Hardening]
      summary: Deactivate kill switch
      description: |
        Deactivates the kill switch, allowing order submission to resume.
        Requires the shared API key.
      responses:
        "200":
          description: Kill switch deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: deactivated }
                  timestamp: { type: string, format: date-time }

  /operational/kill-switch/cancel-all:
    post:
      tags: [Operational Hardening]
      summary: Cancel all orders
      description: |
        Cancels all open orders across all symbols without activating the
        kill switch. Requires the shared API key.
      responses:
        "200":
          description: Orders cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: cancelled }
                  orders_cancelled: { type: integer }
                  timestamp: { type: string, format: date-time }

  /operational/kill-switch/close-all:
    post:
      tags: [Operational Hardening]
      summary: Close all positions
      description: |
        Closes all open positions via market orders. Optionally activates
        kill switch first. Requires the shared API key.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                activate_kill_switch:
                  type: boolean
                  default: true
                  description: Also activate kill switch after closing
      responses:
        "200":
          description: Positions closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: closed }
                  positions_closed: { type: integer }
                  kill_switch_activated: { type: boolean }
                  timestamp: { type: string, format: date-time }

  /operational/executor/status:
    get:
      tags: [Operational Hardening]
      summary: Executor status
      description: |
        Returns the current status of the order executor, including
        connectivity, queue depth, and execution statistics.
      responses:
        "200":
          description: Executor status
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  mode: { type: string, enum: [simulation, paper, live] }
                  pending_orders: { type: integer }
                  total_executed: { type: integer }
                  last_execution_at: { type: string, format: date-time, nullable: true }
                  latency_ms: { type: number, nullable: true }

  /operational/throttle/status:
    get:
      tags: [Operational Hardening]
      summary: Throttle status
      description: |
        Returns the current rate-limiting throttle status, including
        limits, current usage, and cooldown state.
      responses:
        "200":
          description: Throttle status
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_orders_per_minute: { type: integer }
                  current_minute_count: { type: integer }
                  max_orders_per_hour: { type: integer }
                  current_hour_count: { type: integer }
                  throttled: { type: boolean }
                  cooldown_until: { type: string, format: date-time, nullable: true }

  /operational/audit-log:
    get:
      tags: [Operational Hardening]
      summary: Audit log
      description: |
        Returns the operational audit log with paginated entries covering
        mode changes, kill switch activations, order events, and reconciliation.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 50 }
        - name: event_type
          in: query
          schema: { type: string }
          description: Filter by event type
      responses:
        "200":
          description: Paginated audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        event_type: { type: string }
                        actor: { type: string }
                        details: { type: object }
                        timestamp: { type: string, format: date-time }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer }

  /operational/audit-log/summary:
    get:
      tags: [Operational Hardening]
      summary: Audit summary
      description: |
        Returns a summary of audit events grouped by type and time period.
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 24 }
          description: Lookback period in hours
      responses:
        "200":
          description: Audit summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events: { type: integer }
                  by_type:
                    type: object
                    additionalProperties: { type: integer }
                  by_severity:
                    type: object
                    additionalProperties: { type: integer }
                  period_hours: { type: integer }

  /operational/audit-log/export:
    get:
      tags: [Operational Hardening]
      summary: Export audit log
      description: |
        Exports the full audit log as a downloadable file (JSON or CSV).
        Requires the shared API key.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
          description: Export format
        - name: hours
          in: query
          schema: { type: integer, default: 168 }
          description: Lookback period in hours (default 7 days)
      responses:
        "200":
          description: Audit log export
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
            text/csv:
              schema:
                type: string
                description: CSV export of audit log entries

  /operational/reconcile/run:
    post:
      tags: [Operational Hardening]
      summary: Run reconciliation
      description: |
        Triggers a full position and order reconciliation against the
        execution venue. Compares local state with broker state.
        Requires the shared API key.
      responses:
        "200":
          description: Reconciliation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: running }
                  started_at: { type: string, format: date-time }
                  positions_checked: { type: integer }
                  orders_checked: { type: integer }

  /operational/reconcile/status:
    get:
      tags: [Operational Hardening]
      summary: Reconciliation status
      description: |
        Returns the status of the most recent reconciliation run, including
        any discrepancies found.
      responses:
        "200":
          description: Reconciliation status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [idle, running, completed, failed] }
                  last_run_at: { type: string, format: date-time, nullable: true }
                  discrepancies: { type: integer }
                  positions_reconciled: { type: integer }
                  orders_reconciled: { type: integer }

  /operational/reconcile/order:
    post:
      tags: [Operational Hardening]
      summary: Reconcile single order
      description: |
        Reconciles a single order against the execution venue. Returns
        the local and broker state for comparison.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: string
                  description: Order ID to reconcile
      responses:
        "200":
          description: Order reconciliation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: { type: string }
                  local_status: { type: string }
                  broker_status: { type: string }
                  match: { type: boolean }
                  discrepancy: { type: string, nullable: true }
        "404":
          $ref: '#/components/responses/NotFound'

  /operational/reconcile/positions:
    get:
      tags: [Operational Hardening]
      summary: Get reconciled positions
      description: |
        Returns the current reconciled position state, comparing local
        tracked positions with broker-reported positions.
      responses:
        "200":
          description: Reconciled positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  positions:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol: { type: string }
                        local_qty: { type: number }
                        broker_qty: { type: number }
                        discrepancy: { type: number }
                        last_reconciled: { type: string, format: date-time }
                  last_reconciled_at: { type: string, format: date-time, nullable: true }

  # ══════════════════════════════════════════════════════════════════════════
  #  PNL DASHBOARD
  # ══════════════════════════════════════════════════════════════════════════

  /pnl/history:
    get:
      tags: [PnL Dashboard]
      summary: PnL history
      description: |
        Returns historical PnL data with optional date range filtering.
        Includes realised and unrealised PnL per period.
      parameters:
        - name: start_date
          in: query
          schema: { type: string, format: date }
          description: Start date for history
        - name: end_date
          in: query
          schema: { type: string, format: date }
          description: End date for history
        - name: symbol
          in: query
          schema: { type: string }
          description: Filter by symbol
      responses:
        "200":
          description: PnL history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    symbol: { type: string }
                    realised_pnl: { type: number }
                    unrealised_pnl: { type: number }
                    total_pnl: { type: number }
                    trades: { type: integer }

  /pnl/intraday:
    get:
      tags: [PnL Dashboard]
      summary: Intraday PnL
      description: |
        Returns intraday PnL data broken down by time period with
        running totals.
      parameters:
        - name: symbol
          in: query
          schema: { type: string }
          description: Filter by symbol
      responses:
        "200":
          description: Intraday PnL
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  realised_pnl: { type: number }
                  unrealised_pnl: { type: number }
                  total_pnl: { type: number }
                  open_positions:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol: { type: string }
                        side: { type: string }
                        qty: { type: number }
                        avg_entry: { type: number }
                        current_price: { type: number }
                        unrealised_pnl: { type: number }

  /pnl/export:
    get:
      tags: [PnL Dashboard]
      summary: Export PnL data
      description: |
        Exports PnL data as CSV or JSON for external analysis.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: json }
          description: Export format
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: PnL export
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
            text/csv:
              schema:
                type: string
                description: CSV export of PnL data

  /pnl/alerts:
    get:
      tags: [PnL Dashboard]
      summary: List PnL alerts
      description: |
        Returns all configured PnL threshold alerts.
      responses:
        "200":
          description: PnL alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    threshold_id: { type: string }
                    name: { type: string }
                    metric: { type: string, enum: [daily_pnl, drawdown, win_rate, sharpe] }
                    threshold: { type: number }
                    comparison: { type: string, enum: [gt, lt, gte, lte] }
                    enabled: { type: boolean }
                    last_triggered: { type: string, format: date-time, nullable: true }
    post:
      tags: [PnL Dashboard]
      summary: Create PnL alert
      description: |
        Creates a new PnL threshold alert. Triggers a notification when
        the specified metric crosses the threshold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, metric, threshold, comparison]
              properties:
                name:
                  type: string
                  description: Alert name
                metric:
                  type: string
                  enum: [daily_pnl, drawdown, win_rate, sharpe]
                  description: Metric to monitor
                threshold:
                  type: number
                  description: Threshold value
                comparison:
                  type: string
                  enum: [gt, lt, gte, lte]
                  description: Comparison operator
                enabled:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Alert created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: created }
                  threshold_id: { type: string }
        "422":
          $ref: '#/components/responses/ValidationError'

  /pnl/alerts/check:
    post:
      tags: [PnL Dashboard]
      summary: Check alert thresholds
      description: |
        Manually triggers a check of all enabled PnL alert thresholds
        against current values. Returns any alerts that are triggered.
      responses:
        "200":
          description: Alert check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked: { type: integer }
                  triggered:
                    type: array
                    items:
                      type: object
                      properties:
                        threshold_id: { type: string }
                        name: { type: string }
                        metric: { type: string }
                        current_value: { type: number }
                        threshold: { type: number }

  /pnl/alerts/{threshold_id}:
    delete:
      tags: [PnL Dashboard]
      summary: Delete PnL alert
      description: Deletes a PnL threshold alert by ID.
      parameters:
        - name: threshold_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Alert deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: deleted }
                  threshold_id: { type: string }
        "404":
          $ref: '#/components/responses/NotFound'

  # ── RISK DASHBOARD ─────────────────────────────────────────────────────────

  /risk/dashboard:
    get:
      tags: [Risk Analysis, PnL Dashboard]
      summary: Get risk dashboard summary
      description: |
        Returns a comprehensive risk dashboard summary including current
        portfolio risk metrics, position exposure, VaR limits, regime
        context, and active risk alerts.
      responses:
        "200":
          description: Risk dashboard summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  portfolio_var95: { type: number }
                  portfolio_cvar95: { type: number }
                  max_drawdown: { type: number }
                  total_exposure: { type: number }
                  regime_label: { type: string }
                  risk_multiplier: { type: number }
                  active_positions: { type: integer }
                  active_alerts:
                    type: array
                    items: { type: string }
                  daily_pnl: { type: number }
                  sharpe_ratio: { type: number }
                  timestamp: { type: string, format: date-time }

  # ── AUTH DEBUG ─────────────────────────────────────────────────────────────

  # ── SSE PNL STREAMING ─────────────────────────────────────────────────────

  /sse/pnl:
    get:
      tags: [Real-Time Streaming, PnL Dashboard]
      summary: SSE stream for PnL updates
      description: |
        Server-Sent Events stream that pushes PnL updates in real time.
        Emits events on trade closes, position mark-to-market changes,
        and threshold alert triggers.

        Connect with: `new EventSource('/sse/pnl')`
      responses:
        "200":
          description: SSE PnL event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each `data:` line is a JSON-serialised PnL update.
                  First event: `{"type": "connected", "scope": "pnl"}`

  /sse/pnl/status:
    get:
      tags: [Real-Time Streaming, PnL Dashboard]
      summary: SSE PnL status
      description: |
        Returns the current status of the PnL SSE stream, including
        connection count and last update timestamp.
      responses:
        "200":
          description: PnL SSE status
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  connections: { type: integer }
                  last_update: { type: string, format: date-time, nullable: true }
	                  last_pnl: { type: number, nullable: true }

  # ── CALIBRATION ───────────────────────────────────────────────────────────

  /calibration/log:
    post:
      tags: [Calibration]
      summary: Log a calibration record
      description: Record a trade outcome paired with its predicted P_win for calibration bias analysis.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, predicted_p_win, outcome, aggression]
              properties:
                symbol:             { type: string, description: Trading symbol (e.g. BTC, SPY) }
                predicted_p_win:    { type: number, minimum: 0, maximum: 1, description: Blended P_win at entry }
                outcome:            { type: string, enum: [win, loss] }
                aggression:         { type: string, enum: [passive, mid, aggressive] }
                actual_pnl:         { type: number, nullable: true }
                error_source:       { type: string, nullable: true }
                entry_price:        { type: number, nullable: true }
                exit_price:         { type: number, nullable: true }
                p_regime:           { type: number, nullable: true }
                p_imbalance:        { type: number, nullable: true }
                p_markov:           { type: number, nullable: true }
                p_timesfm:          { type: number, nullable: true }
      responses:
        "201":
          description: Calibration record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:           { type: string }
                  symbol:       { type: string }
                  outcome:      { type: string }
                  created_at:   { type: string, format: date-time }

  /calibration/bias/{symbol}:
    get:
      tags: [Calibration]
      summary: Get calibration bias for a symbol
      description: Computes avg(predicted_p_win) - actual_win_rate and labels CALIBRATED / OVERCONFIDENT / UNDERCONFIDENT.
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Calibration bias result
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:               { type: string }
                  avg_predicted_p_win:  { type: number }
                  actual_win_rate:      { type: number }
                  bias:                 { type: number }
                  n_records:            { type: integer }
                  status:               { type: string, enum: [CALIBRATED, OVERCONFIDENT, UNDERCONFIDENT, INSUFFICIENT_DATA] }

  /calibration/status:
    get:
      tags: [Calibration]
      summary: Get daily calibration status for all symbols
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Aggregated calibration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:               { type: string }
                        avg_predicted_p_win:  { type: number }
                        actual_win_rate:      { type: number }
                        bias:                 { type: number }
                        n_records:            { type: integer }
                        status:               { type: string, enum: [CALIBRATED, OVERCONFIDENT, UNDERCONFIDENT, INSUFFICIENT_DATA] }
                  total_symbols: { type: integer }

  # ── VENUE MANAGEMENT ─────────────────────────────────────────────────────

  /venue/list:
    get:
      tags: [Venue Management]
      summary: List all trading venues
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: List of configured venues
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      type: object
                      properties:
                        id:             { type: string }
                        name:           { type: string }
                        venue_type:     { type: string }
                        supports_stops: { type: boolean }
                        max_leverage:   { type: number }
                        is_active:      { type: boolean }
                  total: { type: integer }

  /venue/{venue_id}/snapshot:
    post:
      tags: [Venue Management]
      summary: Record an account snapshot
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: { type: string }
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equity]
              properties:
                equity:           { type: number }
                cash:             { type: number, nullable: true }
                margin_used:      { type: number, nullable: true }
                open_positions:   { type: integer, default: 0 }
                max_drawdown:     { type: number, nullable: true }
                unrealized_pnl:   { type: number, nullable: true }
      responses:
        "201":
          description: Snapshot recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:             { type: string }
                  venue_id:       { type: string }
                  equity:         { type: number }
                  cash:           { type: number, nullable: true }
                  open_positions: { type: integer }
                  snapshot_at:    { type: string, format: date-time }

  /venue/{venue_id}/snapshots:
    get:
      tags: [Venue Management]
      summary: Get snapshot history for a venue
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: { type: string }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Paginated snapshot history
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      type: object
                      properties:
                        id:             { type: string }
                        venue_id:       { type: string }
                        equity:         { type: number }
                        cash:           { type: number, nullable: true }
                        open_positions: { type: integer }
                        snapshot_at:    { type: string, format: date-time }
                  total:  { type: integer }
                  offset: { type: integer }
                  limit:  { type: integer }

  /venue/{venue_id}/status:
    get:
      tags: [Venue Management]
      summary: Get venue health and latest snapshot
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: { type: string }
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Venue health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  venue:
                    type: object
                    properties:
                      id:             { type: string }
                      name:           { type: string }
                      venue_type:     { type: string }
                      supports_stops: { type: boolean }
                      max_leverage:   { type: number }
                      is_active:      { type: boolean }
                  latest_snapshot:
                    type: object
                    nullable: true
                    properties:
                      id:             { type: string }
                      venue_id:       { type: string }
                      equity:         { type: number }
                      cash:           { type: number, nullable: true }
                      open_positions: { type: integer }
                      snapshot_at:    { type: string, format: date-time }
                  snapshot_count: { type: integer }

# ─────────────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Single shared-secret gatekeeping (2026-08-25). Every protected
        endpoint checks this header against the single configured
        API_KEY setting — no roles, no per-user identity.

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      properties:
                        loc:  { type: array }
                        msg:  { type: string }
                        type: { type: string }

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }

  schemas:

    # ══════════════════════════════════════════════════════════════════════════
    #  RENKO HFT PIPELINE SCHEMAS
    # ══════════════════════════════════════════════════════════════════════════

    TickInput:
      type: object
      required: [price]
      properties:
        price:
          type: number
          exclusiveMinimum: 0
          description: Latest trade price
        timestamp:
          type: number
          nullable: true
          description: Unix timestamp (auto-filled if omitted)
        symbol:
          type: string
          nullable: true
          description: Override symbol (defaults to query param)

    BatchTickInput:
      type: object
      required: [prices]
      properties:
        prices:
          type: array
          items: { type: number, exclusiveMinimum: 0 }
          description: Price series for batch processing
        timestamps:
          type: array
          items: { type: number }
          nullable: true
          description: Corresponding timestamps
        regimes:
          type: array
          items: { type: string }
          nullable: true
          description: Pre-computed regime labels for regime-gated backtests
        symbol:
          type: string
          nullable: true
          description: Override symbol (defaults to query param)

    SizingModelRequest:
      type: object
      description: Position sizing model configuration request
      properties:
        sizing_mode:
          type: string
          enum: [kelly, masaniello]
          default: kelly
          description: Position sizing model to use
        base_risk:
          type: number
          default: 0.005
          description: Base risk fraction per trade
        min_risk:
          type: number
          default: 0.0025
          description: Minimum risk fraction per trade
        max_risk:
          type: number
          default: 0.010
          description: Maximum risk fraction per trade
        min_prob:
          type: number
          default: 0.50
          description: Minimum win probability threshold for signal acceptance
        min_rr:
          type: number
          default: 2.50
          description: Minimum risk-reward ratio for signal acceptance
        max_drawdown:
          type: number
          default: 0.10
          description: Maximum allowed drawdown fraction (Masaniello mode)
        regime_floor:
          type: number
          default: 0.50
          description: Regime probability floor for position sizing (Masaniello mode)
        use_kelly_overlay:
          type: boolean
          default: false
          description: Whether to overlay Kelly criterion on Masaniello sizing
        batch_size:
          type: integer
          default: 5
          description: Number of trades per Masaniello batch
        target_wins:
          type: integer
          default: 3
          description: Target number of wins per Masaniello batch

    ConfigInput:
      type: object
      description: Pipeline configuration (resets the pipeline when applied)
      properties:
        brick_size:
          type: number
          default: 0.50
          description: Fixed brick size in dollars
        brick_size_mode:
          type: string
          enum: [fixed, atr, dynamic]
          default: fixed
          description: Brick size determination mode
        reversal_bricks:
          type: integer
          default: 2
          description: Bricks needed for reversal
        bull_trigger_n:
          type: integer
          default: 3
          description: N consecutive HH/HL for bull trigger
        bear_trigger_n:
          type: integer
          default: 3
          description: N consecutive LL/LH for bear trigger
        sl_bricks:
          type: integer
          default: 3
          description: Stop-loss in brick units
        tp_bricks:
          type: integer
          default: 5
          description: Take-profit in brick units
        trailing_stop:
          type: boolean
          default: true
          description: Enable trailing stop
        trail_after_bricks:
          type: integer
          default: 3
          description: Activate trail after N bricks profit
        trail_distance_bricks:
          type: integer
          default: 2
          description: Trail distance in bricks
        max_trades_per_session:
          type: integer
          default: 15
          description: Max trades per session
        max_daily_loss_bricks:
          type: number
          default: 10.0
          description: Max daily loss in bricks
        max_consecutive_losses:
          type: integer
          default: 3
          description: Pause after N consecutive losses
        cooldown_seconds:
          type: number
          default: 30.0
          description: Min seconds between trades
        regime_gate:
          type: boolean
          default: true
          description: Only trade with HMM regime alignment
        symbol:
          type: string
          default: SPY
          description: Trading symbol

    RegimeInput:
      type: object
      required: [regime]
      properties:
        regime:
          type: string
          description: Current regime name

    EquityInput:
      type: object
      required: [equity]
      properties:
        equity:
          type: number
          description: Current account equity

    RenkoBacktestRequest:
      type: object
      required: [prices]
      description: Full backtest request with Phase 2-7 parameters
      properties:
        prices:
          type: array
          items: { type: number, exclusiveMinimum: 0 }
          minItems: 50
          description: Historical price series
        timestamps:
          type: array
          items: { type: number }
          nullable: true
        regimes:
          type: array
          items: { type: string }
          nullable: true
        symbol:
          type: string
          nullable: true
        brick_size:
          type: number
          default: 0.50
        slippage_bps:
          type: number
          default: 2.0
          description: Slippage in basis points
        commission_bps:
          type: number
          default: 5.0
        spread_bps:
          type: number
          default: 1.0
        sl_bricks:
          type: integer
          default: 3
        tp_bricks:
          type: integer
          default: 5
        oco_priority:
          type: string
          enum: [sl_first, tp_first]
          default: sl_first
        market_impact_mode:
          type: string
          enum: [none, almgren_chriss]
          default: none
        adv_shares:
          type: number
          default: 10000000
        fill_probability_mode:
          type: string
          enum: [always_fill, realistic]
          default: always_fill
        borrow_rate_bps:
          type: number
          default: 50.0
        margin_rate_bps:
          type: number
          default: 150.0
        is_hard_to_borrow:
          type: boolean
          default: false
        dividend_yield_bps:
          type: number
          default: 200.0
        initial_capital:
          type: number
          default: 100000.0
        n_trials:
          type: integer
          default: 1
          description: Number of strategy trials (for Deflated Sharpe Ratio)
        confidence_level:
          type: number
          default: 0.95

    RenkoBacktestStreamRequest:
      type: object
      required: [prices]
      description: SSE streaming backtest request
      properties:
        prices:
          type: array
          items: { type: number, exclusiveMinimum: 0 }
        timestamps:
          type: array
          items: { type: number }
          nullable: true
        regimes:
          type: array
          items: { type: string }
          nullable: true
        symbol:
          type: string
          nullable: true
        chunk_size:
          type: integer
          default: 150
          description: Ticks per SSE chunk
        brick_size:
          type: number
          default: 0.50
        sl_bricks:
          type: integer
          default: 3
        tp_bricks:
          type: integer
          default: 5
        slippage_bps:
          type: number
          default: 2.0
        commission_bps:
          type: number
          default: 5.0
        spread_bps:
          type: number
          default: 1.0
        oco_priority:
          type: string
          default: sl_first
        market_impact_mode:
          type: string
          default: none
        adv_shares:
          type: number
          default: 10000000
        fill_probability_mode:
          type: string
          default: always_fill
        borrow_rate_bps:
          type: number
          default: 50.0
        margin_rate_bps:
          type: number
          default: 150.0

    RenkoOptimizationRequest:
      type: object
      required: [prices]
      description: Parameter sweep optimization with statistical rigor
      properties:
        prices:
          type: array
          items: { type: number, exclusiveMinimum: 0 }
        timestamps:
          type: array
          items: { type: number }
          nullable: true
        regimes:
          type: array
          items: { type: string }
          nullable: true
        symbol:
          type: string
          nullable: true
        brick_sizes:
          type: array
          items: { type: number }
          default: [0.25, 0.50, 1.00]
        sl_bricks_range:
          type: array
          items: { type: integer }
          default: [2, 3, 4]
        tp_bricks_range:
          type: array
          items: { type: integer }
          default: [4, 5, 6]
        slippage_bps:
          type: number
          default: 2.0
        commission_bps:
          type: number
          default: 5.0
        spread_bps:
          type: number
          default: 1.0
        market_impact_mode:
          type: string
          default: none
        adv_shares:
          type: number
          default: 10000000
        fill_probability_mode:
          type: string
          default: always_fill
        borrow_rate_bps:
          type: number
          default: 50.0
        margin_rate_bps:
          type: number
          default: 150.0
        confidence_level:
          type: number
          default: 0.95
        multiple_testing_alpha:
          type: number
          default: 0.05
          description: Alpha for multiple testing correction

    StatisticalRigorRequest:
      type: object
      required: [trade_pnls, observed_sharpe]
      description: Statistical rigor tests on trade results
      properties:
        trade_pnls:
          type: array
          items: { type: number }
          description: Trade P&L series
        observed_sharpe:
          type: number
          description: Observed Sharpe ratio
        n_trials:
          type: integer
          default: 1
        confidence_level:
          type: number
          default: 0.95
        strategy_returns:
          type: array
          items:
            type: array
            items: { type: number }
          nullable: true
        benchmark_returns:
          type: array
          items: { type: number }
          nullable: true

    ExecutionModelRequest:
      type: object
      required: [order_shares, avg_price]
      description: Execution modeling costs for a trade
      properties:
        order_shares:
          type: number
          description: Number of shares
        avg_price:
          type: number
          description: Average share price
        adv_shares:
          type: number
          default: 10000000
        sigma_daily:
          type: number
          default: 0.02
        order_type:
          type: string
          enum: [limit, market]
          default: limit
        distance_from_mid_pct:
          type: number
          default: 0.0
        position_notional:
          type: number
          default: 0.0
        holding_days:
          type: number
          default: 10.0
        direction:
          type: string
          enum: [long, short]
          default: long
        is_hard_to_borrow:
          type: boolean
          default: false
        borrow_rate_bps:
          type: number
          default: 50.0
        margin_rate_bps:
          type: number
          default: 150.0
        dividend_yield_bps:
          type: number
          default: 200.0

    # ══════════════════════════════════════════════════════════════════════════
    #  SHARED REGIME PLATFORM SCHEMAS
    # ══════════════════════════════════════════════════════════════════════════

    PricePayload:
      type: object
      required: [prices]
      properties:
        symbol:
          type: string
          default: UNKNOWN
          description: Ticker label
        prices:
          type: array
          items: { type: number, exclusiveMinimum: 0 }
          minItems: 81
          description: Ordered close price series. All values must be positive.

    # ── Batch requests ──────────────────────────────────────────────────────

    FullAnalysisRequest:
      allOf:
        - $ref: '#/components/schemas/PricePayload'
        - type: object
          properties:
            kelly_fraction:
              type: number
              minimum: 0.1
              maximum: 1.0
              default: 0.5
            target_vol:
              type: number
              exclusiveMinimum: 0
              maximum: 1.0
              default: 0.15
            base_risk_limit:
              type: number
              exclusiveMinimum: 0
              maximum: 0.5
              default: 0.02

    SizeRequest:
      allOf:
        - $ref: '#/components/schemas/PricePayload'
        - type: object
          properties:
            returns:
              type: array
              items: { type: number }
              nullable: true
              description: Explicit return series; overrides prices-derived returns.
            kelly_fraction:
              type: number
              minimum: 0.1
              maximum: 1.0
              default: 0.5
            target_vol:
              type: number
              exclusiveMinimum: 0
              maximum: 1.0
              default: 0.15
            use_regime:
              type: boolean
              default: true

    RiskRequest:
      allOf:
        - $ref: '#/components/schemas/SizeRequest'
        - type: object
          properties:
            base_risk_limit:
              type: number
              exclusiveMinimum: 0
              maximum: 0.5
              default: 0.02

    RiskAnalyzeRequest:
      allOf:
        - $ref: '#/components/schemas/PricePayload'
        - type: object
          properties:
            returns:
              type: array
              items: { type: number }
              nullable: true
              description: Explicit returns (optional)
            kelly_fraction:
              type: number
              minimum: 0.1
              maximum: 1.0
              default: 0.5
            target_vol:
              type: number
              exclusiveMinimum: 0
              maximum: 1.0
              default: 0.15
            use_regime:
              type: boolean
              default: true
            base_risk_limit:
              type: number
              exclusiveMinimum: 0
              maximum: 0.5
              default: 0.02
            n_hmm_states:
              type: integer
              minimum: 2
              maximum: 4
              default: 4
            stress_scenarios:
              type: boolean
              default: true
              description: Include stress test scenarios

    StrategySignalRequest:
      allOf:
        - $ref: '#/components/schemas/PricePayload'
        - type: object
          properties:
            kelly_fraction:
              type: number
              minimum: 0.1
              maximum: 1.0
              default: 0.5
            target_vol:
              type: number
              exclusiveMinimum: 0
              maximum: 1.0
              default: 0.15
            use_regime:
              type: boolean
              default: true
            base_risk_limit:
              type: number
              exclusiveMinimum: 0
              maximum: 0.5
              default: 0.02
            n_hmm_states:
              type: integer
              minimum: 2
              maximum: 4
              default: 4

    RegimeV2Request:
      allOf:
        - $ref: '#/components/schemas/PricePayload'
        - type: object
          properties:
            n_states:
              type: integer
              minimum: 2
              maximum: 4
              default: 4
              description: Number of HMM states per dimension
            n_iter:
              type: integer
              minimum: 10
              maximum: 500
              default: 100
              description: Maximum EM iterations

    BacktestRequest:
      allOf:
        - $ref: '#/components/schemas/PricePayload'
        - type: object
          properties:
            window:
              type: integer
              minimum: 81
              default: 200
              description: Trailing window for HMM fit
            refit_every:
              type: integer
              minimum: 10
              default: 50
              description: Refit HMM every N bars
            n_hmm_states:
              type: integer
              minimum: 2
              maximum: 4
              default: 4
            kelly_fraction:
              type: number
              minimum: 0.1
              maximum: 1.0
              default: 0.5
            target_vol:
              type: number
              exclusiveMinimum: 0
              maximum: 1.0
              default: 0.15
            base_risk_limit:
              type: number
              exclusiveMinimum: 0
              maximum: 0.5
              default: 0.02
            initial_equity:
              type: number
              exclusiveMinimum: 0
              default: 100000.0
            commission_bps:
              type: number
              minimum: 0
              maximum: 50.0
              default: 5.0
            slippage_bps:
              type: number
              minimum: 0
              maximum: 50.0
              default: 2.0
            max_position_pct:
              type: number
              exclusiveMinimum: 0
              maximum: 1.0
              default: 0.25
            risk_check:
              type: boolean
              default: true
            regime_gate:
              type: boolean
              default: true

    TDARequest:
      allOf:
        - $ref: '#/components/schemas/PricePayload'
        - type: object
          properties:
            embedding_dim:
              type: integer
              minimum: 2
              maximum: 10
              default: 3
              description: Takens embedding dimension
            embedding_delay:
              type: integer
              minimum: 1
              maximum: 5
              default: 1
              description: Time delay for embedding
            max_filtration:
              type: number
              exclusiveMinimum: 0
              maximum: 10.0
              default: 2.0
              description: Maximum filtration value (std units)
            n_filtration_steps:
              type: integer
              minimum: 5
              maximum: 100
              default: 20
              description: Filtration resolution
            anomaly_threshold:
              type: number
              exclusiveMinimum: 0
              maximum: 5.0
              default: 1.5
              description: Std deviations for anomaly detection
            baseline_prices:
              type: array
              items: { type: number, exclusiveMinimum: 0 }
              nullable: true
              description: Optional baseline price series for anomaly comparison

    ObservationRequest:
      allOf:
        - $ref: '#/components/schemas/PricePayload'
        - type: object
          required: [high, low]
          properties:
            high:
              type: array
              items: { type: number, exclusiveMinimum: 0 }
              minItems: 81
              description: Ordered high-price series (same length as prices)
            low:
              type: array
              items: { type: number, exclusiveMinimum: 0 }
              minItems: 81
              description: Ordered low-price series (same length as prices)
            window:
              type: integer
              minimum: 81
              default: 200
              description: Rolling window length for feature computation
            refit_every:
              type: integer
              minimum: 1
              default: 50
              description: HMM refit interval (bars)
            n_hmm_states:
              type: integer
              minimum: 2
              maximum: 8
              default: 4
              description: Number of HMM hidden states
            recommended_f:
              type: number
              minimum: 0
              maximum: 1.0
              default: 0.0
              description: Kelly fraction for Masaniello feature (idx 22)

    SimulateRequest:
      type: object
      required: [prices]
      properties:
        symbol:
          type: string
          default: UNKNOWN
        prices:
          type: array
          items: { type: number, exclusiveMinimum: 0 }
          minItems: 81
        horizon:
          type: integer
          minimum: 1
          maximum: 252
          default: 20
          description: Forward steps to simulate
        n_paths:
          type: integer
          minimum: 50
          maximum: 5000
          default: 500
          description: Monte Carlo paths
        seed:
          type: integer
          nullable: true
          default: 42
          description: Random seed for reproducibility
        current_price:
          type: number
          exclusiveMinimum: 0
          nullable: true
          description: Override starting price

    FeedConfig:
      type: object
      required: [source, symbols]
      properties:
        source:
          type: string
          enum: [alpaca, binance, ib]
          description: Data source
        symbols:
          type: array
          items: { type: string }
          minItems: 1
        bar_size:
          type: string
          default: "1Min"
          description: "Bar interval (Alpaca: '1Min', Binance: '1m', IB: '5 secs')"
        feed:
          type: string
          default: sip
          description: "Alpaca feed type: 'sip' or 'iex'"

    BenchmarkRequest:
      type: object
      properties:
        n_bars:
          type: integer
          minimum: 81
          maximum: 50000
          default: 500
        n_iterations:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        force_cpu:
          type: boolean
          default: false

    SeedRequest:
      type: object
      required: [symbol, prices]
      properties:
        symbol: { type: string }
        prices:
          type: array
          items: { type: number, exclusiveMinimum: 0 }
          minItems: 81
        window:
          type: integer
          minimum: 81
          maximum: 5000
          default: 500
        kelly_fraction:
          type: number
          minimum: 0.1
          maximum: 1.0
          default: 0.5
        target_vol:
          type: number
          exclusiveMinimum: 0
          maximum: 1.0
          default: 0.15
        base_risk_limit:
          type: number
          exclusiveMinimum: 0
          maximum: 0.5
          default: 0.02
        refit_every:
          type: integer
          minimum: 5
          maximum: 500
          default: 50

    TickIngest:
      type: object
      required: [symbol, price]
      properties:
        symbol: { type: string }
        price:  { type: number, exclusiveMinimum: 0 }
        ts:     { type: number, nullable: true, description: Unix timestamp }

    # ── Batch responses ─────────────────────────────────────────────────────

    RegimeResponse:
      type: object
      properties:
        symbol:          { type: string }
        vol_probs:
          type: object
          properties:
            low:    { type: number }
            medium: { type: number }
            high:   { type: number }
        trend_probs:
          type: object
          properties:
            bear:    { type: number }
            neutral: { type: number }
            bull:    { type: number }
        vol_state:       { type: string, enum: [low, med_low, med_high, high] }
        trend_state:     { type: string, enum: [strong_bear, bear, bull, strong_bull] }
        regime_label:    { type: string, example: low_vol_bull }
        confidence:      { type: number, minimum: 0, maximum: 1 }
        risk_multiplier: { type: number, minimum: 0.10, maximum: 1.75 }
        n_bars_fitted:   { type: integer }

    RegimeV2Response:
      allOf:
        - $ref: '#/components/schemas/RegimeResponse'
        - type: object
          properties:
            n_states:
              type: integer
              description: Number of HMM states per dimension
            transition_entropy:
              type: number
              description: Shannon entropy of the transition matrix (low = persistent regimes)
            regime_stability:
              type: number
              minimum: 0
              maximum: 1
              description: Fraction of last 20 bars in the same regime

    SizeResponse:
      type: object
      properties:
        symbol:            { type: string }
        full_kelly_f:      { type: number }
        fractional_f:      { type: number }
        vol_scaled_f:      { type: number }
        regime_gated_f:    { type: number }
        recommended_f:     { type: number, minimum: 0, maximum: 1 }
        kelly_edge:        { type: number }
        sharpe_ratio:      { type: number }
        regime_label:      { type: string }
        regime_multiplier: { type: number }
        fraction_type:     { type: string, example: "50% Kelly" }
        notes:
          type: array
          items: { type: string }

    RiskResponse:
      type: object
      properties:
        symbol:           { type: string }
        recommended_f:    { type: number }
        var_95:           { type: number }
        var_99:           { type: number }
        cvar_95:          { type: number }
        cvar_99:          { type: number }
        max_drawdown:     { type: number }
        annual_vol:       { type: number }
        annual_return:    { type: number }
        calmar_ratio:     { type: number }
        sortino_ratio:    { type: number }
        regime_label:     { type: string }
        regime_max_loss:  { type: number }
        suggested_stop:   { type: number }
        suggested_tp:     { type: number }
        risk_budget_used: { type: number }
        notes:
          type: array
          items: { type: string }

    RiskAnalyzeResponse:
      allOf:
        - $ref: '#/components/schemas/RiskResponse'
        - type: object
          properties:
            risk_multiplier:
              type: number
              description: Regime risk multiplier
            stress_tests:
              type: array
              items: { $ref: '#/components/schemas/StressTestResult' }

    StressTestResult:
      type: object
      properties:
        scenario:          { type: string, example: 2008_crash }
        description:       { type: string }
        simulated_return:  { type: number }
        simulated_var_95:  { type: number }
        simulated_max_dd:  { type: number }

    FullAnalysisResponse:
      type: object
      properties:
        symbol:  { type: string }
        regime:  { $ref: '#/components/schemas/RegimeResponse' }
        sizing:  { $ref: '#/components/schemas/SizeResponse' }
        risk:    { $ref: '#/components/schemas/RiskResponse' }

    StrategySignalResponse:
      type: object
      properties:
        symbol:           { type: string }
        signal:           { type: string, enum: [long, short, flat] }
        signal_strength:  { type: number, minimum: 0, maximum: 1 }
        confidence:       { type: number, minimum: 0, maximum: 1 }
        regime_label:     { type: string }
        vol_state:        { type: string }
        trend_state:      { type: string }
        risk_multiplier:  { type: number }
        recommended_f:    { type: number }
        full_kelly_f:     { type: number }
        fractional_f:     { type: number }
        vol_scaled_f:     { type: number }
        regime_gated_f:   { type: number }
        sharpe_ratio:     { type: number }
        suggested_stop:   { type: number }
        suggested_tp:     { type: number }
        var_95:           { type: number }
        cvar_95:          { type: number }
        notes:
          type: array
          items: { type: string }

    BacktestResponse:
      type: object
      properties:
        symbol:                   { type: string }
        n_bars:                   { type: integer }
        n_trades:                 { type: integer }
        n_wins:                   { type: integer }
        n_losses:                 { type: integer }
        win_rate:                 { type: number }
        total_return:             { type: number }
        annual_return:            { type: number }
        buy_hold_return:          { type: number }
        excess_return:            { type: number }
        monthly_return_avg:       { type: number }
        max_drawdown:             { type: number }
        max_drawdown_duration:    { type: integer }
        avg_drawdown:             { type: number }
        var_95:                   { type: number }
        cvar_95:                  { type: number }
        annual_vol:               { type: number }
        downside_vol:             { type: number }
        sharpe_ratio:             { type: number }
        sortino_ratio:            { type: number }
        calmar_ratio:             { type: number }
        information_ratio:        { type: number }
        avg_win_pct:              { type: number }
        avg_loss_pct:             { type: number }
        avg_win_loss_ratio:       { type: number }
        max_consecutive_wins:     { type: integer }
        max_consecutive_losses:   { type: integer }
        avg_hold_bars:            { type: number }
        profit_factor:            { type: number }
        regime_distribution:      { type: object }
        trades_by_regime:         { type: object }
        equity_curve:
          type: array
          items: { type: number }
        drawdown_curve:
          type: array
          items: { type: number }
        trade_log:
          type: array
          items: { type: object }

    TDAResponse:
      type: object
      properties:
        symbol:                      { type: string }
        n_bars:                      { type: integer }
        n_components:                { type: integer }
        n_loops:                     { type: integer }
        max_persistence_0d:          { type: number }
        mean_persistence_0d:         { type: number }
        max_persistence_1d:          { type: number }
        mean_persistence_1d:         { type: number }
        persistence_entropy_0d:      { type: number }
        persistence_entropy_1d:      { type: number }
        total_persistence_entropy:   { type: number }
        anomaly_score:               { type: number }
        regime_change_probability:   { type: number }
        feature_vector:
          type: array
          items: { type: number }
          description: 10-dim TDA feature vector for ML pipeline
        feature_labels:
          type: array
          items: { type: string }
        betti_0:
          type: array
          items: { type: integer }
          description: Betti-0 numbers at each filtration step
        betti_1:
          type: array
          items: { type: integer }
          description: Betti-1 numbers at each filtration step

    ObservationResponse:
      type: object
      properties:
        symbol:
          type: string
        observation_vector:
          type: array
          items: { type: number }
          minItems: 24
          maxItems: 24
          description: Full 24-feature observation vector
        feature_labels:
          type: array
          items: { type: string }
          minItems: 24
          maxItems: 24
        vol_probs:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          description: "4-state vol posteriors: [low, med_low, med_high, high]"
        trend_probs:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          description: "4-state trend posteriors: [strong_bear, bear, bull, strong_bull]"
        regime_label:     { type: string }
        confidence:       { type: number, minimum: 0, maximum: 1 }
        bar_index:        { type: integer }
        is_markov_uniform: { type: boolean, description: True if Markov features (14-19) appear suspiciously uniform }
        n_bars_fitted:    { type: integer }

    SimulateResponse:
      type: object
      properties:
        symbol:               { type: string }
        horizon:              { type: integer }
        n_paths:              { type: integer }
        current_regime:       { type: string }
        current_price:        { type: number }
        price_p5:
          type: array
          items: { type: number }
          description: Price percentile 5 at each forward step
        price_p25:
          type: array
          items: { type: number }
        price_median:
          type: array
          items: { type: number }
        price_p75:
          type: array
          items: { type: number }
        price_p95:
          type: array
          items: { type: number }
        expected_risk_mult:
          type: array
          items: { type: number }
          description: Expected risk multiplier per step
        return_mean:           { type: number }
        return_std:            { type: number }
        return_var95:          { type: number }
        return_cvar95:         { type: number }
        terminal_regime_mode:  { type: string }
        pct_paths_positive:    { type: number }
        max_drawdown_mean:     { type: number }
        step_dominant_regime:
          type: array
          items: { type: string }
          description: Most likely regime at each forward step

    PortfolioResponse:
      type: object
      properties:
        n_symbols:               { type: integer }
        symbols:
          type: array
          items: { $ref: '#/components/schemas/SymbolSummaryResponse' }
        regime_counts:           { type: object, additionalProperties: { type: integer } }
        dominant_regime:         { type: string }
        regime_consensus:        { type: number }
        avg_risk_multiplier:     { type: number }
        avg_recommended_f:       { type: number }
        avg_sharpe:              { type: number }
        portfolio_var95:         { type: number }
        portfolio_cvar95:        { type: number }
        high_risk_count:         { type: integer }
        concentration_flag:      { type: boolean }
        regime_divergence_flag:  { type: boolean }
        active_alerts:
          type: array
          items: { type: string }

    SymbolSummaryResponse:
      type: object
      properties:
        symbol:          { type: string }
        regime_label:    { type: string }
        vol_state:       { type: string }
        trend_state:     { type: string }
        confidence:      { type: number }
        risk_multiplier: { type: number }
        recommended_f:   { type: number }
        var_95:          { type: number }
        cvar_95:         { type: number }
        sharpe_ratio:    { type: number }
        last_price:      { type: number, nullable: true }
        n_bars:          { type: integer }
        ready:           { type: boolean }

    FeedStatusResponse:
      type: object
      properties:
        running:    { type: boolean }
        adapters:
          type: array
          items: { type: object }
        total_bars:
          type: object
          additionalProperties: { type: integer }

    GpuCapabilitiesResponse:
      type: object
      properties:
        hmm_backend:          { type: string }
        active_device:        { type: string, enum: [cuda, mps, cpu] }
        pomegranate_installed: { type: boolean }
        cuda_available:       { type: boolean }
        mps_available:        { type: boolean }

    BenchmarkResult:
      type: object
      properties:
        backend:               { type: string }
        device:                { type: string }
        n_bars:                { type: integer }
        n_iterations:          { type: integer }
        mean_fit_ms:           { type: number }
        mean_predict_ms:       { type: number }
        regime_label:          { type: string }
        pomegranate_available: { type: boolean }
        cuda_available:        { type: boolean }
        mps_available:         { type: boolean }

    # ── Streaming responses ─────────────────────────────────────────────────

    TickResponse:
      type: object
      properties:
        symbol:           { type: string }
        ts:               { type: number }
        price:            { type: number }
        n_bars:           { type: integer }
        regime_label:     { type: string }
        vol_state:        { type: string, enum: [low, med_low, med_high, high] }
        trend_state:      { type: string, enum: [strong_bear, bear, bull, strong_bull] }
        vol_probs:
          type: object
          properties:
            low:    { type: number }
            medium: { type: number }
            high:   { type: number }
        trend_probs:
          type: object
          properties:
            bear:    { type: number }
            neutral: { type: number }
            bull:    { type: number }
        confidence:       { type: number }
        risk_multiplier:  { type: number }
        recommended_f:    { type: number }
        sharpe_ratio:     { type: number }
        var_95:           { type: number }
        cvar_95:          { type: number }
        suggested_stop:   { type: number }
        suggested_tp:     { type: number }
        regime_changed:   { type: boolean }
        alert:            { type: string, nullable: true }
        refit_count:      { type: integer }

    BufferingStub:
      type: object
      properties:
        status:  { type: string, example: buffering }
        n_bars:  { type: integer }

    SessionStatus:
      type: object
      properties:
        symbol:       { type: string }
        ready:        { type: boolean }
        n_bars:       { type: integer }
        refit_count:  { type: integer }
        tick_count:   { type: integer }
        last_regime:  { type: string }

    SessionStats:
      type: object
      properties:
        ready:        { type: boolean }
        n_bars:       { type: integer }
        refit_count:  { type: integer }
        tick_count:   { type: integer }
        last_regime:  { type: string }

    RegimeAlert:
      type: object
      properties:
        type:      { type: string, example: alert }
        symbol:    { type: string }
        ts:        { type: number }
        previous:  { type: string }
        current:   { type: string }
        severity:  { type: string, enum: [info, warning, critical] }
        message:   { type: string }

    WsMessage:
      type: object
      required: [type, symbol]
      properties:
        type:
          type: string
          enum: [seed, tick, subscribe, ping]
        symbol:  { type: string }
        price:   { type: number, nullable: true }
        prices:
          type: array
          items: { type: number }
          nullable: true
        ts:      { type: number, nullable: true }

    Observation:
      type: object
      description: 24-feature observation vector from InferenceObservationBuilder
      properties:
        vector:
          type: array
          items: { type: number }
          minItems: 24
          maxItems: 24
          description: |
            Full 24-feature observation. Index reference:
            0=log_ret_1bar, 1=log_ret_3bar, 2=log_ret_10bar,
            3=norm_atr, 4=rolling_vol_20, 5=ema_distance,
            6=hhll_score, 7=vol_regime_pct, 8=atr_vs_baseline, 9=vol_slope,
            10-13=regime_prob_{0..3}, 14=vol_prob_low, 15=vol_prob_medium,
            16=vol_prob_high, 17=trend_prob_down, 18=trend_prob_neutral,
            19=trend_prob_up, 20=regime_quality, 21=state_confidence,
            22=masaniello_pressure, 23=drawdown_factor
        vol_probs:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          description: "4-state vol posteriors: [low, med_low, med_high, high]"
        trend_probs:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          description: "4-state trend posteriors: [strong_bear, bear, bull, strong_bull]"
        regime_label:     { type: string }
        confidence:       { type: number, minimum: 0, maximum: 1 }
        bar_index:        { type: integer }
        is_markov_uniform: { type: boolean, description: true if Markov features appear uniform (bug indicator) }

    FeatureIndex:
      type: object
      description: Feature index constants (F namespace)
      properties:
        LOG_RET_1:          { type: integer, example: 0 }
        LOG_RET_3:          { type: integer, example: 1 }
        LOG_RET_10:         { type: integer, example: 2 }
        NORMALISED_ATR:     { type: integer, example: 3 }
        ROLLING_VOL_20:     { type: integer, example: 4 }
        EMA_DISTANCE:       { type: integer, example: 5 }
