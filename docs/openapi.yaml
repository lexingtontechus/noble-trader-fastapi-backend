          exclusiveMinimum: 0.0
          title: Max Daily Loss Bricks
          description: Max daily loss in bricks.
          default: 10.0
        max_consecutive_losses:
          type: integer
          minimum: 1.0
          title: Max Consecutive Losses
          description: Pause after N consecutive losses.
          default: 3
        cooldown_seconds:
          type: number
          minimum: 0.0
          title: Cooldown Seconds
          description: Min seconds between trades.
          default: 30.0
