          application/json:
            schema: { $ref: '#/components/schemas/SizeRequest' }
      responses:
        "200":
          description: Kelly sizing result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SizeResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  /risk/analyse:
    post:
      tags: [Risk Analysis]
      summary: Full risk decomposition — VaR, CVaR, drawdown, stop/TP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RiskRequest' }
      responses:
        "200":
          description: Risk analysis result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  # ── SIMULATION ──────────────────────────────────────────────────────────

  /simulate/{symbol}:
    post:
      tags: [Simulation]
      summary: Simulate regime transition paths forward in time
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                symbol: { type: string, default: UNKNOWN }
                prices: { type: array, items: { type: number }, minItems: 81 }
                horizon: { type: integer, default: 20, minimum: 1, maximum: 252 }
                n_paths: { type: integer, default: 500, minimum: 50, maximum: 5000 }
                seed: { type: integer, default: 42 }
      responses:
        "200":
          description: Simulation results
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "422":
          $ref: '#/components/responses/ValidationError'

