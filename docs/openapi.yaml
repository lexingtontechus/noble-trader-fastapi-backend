  /renko/backtest/run:
    post:
      tags:
      - renko
      summary: Run a full Renko pipeline backtest (isolated from live pipeline)
      description: 'Run a complete backtest on historical prices using an isolated
        RenkoPipeline

        instance (never affects the live pipeline).


        Pipeline flow: Tick → Brick Engine → Swing Classifier → Pattern Detector →

        Signal Filter → Risk Manager → Executor → Trade Journal


        Results are cached in Redis (1h TTL) for identical configs — repeated

        requests with the same parameters return instantly from cache.

        The response includes a `cached` field indicating cache HIT/MISS.


        Returns comprehensive stats including win rate, profit factor, Sharpe estimate,

        max drawdown, per-pattern breakdowns, per-regime breakdowns, and Kelly inputs.'
      operationId: run_renko_backtest_renko_backtest_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenkoBacktestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenkoBacktestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /renko/backtest/run/stream:
    post:
      tags:
      - renko
      summary: Stream a Renko backtest with progressive chunked results (SSE)
      description: "Run a Renko backtest and stream results progressively via Server-Sent\
        \ Events.\n\nThe pipeline processes prices in chunks of 150 ticks. After each\
        \ chunk,\nan SSE event is emitted with partial results (trades so far, running\
        \ stats,\nbricks/ticks processed). The frontend can render a growing equity\
        \ curve\nand live-updating statistics.\n\nEvent types:\n  - ``progress``:\
        \ Intermediate chunk result (partial trades, stats, percent)\n  - ``complete``:\
        \ Final result (identical to /backtest/run response)\n  - ``error``: Pipeline\
        \ error (if any)\n\nThe final complete result is also cached in Redis (1h\
        \ TTL), so a subsequent\nnon-streaming request for the same config returns\
        \ instantly from cache."
      operationId: run_renko_backtest_stream_renko_backtest_run_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenkoBacktestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /renko/backtest/compare:
    post:
      tags:
      - renko
      summary: Compare multiple Renko pipeline configs side-by-side
      description: 'Run multiple Renko pipeline configurations on the same price data

        and return side-by-side results with a diff summary.


        Each config gets its own isolated pipeline instance. The diff

        highlights key metric differences between the first config and

        the best (by Sharpe estimate).


        Results are cached in Redis (1h TTL) for identical compare requests.'
      operationId: compare_renko_backtests_renko_backtest_compare_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenkoBacktestCompareRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenkoBacktestCompareResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /renko/backtest/optimize:
    post:
      tags:
      - renko
      summary: 'Parameter sweep: run Renko backtests across a grid of parameter values'
      description: 'Grid-search parameter sweep for Renko pipeline optimization.


        Accepts a param_grid dict mapping parameter names to lists of values.

        For each combination, runs a full isolated Renko backtest and returns

        a summary row with key metrics. Useful for finding optimal Renko

        strategy parameters without manual trial-and-error.


        Results are cached in Redis (1h TTL) for identical optimize requests.


        **Warning**: The number of combinations is the product of all grid

        values. Keep grids small (max 50 combinations) to avoid timeouts.'
      operationId: optimize_renko_backtest_renko_backtest_optimize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenkoBacktestOptimizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenkoBacktestOptimizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /renko/backtest/walk-forward:
    post:
      tags:
      - renko
      summary: Walk-forward out-of-sample validation
      description: 'Walk-forward out-of-sample validation.


        Splits the price series into rolling in-sample (training) and

        out-of-sample (test) windows. For each window, runs the backtest

        on both segments and reports separate statistics. The degradation

        ratio (OOS/IS return) is the key metric — below 0.5 suggests

        severe overfitting.


        Results are cached in Redis (1h TTL) for identical requests.'
      operationId: walk_forward_renko_renko_backtest_walk_forward_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenkoWalkForwardRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenkoWalkForwardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /renko/backtest/monte-carlo:
    post:
      tags:
      - renko
      summary: Monte Carlo permutation test for strategy robustness
      description: "Monte Carlo permutation test.\n\nShuffles the trade P&L order\
        \ N times and computes equity curves\nfor each permutation. Returns confidence\
        \ bands (5th-95th percentile)\nand key probabilities:\n  - p_profitable: P(random\
        \ permutation is profitable)\n  - p_beat_original: P(random permutation >=\
        \ original P&L)\n\nIf the 5th-percentile equity curve is still profitable,\
        \ the\nstrategy is robust regardless of trade timing.\n\nResults are cached\
        \ in Redis (1h TTL) for identical requests."
      operationId: monte_carlo_renko_renko_backtest_monte_carlo_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenkoMonteCarloRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenkoMonteCarloResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
