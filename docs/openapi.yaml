components:
  schemas:
    AssetMasanielloResult:
      properties:
        symbol:
          type: string
          title: Symbol
        portfolio_weight:
          type: number
          title: Portfolio Weight
        capital_allocation:
          type: number
          title: Capital Allocation
          description: portfolio_weight × equity in $.
        allowed:
          type: boolean
          title: Allowed
        risk_fraction:
          type: number
          title: Risk Fraction
        risk_amount:
          type: number
          title: Risk Amount
        contracts:
          type: integer
          title: Contracts
        masaniello_factor:
          type: number
          title: Masaniello Factor
        quality_factor:
          type: number
          title: Quality Factor
        drawdown_factor:
          type: number
          title: Drawdown Factor
        volatility_factor:
          type: number
          title: Volatility Factor
        expected_edge:
          type: number
          title: Expected Edge
        reason:
          type: string
          title: Reason
        regime_label:
          type: string
          title: Regime Label
          default: ''
      type: object
      required:
      - symbol
      - portfolio_weight
      - capital_allocation
      - allowed
      - risk_fraction
      - risk_amount
      - contracts
      - masaniello_factor
      - quality_factor
      - drawdown_factor
      - volatility_factor
      - expected_edge
      - reason
      title: AssetMasanielloResult
      description: Masaniello sizing result for a single asset within a portfolio.
    BacktestCompareRequest:
      properties:
        ids:
          items:
            type: string
          type: array
          maxItems: 10
          minItems: 2
          title: Ids
          description: Backtest IDs to compare.
      type: object
      required:
      - ids
      title: BacktestCompareRequest
      description: Request to compare two or more saved backtests.
    BacktestCompareResponse:
      properties:
        comparisons:
          items:
            $ref: '#/components/schemas/BacktestResponse'
          type: array
          title: Comparisons
        diff:
          additionalProperties: true
          type: object
          title: Diff
          description: Key metric differences between first and best result.
      type: object
      required:
      - comparisons
      title: BacktestCompareResponse
      description: Side-by-side comparison of backtest results.
    BacktestExportRequest:
      properties:
        id:
          type: string
          title: Id
          description: Backtest result ID to export.
        format:
          type: string
          enum:
          - csv
          - json
          title: Format
          description: Export format.
          default: json
        sections:
          items:
            type: string
            enum:
            - summary
            - equity_curve
            - drawdown_curve
            - trade_log
            - all
          type: array
          title: Sections
          description: Which sections to include in the export.
          default:
          - all
      type: object
      required:
      - id
      title: BacktestExportRequest
      description: Request to export a saved backtest result as CSV or JSON.
    BacktestHistoryResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/BacktestSummary'
          type: array
          title: Results
        total:
          type: integer
          title: Total
        offset:
          type: integer
          title: Offset
        limit:
          type: integer
          title: Limit
      type: object
      required:
      - results
      - total
      - offset
      - limit
      title: BacktestHistoryResponse
      description: Paginated list of saved backtest summaries.
    BacktestOptimizeRequest:
      properties:
        prices:
          items:
            type: number
          type: array
          maxItems: 5000
          minItems: 81
          title: Prices
          description: Ordered price series (OHLCV close preferred). Min 81, max 5000
            bars.
        symbol:
          type: string
          title: Symbol
          description: Ticker symbol for labelling.
          default: UNKNOWN
        param_grid:
          additionalProperties:
            items: {}
            type: array
          type: object
          title: Param Grid
          description: 'Map of parameter name to list of values to sweep. Supported
            keys: window, refit_every, n_hmm_states, kelly_fraction, target_vol, base_risk_limit,
            commission_bps, slippage_bps, max_position_pct, risk_check, regime_gate.'
        window:
          type: integer
          minimum: 81.0
          title: Window
          default: 200
        refit_every:
          type: integer
          minimum: 10.0
          title: Refit Every
          default: 50
        n_hmm_states:
          type: integer
          maximum: 4.0
          minimum: 2.0
          title: N Hmm States
          default: 4
        kelly_fraction:
          type: number
