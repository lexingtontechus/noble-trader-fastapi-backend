      - APIKeyHeader: []
  /optimise/masaniello:
    post:
      tags:
      - Multi-Asset
      summary: 'Two-stage pipeline: portfolio optimisation + per-asset Masaniello
        sizing'
      description: "Full two-stage pipeline in one request:\n\n**Stage 1** — DrawdownOptimiser:\n\
        Solves a regime-adjusted max-Sharpe portfolio with drawdown constraint.\n\
        Produces per-asset portfolio weights (capital allocation).\n\n**Stage 2**\
        \ — Dynamic Masaniello Sizer:\nSizes each asset's position within its allocated\
        \ capital using:\n  f_i = β × (0.5 + M_i) × Q_i × DD_i × V_i\n\nWhere:\n-\
        \ M_i = urgency (wins needed / trades remaining)\n- Q_i = quality (prob ×\
        \ regime × confidence)\n- DD_i = drawdown scaling (floor 0.25)\n- V_i = volatility\
        \ adjustment (ATR-based)\n\nThe optimiser says \"what to hold\"; Masaniello\
        \ says \"how much\"."
      operationId: optimise_with_masaniello_optimise_masaniello_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioMasanielloRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioMasanielloResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
