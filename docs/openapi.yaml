          type: boolean
          title: Regime Gate
          description: Only trade with HMM regime alignment.
          default: true
        slippage_bps:
          type: number
          minimum: 0.0
          title: Slippage Bps
          description: Slippage in basis points (adverse fill).
          default: 2.0
        commission_bps:
          type: number
          minimum: 0.0
          title: Commission Bps
          description: Commission in basis points of position value.
          default: 5.0
        spread_bps:
