      summary: Build enhanced 24+ feature observation vector with optional TDA features
      description: "Enhanced observation builder (v2):\n1. Builds the standard 24-feature\
        \ observation vector (same as /build)\n2. Optionally appends 10 TDA (Topological\
        \ Data Analysis) features:\n   - n_components, n_loops\n   - max/mean persistence\
        \ (0d, 1d)\n   - persistence entropy (0d, 1d)\n   - anomaly score, regime\
        \ change probability\n3. When include_tda=True, the vector extends to 34 features\
        \ (24 + 10)\n\nTDA features capture topological structure of the price series:\n\
        - Connected components (0-dim persistence) → market fragmentation\n- Loops\
        \ (1-dim persistence) → cyclical patterns\n- Anomaly score → topology deviation\
        \ from baseline\n- Regime change probability → early warning of regime transitions"
      operationId: build_observation_v2_observation_build_v2_post
      requestBody:
