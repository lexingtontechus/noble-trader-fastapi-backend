openapi: "3.1.0"

info:
  title: Noble Trader Dynamic Regime Risk Management Platform
  version: "5.0.0"
  description: |
    A production-grade FastAPI service for quantitative trading risk management.
    Detects market regimes with Hidden Markov Models, gates position sizes via
    the Kelly Criterion, computes real-time VaR/CVaR, and streams live regime
    snapshots and alerts over WebSocket and SSE.

    ## Authentication
    All protected endpoints require authentication via one of:
    - **Clerk JWT** (primary) — Bearer token issued by Clerk
    - **Local JWT** — Bearer token issued by `/auth/token`
    - **API Key** — via `X-API-Key` header

    Auth levels: `any` (viewer+), `write` (trader+), `admin` (admin only).
  contact:
    name: Noble Trader
    email: nobletrader@0xdweb.com
  license:
    name: MIT

servers:
  - url: https://noble-trader-fastapi-backend.onrender.com
    description: Production (Render)
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Health
    description: Service health and status
  - name: Auth
    description: Authentication — JWT + Clerk + API key
  - name: Full Pipeline
    description: One-shot batch analysis
  - name: Regime Detection
    description: HMM-based regime classification
  - name: Position Sizing
    description: Kelly Criterion position sizing
  - name: Risk Analysis
    description: VaR, CVaR, drawdown, stop/TP
  - name: Renko HFT
    description: 6-layer Renko HFT pipeline — bricks, signals, executions
  - name: Simulation
    description: Monte Carlo regime transition simulation
  - name: Portfolio
    description: Multi-symbol portfolio aggregation
  - name: Correlation
    description: DCC-based portfolio correlation regime
  - name: Optimisation
    description: Drawdown-controlled max-Sharpe optimisation
  - name: GPU HMM
    description: GPU-accelerated HMM capabilities
  - name: Feed Adapters
    description: Live OHLCV feed management (Alpaca, Binance, IB)
  - name: Live Stream
    description: REST tick ingestion and session management
  - name: Real-Time Streaming
    description: WebSocket and Server-Sent Events
  - name: Observation
    description: 24-feature observation vector building
  - name: Strategy
    description: Strategy signal generation
  - name: Backtest
    description: Backtesting engine
  - name: TDA
    description: Topological data analysis features

# ─────────────────────────────────────────────────────────────────────────────
# Security schemes
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Clerk JWT or local JWT token"
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Pre-shared API key"

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      properties:
                        loc:  { type: array }
                        msg:  { type: string }
                        type: { type: string }

    UnauthorizedError:
      description: Authentication required — provide Bearer token or X-API-Key
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string, example: "Not authenticated" }

    ForbiddenError:
      description: Insufficient permissions for this action
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string, example: "Admin access required" }

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }

  schemas:

    # ── Shared ─────────────────────────────────────────────────────────────

    PricePayload:
      type: object
      required: [prices]
      properties:
        symbol:
          type: string
          default: UNKNOWN
          description: Ticker label
        prices:
          type: array
          items: { type: number, exclusiveMinimum: 0 }
          minItems: 81
          description: Ordered close price series. All values must be positive.

    # ── Renko models ───────────────────────────────────────────────────────

    TickInput:
      type: object
      required: [price]
      properties:
        price:
          type: number
          description: Latest trade price
        timestamp:
          type: number
          nullable: true
          description: Unix timestamp
        symbol:
          type: string
          nullable: true
          description: Override symbol (defaults to SPY)

    BatchTickInput:
      type: object
      required: [prices]
      properties:
        prices:
          type: array
          items: { type: number }
          description: Price series
        timestamps:
          type: array
          items: { type: number }
          nullable: true
          description: Timestamps
        regimes:
          type: array
          items: { type: string }
          nullable: true
          description: Pre-computed regime labels
        symbol:
          type: string
          nullable: true
          description: Override symbol (defaults to query param)

    ConfigInput:
      type: object
      properties:
        brick_size:
          type: number
          default: 0.50
          description: Fixed brick size in dollars
        brick_size_mode:
          type: string
          default: fixed
          enum: [fixed, atr, dynamic]
          description: Brick size calculation mode
        reversal_bricks:
          type: integer
          default: 2
          description: Bricks needed for reversal
        bull_trigger_n:
          type: integer
          default: 3
          description: N consecutive HH/HL for bull trigger
        bear_trigger_n:
          type: integer
          default: 3
          description: N consecutive LL/LH for bear trigger
        sl_bricks:
          type: integer
          default: 3
          description: Stop-loss in brick units
        tp_bricks:
          type: integer
          default: 5
          description: Take-profit in brick units
        trailing_stop:
          type: boolean
          default: true
          description: Enable trailing stop
        trail_after_bricks:
          type: integer
          default: 3
          description: Activate trail after N bricks profit
        trail_distance_bricks:
          type: integer
          default: 2
          description: Trail distance in bricks
        max_trades_per_session:
          type: integer
          default: 15
          description: Max trades per session
        max_daily_loss_bricks:
          type: number
          default: 10.0
          description: Max daily loss in bricks
        max_consecutive_losses:
          type: integer
          default: 3
          description: Pause after N consecutive losses
        cooldown_seconds:
          type: number
          default: 30.0
          description: Min seconds between trades
        regime_gate:
          type: boolean
          default: true
          description: Only trade with HMM regime alignment
        symbol:
          type: string
          default: SPY
          description: Trading symbol

    RegimeInput:
      type: object
      required: [regime]
      properties:
        regime:
          type: string
          description: Current regime name

    EquityInput:
      type: object
      required: [equity]
      properties:
        equity:
          type: number
          description: Current account equity

    # ── Batch requests ──────────────────────────────────────────────────────

    FullAnalysisRequest:
      allOf:
        - $ref: '#/components/schemas/PricePayload'
        - type: object
          properties:
            kelly_fraction:
              type: number
              minimum: 0.1
              maximum: 1.0
              default: 0.5
            target_vol:
              type: number
              exclusiveMinimum: 0
              maximum: 1.0
              default: 0.15
            base_risk_limit:
              type: number
              exclusiveMinimum: 0
              maximum: 0.5
              default: 0.02

    SizeRequest:
      allOf:
        - $ref: '#/components/schemas/PricePayload'
        - type: object
          properties:
            returns:
              type: array
              items: { type: number }
              nullable: true
              description: Explicit return series; overrides prices-derived returns.
            kelly_fraction:
              type: number
              minimum: 0.1
              maximum: 1.0
              default: 0.5
            target_vol:
              type: number
              exclusiveMinimum: 0
              maximum: 1.0
              default: 0.15
            use_regime:
              type: boolean
              default: true

    RiskRequest:
      allOf:
        - $ref: '#/components/schemas/SizeRequest'
        - type: object
          properties:
            base_risk_limit:
              type: number
              exclusiveMinimum: 0
              maximum: 0.5
              default: 0.02

    # ── Batch responses ─────────────────────────────────────────────────────

    RegimeResponse:
      type: object
      properties:
        symbol:          { type: string }
        vol_probs:
          type: object
          properties:
            low:    { type: number }
            medium: { type: number }
            high:   { type: number }
        trend_probs:
          type: object
          properties:
            bear:    { type: number }
            neutral: { type: number }
            bull:    { type: number }
        vol_state:       { type: string, enum: [low, med_low, med_high, high] }
        trend_state:     { type: string, enum: [strong_bear, bear, bull, strong_bull] }
        regime_label:    { type: string, example: low_vol_bull }
        confidence:      { type: number, minimum: 0, maximum: 1 }
        risk_multiplier: { type: number, minimum: 0.10, maximum: 1.75 }
        n_bars_fitted:   { type: integer }

    SizeResponse:
      type: object
      properties:
        symbol:            { type: string }
        full_kelly_f:      { type: number }
        fractional_f:      { type: number }
        vol_scaled_f:      { type: number }
        regime_gated_f:    { type: number }
        recommended_f:     { type: number, minimum: 0, maximum: 1 }
        kelly_edge:        { type: number }
        sharpe_ratio:      { type: number }
        regime_label:      { type: string }
        regime_multiplier: { type: number }
        fraction_type:     { type: string, example: "50% Kelly" }
        notes:
          type: array
          items: { type: string }

    RiskResponse:
      type: object
      properties:
        symbol:           { type: string }
        recommended_f:    { type: number }
        var_95:           { type: number }
        var_99:           { type: number }
        cvar_95:          { type: number }
        cvar_99:          { type: number }
        max_drawdown:     { type: number }
        annual_vol:       { type: number }
        annual_return:    { type: number }
        calmar_ratio:     { type: number }
        sortino_ratio:    { type: number }
        regime_label:     { type: string }
        regime_max_loss:  { type: number }
        suggested_stop:   { type: number }
        suggested_tp:     { type: number }
        risk_budget_used: { type: number }
        notes:
          type: array
          items: { type: string }

    FullAnalysisResponse:
      type: object
      properties:
        symbol:  { type: string }
        regime:  { $ref: '#/components/schemas/RegimeResponse' }
        sizing:  { $ref: '#/components/schemas/SizeResponse' }
        risk:    { $ref: '#/components/schemas/RiskResponse' }

    # ── Streaming requests ──────────────────────────────────────────────────

    SeedRequest:
      type: object
      required: [symbol, prices]
      properties:
        symbol:           { type: string }
        prices:
          type: array
          items: { type: number, exclusiveMinimum: 0 }
          minItems: 81
        window:
          type: integer
          minimum: 51
          maximum: 5000
          default: 500
        kelly_fraction:
          type: number
          minimum: 0.1
          maximum: 1.0
          default: 0.5
        target_vol:
          type: number
          exclusiveMinimum: 0
          maximum: 1.0
          default: 0.15
        base_risk_limit:
          type: number
          exclusiveMinimum: 0
          maximum: 0.5
          default: 0.02
        refit_every:
          type: integer
          minimum: 5
          maximum: 500
          default: 50

    TickIngest:
      type: object
      required: [symbol, price]
      properties:
        symbol: { type: string }
        price:  { type: number, exclusiveMinimum: 0 }
        ts:     { type: number, nullable: true, description: Unix timestamp }

    # ── Streaming responses ─────────────────────────────────────────────────

    TickResponse:
      type: object
      properties:
        symbol:           { type: string }
        ts:               { type: number }
        price:            { type: number }
        n_bars:           { type: integer }
        regime_label:     { type: string }
        vol_state:        { type: string, enum: [low, med_low, med_high, high] }
        trend_state:      { type: string, enum: [strong_bear, bear, bull, strong_bull] }
        vol_probs:
          type: object
          properties:
            low:    { type: number }
            medium: { type: number }
            high:   { type: number }
        trend_probs:
          type: object
          properties:
            bear:    { type: number }
            neutral: { type: number }
            bull:    { type: number }
        confidence:       { type: number }
        risk_multiplier:  { type: number }
        recommended_f:    { type: number }
        sharpe_ratio:     { type: number }
        var_95:           { type: number }
        cvar_95:          { type: number }
        suggested_stop:   { type: number }
        suggested_tp:     { type: number }
        regime_changed:   { type: boolean }
        alert:            { type: string, nullable: true }
        refit_count:      { type: integer }

    BufferingStub:
      type: object
      properties:
        status:  { type: string, example: buffering }
        n_bars:  { type: integer }

    SessionStatus:
      type: object
      properties:
        symbol:       { type: string }
        ready:        { type: boolean }
        n_bars:       { type: integer }
        refit_count:  { type: integer }
        tick_count:   { type: integer }
        last_regime:  { type: string }

    SessionStats:
      type: object
      properties:
        ready:        { type: boolean }
        n_bars:       { type: integer }
        refit_count:  { type: integer }
        tick_count:   { type: integer }
        last_regime:  { type: string }

    RegimeAlert:
      type: object
      properties:
        type:      { type: string, example: alert }
        symbol:    { type: string }
        ts:        { type: number }
        previous:  { type: string }
        current:   { type: string }
        severity:  { type: string, enum: [info, warning, critical] }
        message:   { type: string }

    Observation:
      type: object
      description: 24-feature observation vector from InferenceObservationBuilder
      properties:
        vector:
          type: array
          items: { type: number }
          minItems: 24
          maxItems: 24
          description: |
            Full 24-feature observation. Index reference:
            0=log_ret_1bar, 1=log_ret_3bar, 2=log_ret_10bar,
            3=norm_atr, 4=rolling_vol_20, 5=ema_distance,
            6=hhll_score, 7=vol_regime_pct, 8=atr_vs_baseline, 9=vol_slope,
            10-13=regime_prob_{0..3}, 14=vol_prob_low, 15=vol_prob_medium,
            16=vol_prob_high, 17=trend_prob_down, 18=trend_prob_neutral,
            19=trend_prob_up, 20=regime_quality, 21=state_confidence,
            22=masaniello_pressure, 23=drawdown_factor

# ─────────────────────────────────────────────────────────────────────────────
paths:

  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: "5.0.0" }
                  redis: { type: boolean }
                  discord: { type: object }
                  gpu_backend: { type: string }
                  device: { type: string }

  # ── AUTH ────────────────────────────────────────────────────────────────

  /auth/token:
    post:
      tags: [Auth]
      summary: Issue a local JWT token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: JWT token issued
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Current user info
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /auth/clerk/me:
    get:
      tags: [Auth]
      summary: Get current Clerk-authenticated user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Clerk user info
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  # ── RENKO HFT PIPELINE ─────────────────────────────────────────────────

  /renko/tick:
    post:
      tags: [Renko HFT]
      summary: Process a single tick through the 6-layer Renko pipeline
      description: |
        Ingests a single price tick through the full pipeline:
        Brick Engine → Swing Classifier → Pattern Detector → Signal Filter →
        Order Executor → Risk Manager.

        **Auth**: Any authenticated user (viewer+)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TickInput' }
      responses:
        "200":
          description: Tick processing result
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /renko/tick/batch:
    post:
      tags: [Renko HFT]
      summary: Batch tick processing (backtest / warm-up)
      description: |
        Processes a batch of price ticks for backtesting or pipeline warm-up.

        **Auth**: Any authenticated user (viewer+)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchTickInput' }
      responses:
        "200":
          description: Batch processing result
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /renko/state:
    get:
      tags: [Renko HFT]
      summary: Get current pipeline state
      description: "**Auth**: Any authenticated user (viewer+)"
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Pipeline state snapshot
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /renko/stats:
    get:
      tags: [Renko HFT]
      summary: Get comprehensive pipeline statistics
      description: "**Auth**: Any authenticated user (viewer+)"
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Pipeline statistics
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /renko/bricks:
    get:
      tags: [Renko HFT]
      summary: Get recent Renko bricks
      description: "**Auth**: Any authenticated user (viewer+)"
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: last_n
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: List of recent bricks
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /renko/classified:
    get:
      tags: [Renko HFT]
      summary: Get classified bricks with swing labels (HH/HL/LH/LL)
      description: "**Auth**: Any authenticated user (viewer+)"
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: last_n
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: List of classified bricks
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /renko/signals:
    get:
      tags: [Renko HFT]
      summary: Get recent pattern signals
      description: "**Auth**: Any authenticated user (viewer+)"
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: last_n
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: List of pattern signals
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /renko/trades:
    get:
      tags: [Renko HFT]
      summary: Get recent trade records
      description: "**Auth**: Any authenticated user (viewer+)"
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: last_n
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: List of trade records
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /renko/swing-points:
    get:
      tags: [Renko HFT]
      summary: Get detected swing points
      description: "**Auth**: Any authenticated user (viewer+)"
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
        - name: last_n
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: List of swing points
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /renko/regime:
    post:
      tags: [Renko HFT]
      summary: Update the current HMM regime
      description: |
        Updates the HMM regime used by the signal filter for regime gate logic.

        **Auth**: Trader role or higher (require_write)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegimeInput' }
      responses:
        "200":
          description: Regime updated
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /renko/equity:
    post:
      tags: [Renko HFT]
      summary: Update the current account equity
      description: |
        Updates the account equity used by the risk manager.

        **Auth**: Trader role or higher (require_write)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquityInput' }
      responses:
        "200":
          description: Equity updated
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /renko/config:
    post:
      tags: [Renko HFT]
      summary: Update pipeline configuration (resets the pipeline)
      description: |
        Updates the pipeline configuration. **Warning**: This resets the entire
        pipeline — all bricks, signals, and trade history are lost.

        **Auth**: Admin only (require_admin)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigInput' }
      responses:
        "200":
          description: Configuration updated, pipeline reset
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /renko/reset:
    post:
      tags: [Renko HFT]
      summary: Reset the pipeline for a symbol
      description: |
        Resets the pipeline, clearing all bricks, signals, and trade history.

        **Auth**: Admin only (require_admin)
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Pipeline reset
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/ForbiddenError'

  /renko/backtest/stats:
    get:
      tags: [Renko HFT]
      summary: Get backtest/trading statistics from the journal
      description: "**Auth**: Any authenticated user (viewer+)"
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: symbol
          in: query
          schema: { type: string, default: SPY }
      responses:
        "200":
          description: Backtest statistics
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  # ── BATCH ────────────────────────────────────────────────────────────────

  /analyse/full:
    post:
      tags: [Full Pipeline]
      summary: One-shot full pipeline — regime + sizing + risk
      description: |
        Runs the complete pipeline in a single request:
        1. Fit dual Gaussian HMMs → regime posteriors + risk_multiplier
        2. Fractional Kelly → vol-scaled → regime-gated position size
        3. Historical VaR/CVaR, drawdown, stop/TP suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FullAnalysisRequest' }
            example:
              symbol: SPY
              prices: [450.1, 451.3, 449.8, 452.0]
              kelly_fraction: 0.5
              target_vol: 0.15
              base_risk_limit: 0.02
      responses:
        "200":
          description: Full analysis result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FullAnalysisResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  /regime/detect:
    post:
      tags: [Regime Detection]
      summary: Detect market regime from price series
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricePayload' }
      responses:
        "200":
          description: Regime classification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegimeResponse' }
        "422":
          $ref: '#/components/responses/ValidationError'

  /size/kelly:
