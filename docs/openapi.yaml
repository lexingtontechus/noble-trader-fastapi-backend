openapi: 3.1.0
info:
  title: Noble Trader Dynamic Regime Risk Management Platform
  description: "\n## Overview\n\nA quantitative trading risk management web service\
    \ built on:\n\n| Component | Library | Purpose |\n|-----------|---------|---------|\n\
    | **Regime Detection** | `hmmlearn` GaussianHMM | Classify market into volatility\
    \ x trend regimes |\n| **Position Sizing** | `scipy` + Kelly formula | Fractional\
    \ Kelly with vol-scaling & regime gating |\n| **Risk Analysis** | `numpy` / `scipy.stats`\
    \ | VaR, CVaR, drawdown, Sortino, Calmar |\n| **Correlation** | `hmmlearn` + DCC\
    \ | Portfolio-level correlation regime detection |\n| **Optimisation** | `scipy.optimize`\
    \ | Drawdown-controlled max-Sharpe portfolio |\n| **Dynamic Masaniello** | Adaptive\
    \ batch sizing | Progress-dependent position sizing with regime quality overlay\
    \ |\n| **GPU HMM** | `pomegranate` (optional) | 10-50x HMM speedup on CUDA/MPS\
    \ |\n| **API Framework** | `FastAPI` + `pydantic v2` | Typed, validated, auto-documented\
    \ REST API |\n\n## Regime Labels\n\nThe HMM produces a **2D regime** combining:\n\
    - **Volatility**: `low` / `medium` / `high`\n- **Trend**: `bear` / `neutral` /\
    \ `bull`\n\nCombined label example: `low_vol_bull`, `high_vol_bear`, etc.\n\n\
    ## Risk Multiplier\n\nEach regime maps to a **risk_multiplier** [0.25 - 1.50]\
    \ that scales the Kelly fraction:\n- `low_vol_bull` -> 1.5x (max risk-on)\n- `high_vol_bear`\
    \ -> 0.25x (max defensive)\n\n## Authentication\n\nClerk JWT (primary) -> local\
    \ JWT -> API key fallback.\n\n## Recommended Workflow\n\n```\nPOST /analyse/full\
    \  ->  regime + sizing + risk in one call\nPOST /correlation/detect  ->  portfolio-level\
    \ correlation regime\nPOST /optimise/full  ->  correlation + optimisation one-shot\n\
    POST /optimise/masaniello  ->  portfolio optimise + per-asset Masaniello sizing\n\
    ```\n\n## Dynamic Masaniello (v5.1)\n\nTwo-stage pipeline connecting portfolio\
    \ optimisation to per-trade position sizing:\n\n1. **DrawdownOptimiser** → regime-adjusted\
    \ portfolio weights (what to hold)\n2. **DynamicMasanielloSizer** → per-asset\
    \ contract sizes (how much to hold)\n\nFormula: `f_i = β × (0.5 + M_i) × Q_i ×\
    \ DD_i × V_i`\n\n- M_i = urgency (wins needed / trades left)\n- Q_i = quality\
    \ (prob × regime × confidence)\n- DD_i = drawdown scaling (floor 0.25)\n- V_i\
    \ = volatility adjustment (ATR-based)\n\nEndpoints:\n- `POST /size/masaniello`\
    \ — single-trade Masaniello sizing\n- `POST /size/masaniello/batch` — batch Masaniello\
    \ sizing\n- `POST /optimise/masaniello` — full two-stage pipeline\n        "
  contact:
    name: Noble Trader Dynamic Regime Risk Platform
    email: nobletrader@0xdweb.com
  license:
    name: MIT
  version: 5.0.0
paths:
  /auth/token:
    post:
      tags:
      - Authentication
      summary: Issue a JWT access token
      description: 'Standard OAuth2 password flow.


        Supply `username` and `password` as form fields.

        Returns a Bearer JWT valid for `JWT_EXPIRE_MINS` minutes.


        Configure users via the `AUTH_USERS` environment variable:

        ```

        AUTH_USERS="admin:mysecret:admin,trader:pass123:trader"

        ```


        Roles: `admin` (full access) · `trader` (read + write) · `viewer` (read-only)'
      operationId: login_auth_token_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_auth_token_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Return current user info decoded from token
      description: 'Returns the identity and role extracted from the Bearer JWT.

        Useful for verifying a token is valid and checking its role.'
      operationId: me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh a (non-expired) token
      description: 'Issues a fresh token with a new expiry, keeping the same subject
        and role.

        Only works if the current token is still valid (not yet expired).'
      operationId: refresh_auth_refresh_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /auth/clerk/me:
    get:
      tags:
      - Authentication
      - Clerk Authentication
      summary: Return Clerk user info decoded from Clerk JWT token
      description: 'Returns the identity and metadata extracted from a valid Clerk
        JWT token.


        Requires a valid Clerk JWT in the Authorization header:

        ```

        Authorization: Bearer <clerk_jwt_token>

        ```


        Returns user information including:

        - sub: Clerk user ID

        - email: User''s email address

        - first_name, last_name: User''s name

        - username: User''s username

        - role: User role (from token claims or default ''viewer'')'
      operationId: clerk_me_auth_clerk_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClerkUserInfo'
      security:
      - HTTPBearer: []
  /auth/clerk/verify:
    post:
      tags:
      - Authentication
      - Clerk Authentication
      summary: Verify a Clerk JWT token
      description: 'Verify a Clerk JWT token and return user information.


        This endpoint accepts a Clerk JWT token in the request body and

        returns whether it''s valid along with the decoded user information.


        Request body:

        ```json

        {"token": "eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..."}

        ```'
      operationId: verify_clerk_token_endpoint_auth_clerk_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClerkVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClerkVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/clerk/config:
    get:
      tags:
      - Authentication
      - Clerk Authentication
      summary: Get Clerk authentication configuration
      description: 'Returns Clerk authentication configuration status.


        Useful for client-side configuration and debugging.'
      operationId: clerk_config_auth_clerk_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /regime/detect:
    post:
      tags:
      - Regime Detection
      summary: Detect market regime from price series
      description: 'Fits dual Gaussian HMMs (volatility + trend) on the supplied price
        series

        and returns posterior regime probabilities plus a risk multiplier.'
      operationId: detect_regime_regime_detect_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegimeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegimeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /regime/detect-v2:
    post:
      tags:
      - Regime Detection
      summary: Enhanced regime detection with configurable 2-4 states, auto-labeled
      description: 'Enhanced HMM regime detection (v2):

        - Configurable 2-4 states per dimension (volatility + trend)

        - Auto-labeled states sorted by emission means

        - Transition matrix entropy (measures regime persistence)

        - Regime stability metric (fraction of recent bars in same regime)


        With 2 states: vol={low, high}, trend={bear, bull} → 4 combined regimes

        With 3 states: vol={low, med, high}, trend={bear, neutral, bull} → 9 combined
        regimes

        With 4 states: vol={low, med_low, med_high, high}, trend={strong_bear, bear,
        bull, strong_bull} → 16 combined regimes'
      operationId: detect_regime_v2_regime_detect_v2_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegimeV2Request'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegimeV2Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /size/kelly:
    post:
      tags:
      - Position Sizing
      summary: Regime-aware Kelly position sizing
      description: 'Computes fractional Kelly position size, optionally scaled by:

        - Current realised volatility vs target volatility

        - Dynamic regime risk multiplier from HMM'
      operationId: kelly_size_size_kelly_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /size/masaniello:
    post:
      tags:
      - Position Sizing
      summary: Dynamic Masaniello position sizing (Path B)
      description: "Computes position size using the Dynamic Masaniello formula:\n\
        \n    f_i = β × (0.5 + M_i) × Q_i × DD_i × V_i\n\nWhere:\n- M_i = Masaniello\
        \ progress factor (urgency: wins needed / trades left)\n- Q_i = Model quality\
        \ (prob × regime × confidence)\n- DD_i = Drawdown scaling (never below 0.25)\n\
        - V_i = Volatility adjustment (ATR-based)\n\nSupports optional Kelly overlay\
        \ cap and regime auto-detection from prices."
      operationId: masaniello_size_size_masaniello_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasanielloSizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasanielloSizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /size/masaniello/batch:
    post:
      tags:
      - Position Sizing
      summary: Batch Dynamic Masaniello sizing for a sequence of trades
      description: 'Sizes an entire batch of trades sequentially, with batch state

        (wins, losses, drawdown) flowing between trades automatically.


        Optionally provide outcomes and PnLs to update batch state as

        the batch is sized.'
      operationId: masaniello_batch_size_masaniello_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasanielloBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasanielloBatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /size/masaniello/portfolio:
    post:
      tags:
      - Position Sizing
      summary: Portfolio-optimised Masaniello sizing across multiple assets
      description: 'Two-stage pipeline for multi-asset position sizing:


        Stage 1: DrawdownOptimiser → regime-adjusted portfolio weights

        Stage 2: DynamicMasanielloSizer → per-asset contract sizes


        Each asset''s capital allocation comes from the optimiser, and

        the Masaniello formula sizes within that allocation.'
      operationId: masaniello_portfolio_size_masaniello_portfolio_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioMasanielloRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioMasanielloResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /risk/analyse:
    post:
      tags:
      - Risk Analysis
      summary: 'Full risk analysis: VaR, CVaR, drawdown, stop/TP suggestions'
      description: 'Computes comprehensive risk metrics including parametric + historical
        VaR/CVaR,

        max drawdown, Sortino & Calmar ratios, and regime-adjusted stop-loss/take-profit.'
      operationId: risk_analyse_risk_analyse_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /risk/analyze:
    post:
      tags:
      - Risk Analysis
      summary: Enhanced risk analysis with VaR/CVaR, stress tests, and regime context
      description: "Enhanced risk analysis (US spelling endpoint):\n1. Full VaR/CVaR\
        \ computation (parametric + historical)\n2. Regime-aware risk multiplier and\
        \ max loss\n3. Stress test scenarios:\n   - 2008-style crash (-30% in 2 weeks)\n\
        \   - Flash crash (-10% in 1 day)\n   - Volatility spike (3x vol for 1 week)\n\
        \   - Interest rate shock (+2% rates)\n   - Liquidity crisis (wider spreads,\
        \ worse execution)\n4. Stop-loss and take-profit guidance"
      operationId: risk_analyze_risk_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskAnalyzeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAnalyzeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analyse/full:
    post:
      tags:
      - Full Pipeline
      summary: 'One-shot: regime + Kelly sizing + risk metrics'
      description: 'Runs the complete pipeline in a single request:

        1. Fit HMM regime model → get vol/trend posteriors

        2. Compute regime-gated Kelly position size

        3. Compute VaR, CVaR, drawdown, and trade guidance

        Returns a nested JSON with all three result objects.'
      operationId: full_analysis_analyse_full_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FullAnalysisRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stream/seed:
    post:
      tags:
      - Live Stream
      summary: Seed a symbol session with historical prices
      description: 'Creates (or resets) a streaming session for `symbol` and pre-loads

        historical prices so the HMM can be fitted immediately. Must be called

        before streaming ticks for a new symbol.'
      operationId: seed_session_stream_seed_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stream/tick:
    post:
      tags:
      - Live Stream
      summary: Ingest one price tick and receive regime snapshot
      description: 'Push a single price tick. Returns a full `TickResponse` once the
        session

        has enough bars; returns `{"status": "buffering", "n_bars": N}` while warming
        up.


        The session must have been seeded first via `POST /stream/seed`.'
      operationId: ingest_tick_stream_tick_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TickIngest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TickResponse'
                - additionalProperties: true
                  type: object
                title: Response Ingest Tick Stream Tick Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stream/ticks:
    post:
      tags:
      - Live Stream
      summary: Ingest a batch of price ticks
      description: 'Replay or batch-ingest multiple ticks. Returns a snapshot for
        each tick

        (or a buffering stub when warming up). Useful for backtesting / replay.'
      operationId: ingest_ticks_stream_ticks_post
      parameters:
      - name: symbol
        in: query
        required: true
        schema:
          type: string
          title: Symbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_ingest_ticks_stream_ticks_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                  - $ref: '#/components/schemas/TickResponse'
                  - type: object
                    additionalProperties: true
                title: Response Ingest Ticks Stream Ticks Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stream/sessions:
    get:
      tags:
      - Live Stream
      summary: List all active streaming sessions
      operationId: list_sessions_stream_sessions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /stream/session/{symbol}:
    get:
      tags:
      - Live Stream
      summary: Get session status
      operationId: get_session_stream_session__symbol__get
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Live Stream
      summary: Remove a streaming session
      operationId: remove_session_stream_session__symbol__delete
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sse/{symbol}:
    get:
      tags:
      - Real-Time Streaming
      summary: Server-Sent Events stream for a symbol
      description: "SSE stream that pushes a JSON regime snapshot on every tick received\n\
        by the server for `symbol`. Subscribe from any browser with EventSource.\n\
        \nExample JS:\n    const es = new EventSource('/sse/SPY');\n    es.onmessage\
        \ = e => console.log(JSON.parse(e.data));"
      operationId: sse_symbol_sse__symbol__get
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sse/alerts:
    get:
      tags:
      - Real-Time Streaming
      summary: Global SSE stream for all regime-change alerts across all symbols
      description: 'Broadcasts regime-change alerts for all symbols to connected listeners.

        Only fires on regime state transitions (not every tick).


        Severity levels: info | warning | critical'
      operationId: sse_alerts_sse_alerts_get
      responses:
        '200':
          description: Successful Response
  /simulate/{symbol}:
    post:
      tags:
      - Simulation
      summary: Simulate regime transition paths forward in time
      description: 'Fits a 4-state HMM on the supplied price series, then simulates

        `n_paths` forward paths of `horizon` bars using the fitted

        Markov transition matrix.


        Returns:

        - Price fan (p5/p25/median/p75/p95) for each forward bar

        - Expected risk multiplier at each step

        - Terminal return distribution (mean, std, VaR95, CVaR95)

        - Most likely terminal regime

        - % of paths ending with a positive return

        - Mean maximum drawdown across paths'
      operationId: simulate_symbol_simulate__symbol__post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /portfolio:
    get:
      tags:
      - Portfolio
      summary: Aggregated regime + risk summary across all active sessions
      description: "Returns a portfolio-level view aggregating all (or specified)\
        \ active\nstreaming sessions:\n\n- Per-symbol: regime, confidence, risk_multiplier,\
        \ Kelly f*, VaR95, Sharpe\n- Portfolio: dominant regime, regime consensus,\
        \ avg risk multiplier,\n  portfolio VaR (independence assumption: √ΣVaR²),\
        \ risk flags\n\nRisk flags:\n- `high_risk_count`        — symbols with risk_multiplier\
        \ < 0.5\n- `concentration_flag`     — any symbol with recommended_f > 40%\n\
        - `regime_divergence_flag` — portfolio spans many different regime buckets\n\
        - `active_alerts`          — symbols that recently changed regime\n\nSymbols\
        \ must be seeded via POST /stream/seed before appearing here."
      operationId: get_portfolio_portfolio_get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: symbols
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated symbols. Omit for all active sessions.
          title: Symbols
        description: Comma-separated symbols. Omit for all active sessions.
      - name: kelly_fraction
        in: query
        required: false
        schema:
          type: number
          maximum: 1.0
          minimum: 0.1
          default: 0.5
          title: Kelly Fraction
      - name: target_vol
        in: query
        required: false
        schema:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0
          default: 0.15
          title: Target Vol
      - name: base_risk_limit
        in: query
        required: false
        schema:
          type: number
          maximum: 0.5
          exclusiveMinimum: 0
          default: 0.02
          title: Base Risk Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /portfolio/symbols:
    get:
      tags:
      - Portfolio
      summary: List symbols with active sessions
      description: Returns all symbols currently registered in the session registry.
      operationId: list_portfolio_symbols_portfolio_symbols_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
  /gpu/capabilities:
    get:
